            {/* Tags */}
            <div className="field-group">
              <label className="field-label">Tags <span style={{fontSize:9,color:"var(--text5)",fontWeight:400}}>(Enter to add — chased, news, late-entry...)</span></label>
              {(form.tags||[]).length>0&&(
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
                  {(form.tags||[]).map((tg,i)=>(
                    <span key={tg+i} style={{display:"inline-flex",alignItems:"center",gap:5,background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:6,padding:"4px 8px",fontSize:11,color:"var(--text2)",fontFamily:"DM Mono,monospace"}}>
                      #{tg}
                      <button onClick={()=>setForm(f=>({...f,tags:(f.tags||[]).filter((x,xi)=>xi!==i)}))}
                        style={{background:"none",border:"none",color:"var(--text5)",cursor:"pointer",padding:0,fontSize:13,lineHeight:1}}>×</button>
                    </span>
                  ))}
                </div>
              )}
              <input className="field-input" value={tagInput} placeholder="Add tag…"
                onChange={e=>setTagInput(e.target.value)}
                onKeyDown={e=>{
                  if(e.key==="Enter"||e.key===","){
                    e.preventDefault();
                    const v=tagInput.replace(/,/g,"").trim();
                    if(v&&!(form.tags||[]).some(x=>x.toLowerCase()===v.toLowerCase())&&(form.tags||[]).length<10){
                      setForm(f=>({...f,tags:[...(f.tags||[]),v]}));
                    }
                    setTagInput("");
                  }
                  if(e.key==="Backspace"&&!tagInput&&(form.tags||[]).length>0){
                    setForm(f=>({...f,tags:(f.tags||[]).slice(0,-1)}));
                  }
                }}/>
              {tagInput&&(()=>{
                const all={};
                trades.forEach(t=>(t.tags||[]).forEach(tg=>{all[tg.toLowerCase()]=tg;}));
                const q=tagInput.toLowerCase();
                const sugg=Object.values(all).filter(tg=>tg.toLowerCase().indexOf(q)===0&&!(form.tags||[]).some(x=>x.toLowerCase()===tg.toLowerCase())).slice(0,6);
                if(!sugg.length) return null;
                return(
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:6}}>
                    {sugg.map(tg=>(
                      <button key={tg} onClick={()=>{
                        if((form.tags||[]).length<10) setForm(f=>({...f,tags:[...(f.tags||[]),tg]}));
                        setTagInput("");
                      }} style={{background:"var(--accent-bg)",border:"1px solid var(--accent-dim)",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontSize:10,color:"var(--accent)",fontFamily:"DM Mono,monospace"}}>
                        #{tg}
                      </button>
                    ))}
                  </div>
                );
              })()}
            </div>

            <div className="field-group">
              <label className="field-label">Chart URL <span style={{fontSize:9,color:"var(--text5)",fontWeight:400}}>(TradingView, etc — optional)</span></label>
              <input className="field-input" type="url" inputMode="url" placeholder="https://www.tradingview.com/chart/..." value={form.chartUrl||""} onChange={setF("chartUrl")}/>
              {form.chartUrl&&(
                <a href={form.chartUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"var(--accent)",fontFamily:"DM Mono,monospace",display:"inline-flex",alignItems:"center",gap:4,marginTop:4,textDecoration:"none"}}>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                  Open chart
                </a>
              )}
            </div>

            <div className="field-group">
              <label className="field-label" style={{marginBottom:8}}>Chart Screenshots</label>
              <ImageUploader images={form.images||[]} onChange={upd=>setForm(f=>({...f,images:typeof upd==="function"?upd(f.images||[]):upd}))} onImageClick={(imgs,idx)=>setLightbox({images:imgs,start:idx})}/>
            </div>

            <button className="btn-primary" onClick={submit} data-save-trade style={{marginBottom:8}}>
              {editId?"Update Trade":"Log Trade"}
            </button>
          </div>
        )}

        {/* STATS */}
        {view==="stats"&&(
          <>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:16}}>
              <div className="section-title" style={{marginBottom:0}}>
                {statsTab==="all"?"All Accounts":statsTab==="stats"?"Performance":statsTab==="ai"?"AI Report":"Calendar"}
              </div>
              <div style={{position:"relative"}}>
                <button onClick={()=>setShowStatsMenu(v=>!v)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"1px solid var(--accent-dim)",borderRadius:8,padding:"0 12px",height:36,cursor:"pointer",color:"var(--accent)",fontFamily:"DM Mono,monospace",fontSize:11,transition:"all 0.15s"}}>
                  View
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                {showStatsMenu&&(
                  <>
                    <div style={{position:"fixed",inset:0,zIndex:99}} onClick={()=>setShowStatsMenu(false)}/>
                    <div style={{position:"absolute",right:0,top:"calc(100% + 6px)",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:6,zIndex:100,minWidth:140,boxShadow:"0 8px 32px rgba(0,0,0,0.4)"}}>
                    {[{k:"stats",l:"Performance"},{k:"calendar",l:"Calendar"}, ...(proxyUrl&&proxyUrl.trim().indexOf("https://")===0?[{k:"ai",l:"AI Report"}]:[]), ...(accounts.length>1?[{k:"all",l:"All Accounts"}]:[])].map(opt=>(
                      <button key={opt.k} onClick={()=>{setStatsTab(opt.k);setShowStatsMenu(false);}}
                        style={{display:"block",width:"100%",textAlign:"left",padding:"9px 12px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:"DM Mono,monospace",fontSize:12,background:statsTab===opt.k?"var(--accent-bg)":"transparent",color:statsTab===opt.k?"var(--accent)":"var(--text2)",transition:"all 0.15s"}}>
                        {opt.l}
                      </button>
                    ))}
                  </div>
                  </>
                )}
              </div>
            </div>

            {statsTab==="calendar"&&<CalendarView trades={trades} fmt={fmt} calc={calc} curr={curr} onDayFilter={(dateStr)=>{setFilterDateFrom(dateStr);setFilterDateTo(dateStr);setView("journal");}}/>}

            {statsTab==="ai"&&<AIReport trades={trades} stats={stats} fmt={fmt} curr={curr} apiKey={anthropicKey} proxyUrl={proxyUrl}/>}

            {statsTab==="all"&&(()=>{
              const allTrades = accounts.flatMap(acc=>{
                const key = acc.id==="default"?STORAGE_KEY:"logged_trades_"+acc.id;
                try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw).map(t=>({...t,_account:acc})):[];}catch{return[];}
              });
              // Detect mixed currencies
              const uniqueCurrencies=[...new Set(accounts.map(a=>a.currency||currency||"USD"))];
              const hasMixedCurrencies=uniqueCurrencies.length>1;
              const allPnl = allTrades.reduce((s,t)=>s+calc(t).pnl,0);
              const allWins = allTrades.filter(t=>calc(t).pnl>0);
              const allLosses = allTrades.filter(t=>calc(t).pnl<0);
              const allWr = (allWins.length+allLosses.length)>0?Math.round(allWins.length/(allWins.length+allLosses.length)*100):0;
              const allPf = allLosses.length>0?Math.abs(allWins.reduce((s,t)=>s+calc(t).pnl,0)/allLosses.reduce((s,t)=>s+calc(t).pnl,0)):allWins.length>0?Infinity:0;
              const rVals = allTrades.map(t=>calc(t).r).filter(r=>r!==null);
              const avgR = rVals.length?Math.round(rVals.reduce((s,r)=>s+r,0)/rVals.length*100)/100:0;
              return(
                <>
                  {hasMixedCurrencies&&(
                    <div style={{background:"#f6ad5512",border:"1px solid #f6ad5540",borderRadius:10,padding:"12px 16px",marginBottom:12,display:"flex",alignItems:"flex-start",gap:10}}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6ad55" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,marginTop:1}}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                      <div>
                        <div style={{fontSize:12,color:"#f6ad55",fontWeight:600,marginBottom:2}}>Mixed currencies ({uniqueCurrencies.join(", ")})</div>
                        <div style={{fontSize:11,color:"#f6ad5590",lineHeight:1.5}}>Total P&L combines {uniqueCurrencies.join(" + ")} without conversion. Per-account figures below are more accurate.</div>
                      </div>
                    </div>
                  )}
                  <div className="stat-grid" style={{marginBottom:12}}>
                    {[
                      {l:"Total P&L",v:fmt(allPnl),c:allPnl>=0?"var(--accent)":"#ff4d6d"},
                      {l:"Win Rate",v:allWr+"%",c:allWr>=50?"var(--accent)":"#ff4d6d"},
                      {l:"Total Trades",v:allTrades.length,c:"var(--text)"},
                      {l:"Profit Factor",v:allPf===Infinity?"∞":allPf>0?allPf.toFixed(2):"—",c:allPf>=1?"var(--accent)":"#ff4d6d"},
                      {l:"Avg R",v:avgR?(avgR>=0?"+":"")+avgR+"R":"—",c:avgR>=0?"var(--accent)":"#ff4d6d"},
                      {l:"Accounts",v:accounts.length,c:"var(--text)"},
                    ].map(s=>(
                      <div key={s.l} className="stat-card">
                        <div className="stat-label">{s.l}</div>
                        <div className="stat-value" style={{fontSize:18,color:s.c}}>{s.v}</div>
                      </div>
                    ))}
                  </div>

                  <div className="stat-card" style={{marginBottom:12}}>
                    <div className="stat-label" style={{marginBottom:14}}>By Account</div>
                    {accounts.map(acc=>{
                      const key = acc.id==="default"?STORAGE_KEY:"logged_trades_"+acc.id;
                      let accTrades=[];
                      try{ const raw=localStorage.getItem(key); accTrades=raw?JSON.parse(raw):[];}catch{}
                      const pnl = accTrades.reduce((s,t)=>s+calc(t).pnl,0);
                      const accWins=accTrades.filter(t=>calc(t).pnl>0).length;
                      const accLosses=accTrades.filter(t=>calc(t).pnl<0).length;
                      const wr = (accWins+accLosses)>0?Math.round(accWins/(accWins+accLosses)*100):0;
                      // Per-account max drawdown
                      let peak=0,maxDD=0,running=0;
                      [...accTrades].sort((a,b)=>a.date.localeCompare(b.date)||((a.id||0)-(b.id||0))).forEach(t=>{
                        running+=calc(t).pnl;
                        if(running>peak) peak=running;
                        const dd=peak-running;
                        if(dd>maxDD) maxDD=dd;
                      });
                      const maxPnl = Math.max(...accounts.map(a=>{
                        const k=a.id==="default"?STORAGE_KEY:"logged_trades_"+a.id;
                        try{const r=localStorage.getItem(k);return r?Math.abs(JSON.parse(r).reduce((s,t)=>s+calc(t).pnl,0)):0;}catch{return 0;}
                      }),1);
                      return(
                        <div key={acc.id} style={{marginBottom:16}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                            <div style={{width:10,height:10,borderRadius:"50%",background:acc.colour,flexShrink:0}}/>
                            <span style={{flex:1,fontSize:13,color:"var(--text)",fontWeight:500}}>{acc.name}</span>
                            {acc.currency&&acc.currency!==currency&&<span style={{fontSize:9,color:acc.colour||"var(--accent)",background:(acc.colour||"#00d49a")+"20",borderRadius:4,padding:"2px 6px",fontFamily:"DM Mono,monospace"}}>{acc.currency}</span>}
                            <span style={{fontSize:11,color:"var(--text4)"}}>{accTrades.length} trades</span>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                            <span style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em"}}>P&amp;L</span>
                            <span style={{fontSize:12,color:pnl>=0?"var(--accent)":"#ff4d6d"}}>{fmt(pnl)}</span>
                          </div>
                          <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden",marginBottom:6}}>
                            <div style={{height:"100%",width:Math.min(100,Math.abs(pnl)/maxPnl*100)+"%",background:acc.colour,borderRadius:2,opacity:0.8}}/>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                            <span style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em"}}>Win Rate</span>
                            <span style={{fontSize:12,color:wr>=50?"var(--accent)":"#ff4d6d"}}>{wr}%</span>
                          </div>
                          <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden",marginBottom:6}}>
                            <div style={{height:"100%",width:wr+"%",background:wr>=50?"var(--accent)":"#ff4d6d",borderRadius:2}}/>
                          </div>
                          {maxDD>0&&<div style={{display:"flex",justifyContent:"space-between"}}>
                            <span style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em"}}>Max Drawdown</span>
                            <span style={{fontSize:12,color:"#ff4d6d"}}>-{fmts(maxDD)}</span>
                          </div>}
                        </div>
                      );
                    })}
                  </div>

                  {/* Cross-account daily breakdown */}
                  {(()=>{
                    const days=[...new Set(allTrades.map(t=>t.date))].sort((a,b)=>b.localeCompare(a)).slice(0,14);
                    if(!days.length) return null;
                    return(
                      <div className="stat-card" style={{marginBottom:12}}>
                        <div className="stat-label" style={{marginBottom:14}}>By Day · All Accounts</div>
                        {days.map(d=>{
                          const dayTrades=allTrades.filter(t=>t.date===d);
                          const dayPnl=dayTrades.reduce((s,t)=>s+calc(t).pnl,0);
                          const dayWins=dayTrades.filter(t=>calc(t).pnl>0).length;
                          const dayLosses=dayTrades.filter(t=>calc(t).pnl<0).length;
                          const col=dayPnl>0?"var(--accent)":dayPnl<0?"#ff4d6d":"var(--text4)";
                          return(
                            <div key={d} style={{marginBottom:10}}>
                              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                                <div style={{display:"flex",alignItems:"center",gap:8}}>
                                  <span style={{fontSize:11,color:"var(--text2)",fontFamily:"DM Mono,monospace"}}>{formatDate(d)}</span>
                                  <span style={{fontSize:9,color:"var(--text4)"}}>{dayTrades.length}T · {dayWins}W/{dayLosses}L</span>
                                </div>
                                <span style={{fontSize:12,color:col,fontFamily:"DM Mono,monospace"}}>{dayPnl>=0?"+":""}{fmt(dayPnl)}</span>
                              </div>
                              <div style={{display:"flex",gap:2,height:4}}>
                                {accounts.map(acc=>{
                                  const aTrades=allTrades.filter(t=>t.date===d&&t._account&&t._account.id===acc.id);
                                  if(!aTrades.length) return null;
                                  const aPnl=aTrades.reduce((s,t)=>s+calc(t).pnl,0);
                                  return <div key={acc.id} title={acc.name+": "+fmt(aPnl)} style={{flex:1,height:4,borderRadius:2,background:aPnl>0?acc.colour:aPnl<0?"#ff4d6d":"var(--border)",opacity:0.8}}/>;
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()}
                </>
              );
            })()}

            {statsTab==="stats"&&(<>
            {stats.total===0?(
              <div className="empty">
                <svg width="100" height="64" viewBox="0 0 100 64" fill="none" style={{marginBottom:16,opacity:0.6}}>
                  <line x1="0" y1="60" x2="100" y2="60" stroke="#1c2230" strokeWidth="1"/>
                  <polygon points="0,60 6,60 22,42 38,54 50,60 64,34 76,46 88,14 88,60 0,60" fill="#00d49a" opacity="0.08"/>
                  <polyline points="0,60 6,60 22,42 38,54 50,60 64,34 76,46 88,14" stroke="#00d49a" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
                  <polyline points="22,42 64,34 88,14" stroke="#00d49a" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 3" opacity="0.3"/>
                  <circle cx="38" cy="54" r="2" fill="#00d49a" opacity="0.2"/>
                  <circle cx="76" cy="46" r="2" fill="#00d49a" opacity="0.25"/>
                  <circle cx="22" cy="42" r="2.5" fill="#00d49a" opacity="0.4"/>
                  <circle cx="64" cy="34" r="3" fill="#00d49a" opacity="0.6"/>
                  <circle cx="88" cy="14" r="4" fill="#00d49a"/>
                  <circle cx="88" cy="14" r="10" fill="#00d49a" opacity="0.08"/>
                  <circle cx="88" cy="14" r="18" fill="#00d49a" opacity="0.03"/>
                  <polyline points="84,20 88,13 92,20" stroke="#00d49a" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.5"/>
                </svg>
                <div className="empty-title">Nothing to analyse</div>
                <div className="empty-sub">Your stats will build as you log trades. Every trade tells a story.</div>
              </div>
            ):(
              <>
                {/* Export buttons moved to Settings */}

                <div className="stat-card" style={{marginBottom:12,padding:"16px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                    <div className="stat-label" style={{margin:0}}>Equity Curve</div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{display:"flex",border:"1px solid var(--border2)",borderRadius:6,overflow:"hidden"}}>
                        {[["dollar",curr.symbol],["r","R"]].map(([m,lbl])=>(
                          <button key={m} onClick={()=>setEquityMode(m)}
                            style={{padding:"3px 10px",border:"none",cursor:"pointer",fontSize:10,fontFamily:"DM Mono,monospace",background:equityMode===m?"var(--accent)":"transparent",color:equityMode===m?"var(--bg)":"var(--text4)",fontWeight:equityMode===m?600:400}}>
                            {lbl}
                          </button>
                        ))}
                      </div>
                      {stats.equity.length>=2&&<button className="btn-ghost" style={{padding:"4px 10px",fontSize:10}} onClick={()=>setShareCurve(true)}>Share</button>}
                    </div>
                  </div>
                  {stats.equity.length>=2&&(
                    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                      {["7D","1M","3M","All"].map(p=>(
                        <button key={p} onClick={()=>setEquityPeriod(p)}
                          style={{padding:"3px 10px",border:"1px solid "+(equityPeriod===p?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"DM Mono,monospace",background:equityPeriod===p?"var(--accent-bg)":"var(--input-bg)",color:equityPeriod===p?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>
                          {p}
                        </button>
                      ))}
                    </div>
                  )}
                  {(()=>{
                    const now = new Date();
                    const cutoffs={"7D":new Date(now.getTime()-7*86400000),"1M":new Date(now.getFullYear(),now.getMonth()-1,now.getDate()),"3M":new Date(now.getFullYear(),now.getMonth()-3,now.getDate())};
                    const cutoff = cutoffs[equityPeriod];
                    const sortedTrades = [...trades].sort((a,b)=>a.date.localeCompare(b.date)||((a.id||0)-(b.id||0)));
                    const periodTrades = cutoff ? sortedTrades.filter(t=>new Date(t.date)>=cutoff) : sortedTrades;
                    if(equityMode==="r"){
                      // Cumulative R — only trades with a valid R
                      const rTrades=periodTrades.filter(t=>cachedCalc(t).r!==null&&cachedCalc(t).r!==undefined);
                      let runR=0;
                      const periodEquityR=rTrades.map(t=>{runR+=cachedCalc(t).r;return{eq:Math.round(runR*100)/100};});
                      const periodTotalR=Math.round(rTrades.reduce((s,t)=>s+cachedCalc(t).r,0)*100)/100;
                      if(periodEquityR.length<2) return <div style={{textAlign:"center",padding:"40px 16px",color:"var(--text5)",fontSize:12,fontFamily:"DM Mono,monospace"}}>Need 2+ trades with a stop (R) to chart cumulative R.</div>;
                      return <EquityCurve equity={periodEquityR} totalPnl={periodTotalR} balance={0} curr={curr} isR={true}/>;
                    }
                    let run=0;
                    const periodEquity = periodTrades.map(t=>{run+=cachedCalc(t).pnl;return{eq:run};});
                    const periodPnl = periodTrades.reduce((s,t)=>s+cachedCalc(t).pnl,0);
                    return <EquityCurve equity={periodEquity} totalPnl={periodPnl} balance={balance} curr={curr}/>;
                  })()}
                </div>

                {/* Stats period filter */}
                <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                  {["This Wk","1M","3M","All"].map(p=>(
                    <button key={p} onClick={()=>setStatsPeriod(p)}
                      style={{padding:"4px 12px",border:"1px solid "+(statsPeriod===p?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"DM Mono,monospace",background:statsPeriod===p?"var(--accent-bg)":"var(--input-bg)",color:statsPeriod===p?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>
                      {p}
                    </button>
                  ))}
                  {statsPeriod!=="All"&&<span style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace",alignSelf:"center",marginLeft:4}}>Showing {statsPeriod} of trades</span>}
                </div>

                {/* Playbook filter — only show if playbooks exist */}
                {playbooks.length>0&&(
                  <div style={{display:"flex",gap:6,marginBottom:10,alignItems:"center"}}>
                    <span style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace",textTransform:"uppercase",letterSpacing:"0.08em",flexShrink:0}}>Playbook</span>
                    <select value={statsPlaybook} onChange={e=>setStatsPlaybook(e.target.value)}
                      style={{flex:1,background:"var(--input-bg)",border:"1px solid "+(statsPlaybook!=="all"?"var(--accent)":"var(--border2)"),borderRadius:6,padding:"5px 8px",color:statsPlaybook!=="all"?"var(--accent)":"var(--text3)",fontSize:11,fontFamily:"DM Mono,monospace"}}>
                      <option value="all">All Playbooks</option>
                      {playbooks.map(pb=><option key={pb.id} value={pb.id}>{pb.name}</option>)}
                    </select>
                    {statsPlaybook!=="all"&&(
                      <button onClick={()=>setStatsPlaybook("all")} style={{background:"none",border:"none",color:"var(--text5)",fontSize:14,cursor:"pointer",padding:"0 4px",flexShrink:0}}>×</button>
                    )}
                  </div>
                )}
                {statsPlaybook!=="all"&&stats.total===0&&(
                  <div style={{textAlign:"center",padding:"32px 16px",color:"var(--text5)",fontSize:12,fontFamily:"DM Mono,monospace"}}>No trades logged with this playbook{statsPeriod!=="All"?" in this period":""}.</div>
                )}

                <div className="stat-grid">
                  {[
                    {l:"Net P&L",v:fmt(stats.totalPnl),c:stats.totalPnl>=0?"var(--accent)":"#ff4d6d"},
                    {l:"Win Rate",v:`${stats.winRate.toFixed(1)}%`,s:`${stats.wins}W / ${stats.losses}L`},
                    ...(balance>0?[
                      {l:"Total Return",v:`${stats.totalPnl>=0?"+":""}${(balance>0?((stats.totalPnl/balance)*100).toFixed(2):"—")}%`,c:stats.totalPnl>=0?"var(--accent)":"#ff4d6d"},
                      {l:"Avg Risk/Trade",v:stats.total>0?`${(Math.abs(stats.avgLoss)/balance*100).toFixed(2)}%`:"—",c:"#f6ad55"},
                    ]:[]),
                    {l:"Profit Factor",v:stats.pf===Infinity?"∞":stats.pf>0?stats.pf.toFixed(2):"—"},
                    {l:"Expectancy",v:stats.total>0?(stats.expectancyDollar>=0?"+":"")+fmts(stats.expectancyDollar):"—",c:stats.expectancyDollar>=0?"var(--accent)":"#ff4d6d",s:"per trade"},
                    {l:"Expectancy R",v:stats.expectancyR!==null?(stats.expectancyR>=0?"+":"")+stats.expectancyR.toFixed(2)+"R":"—",c:stats.expectancyR>=0?"var(--accent)":"#ff4d6d",s:"per trade"},
                    {l:"Avg R",v:stats.avgR?`${stats.avgR>=0?"+":""}${stats.avgR.toFixed(2)}R`:"—",c:stats.avgR>=0?"var(--accent)":"#ff4d6d"},
                    {l:"Total R",v:(()=>{const rT=trades.filter(t=>calc(t).r!==null);const tot=Math.round(rT.reduce((s,t)=>s+(calc(t).r||0),0)*100)/100;return rT.length?`${tot>=0?"+":""}${tot}R`:"—";})(),c:(()=>{const rT=trades.filter(t=>calc(t).r!==null);const tot=rT.reduce((s,t)=>s+(calc(t).r||0),0);return tot>=0?"var(--accent)":"#ff4d6d";})()},
                    {l:"Avg Win",v:fmts(stats.avgWin),c:"#00d49a"},
                    {l:"Avg Loss",v:fmts(stats.avgLoss),c:"#ff4d6d"},
                    {l:"Best Trade",v:fmt(stats.best),c:"#00d49a",action:()=>{
                      const best=trades.reduce((b,t)=>cachedCalc(t).pnl>cachedCalc(b).pnl?t:b,trades[0]);
                      if(best){setSortOrder("pnl");setView("journal");}
                    }},
                    {l:"Worst Trade",v:fmt(stats.worst),c:"#ff4d6d",action:()=>{
                      const worst=trades.reduce((w,t)=>cachedCalc(t).pnl<cachedCalc(w).pnl?t:w,trades[0]);
                      if(worst){setSortOrder("pnl");setView("journal");}
                    }},
                    {l:"Total Trades",v:stats.total},
                    {l:"Current Streak",v:`${stats.streak.count}${stats.streak.type}`,c:stats.streak.type==="W"?"var(--accent)":"#ff4d6d"},
                    {l:"Max Drawdown",v:stats.maxDD>0?"-"+fmts(stats.maxDD):"—",c:stats.maxDD>0?"#ff4d6d":"var(--accent)"},
                    {l:"Avg Duration",v:stats.avgDuration>0?`${stats.avgDuration}m`:"—",c:"var(--text)"},
                    ...(stats.avgSlippage!==null?[{l:"Avg Slippage",v:(stats.avgSlippage>=0?"+":"")+stats.avgSlippage,c:stats.avgSlippage>0?"#ff4d6d":stats.avgSlippage<0?"var(--accent)":"var(--text)"}]:[]),
                  ].map(s=>(
                    <div key={s.l} className="stat-card" onClick={s.action||undefined}
                      style={{cursor:s.action?"pointer":"default",transition:s.action?"opacity 0.15s":undefined}}
                      onMouseEnter={e=>{if(s.action)e.currentTarget.style.opacity="0.8";}}
                      onMouseLeave={e=>{if(s.action)e.currentTarget.style.opacity="1";}}>
                      <div className="stat-label" style={{display:"flex",alignItems:"center",gap:4}}>
                        {s.l}
                        {s.action&&<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>}
                      </div>
                      <div className="stat-value" style={{color:s.c||"var(--text)"}}>{s.v}</div>
                      {s.s&&<div className="stat-sub">{s.s}</div>}
                    </div>
                  ))}
                </div>

                {/* By Day of Week */}
                {trades.length>0&&(()=>{
                  const rows = Object.entries(stats.byDay).filter(([,d])=>d.count>0);
                  if(!rows.length) return null;
                  const maxAbs = Math.max(...rows.map(r=>Math.abs(r[1].pnl)),1);
                  const shortDay = d=>d.slice(0,3);
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div onClick={()=>setOpenbyDay(v=>!v)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",marginBottom:openbyDay?14:0}}>
                        <div className="stat-label" style={{margin:0}}>By Day of Week</div>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{transition:"transform 0.2s",transform:openbyDay?"rotate(180deg)":"rotate(0deg)"}}><polyline points="6 9 12 15 18 9"/></svg>
                      </div>
                      {openbyDay&&(
                      <div>
                      {/* Bar chart row */}
                      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:12}}>
                        {["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(day=>{
                          const d = stats.byDay[day];
                          const pct = d.count ? Math.min(100,Math.abs(d.pnl)/maxAbs*100) : 0;
                          const col = d.pnl>0?"#00d49a":d.pnl<0?"#ff4d6d":"var(--border3)";
                          const wr = d.count?Math.round(d.wins/d.count*100):0;
                          return(
                            <div key={day} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                              {/* Bar */}
                              <div style={{height:60,display:"flex",alignItems:"flex-end",width:"100%"}}>
                                <div style={{width:"100%",height:(Math.max(pct,d.count?4:0))+"%",background:col,borderRadius:"3px 3px 0 0",opacity:d.count?1:0.2,minHeight:d.count?4:0}}/>
                              </div>
                              {/* Day label */}
                              <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.05em"}}>{shortDay(day)}</div>
                              {/* Win rate */}
                              {d.count>0&&<div style={{fontSize:9,color:col,fontWeight:500}}>{wr}%</div>}
                              {/* Trade count */}
                              {d.count>0&&<div style={{fontSize:9,color:"var(--text4)"}}>{d.count}t</div>}
                            </div>
                          );
                        })}
                      </div>
                      {/* Best/worst day */}
                      {rows.length>0&&(()=>{
                        const sorted = [...rows].sort((a,b)=>b[1].pnl-a[1].pnl);
                        const best = sorted[0];
                        const worst = sorted[sorted.length-1];
                        const bestWr = Object.entries(stats.byDay).filter(([,d])=>d.count>=2).sort((a,b)=>(b[1].wins/b[1].count)-(a[1].wins/a[1].count))[0];
                        return(
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                            <div style={{background:"#00d49a10",border:"1px solid #00d49a20",borderRadius:8,padding:"10px 12px"}}>
                              <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Best Day</div>
                              <div style={{fontSize:13,color:"var(--accent)",fontWeight:500}}>{best[0].slice(0,3)}</div>
                              <div style={{fontSize:10,color:"var(--text4)",marginBottom:2}}>{formatDate(best[1].lastDate||"")}</div>
                              <div style={{fontSize:11,color:"var(--accent-dim)"}}>{fmt(best[1].pnl)}</div>
                            </div>
                            <div style={{background:"#ff4d6d10",border:"1px solid #ff4d6d20",borderRadius:8,padding:"10px 12px"}}>
                              <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Worst Day</div>
                              <div style={{fontSize:13,color:"#ff4d6d",fontWeight:500}}>{worst[0].slice(0,3)}</div>
                              <div style={{fontSize:10,color:"var(--text4)",marginBottom:2}}>{formatDate(worst[1].lastDate||"")}</div>
                              <div style={{fontSize:11,color:"#ff4d6d80"}}>{fmt(worst[1].pnl)}</div>
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                    )}
                    </div>
                  );
                })()}

                {/* Weekly Discipline Summary */}
                {trades.length>0&&(()=>{
                  const week=7;
                  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-week);
                  const cutStr=cutoff.toISOString().split("T")[0];
                  const recent=trades.filter(t=>t.date>=cutStr);
                  if(!recent.length) return null;
                  const scores=recent.map(t=>calcDisciplineScore(t));
                  const avg=scores.reduce((s,x)=>s+x,0)/scores.length;
                  const lowDisc=recent.filter(t=>calcDisciplineScore(t)<=4);
                  const noNotes=recent.filter(t=>(t.notes||"").trim().length<20);
                  const noChecklist=recent.filter(t=>(t.checklist||[]).length===0);
                  const revenge=recent.filter(t=>(t.emotion||[]).includes("😡 Revenge"));
                  const col=avg>=8?"#00d49a":avg>=6?"#f6ad55":"#ff4d6d";
                  return(
                    <div className="stat-card" style={{marginBottom:12,borderColor:col+"30"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                        <div className="stat-label" style={{margin:0}}>Last 7 Days · Discipline</div>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:18,color:col}}>{avg.toFixed(1)}<span style={{fontSize:11,fontWeight:400,color:"var(--text4)"}}>/10</span></div>
                          <button className="btn-ghost" style={{padding:"4px 10px",fontSize:10}} onClick={()=>{
                            const wins=recent.filter(t=>cachedCalc(t).pnl>0).length;
                            const losses=recent.filter(t=>cachedCalc(t).pnl<0).length;
                            const totalPnl=recent.reduce((s,t)=>s+cachedCalc(t).pnl,0);
                            const rVals=recent.map(t=>cachedCalc(t).r).filter(r=>r!==null);
                            const avgR=rVals.length?Math.round(rVals.reduce((s,r)=>s+r,0)/rVals.length*100)/100:null;
                            const wr=(wins+losses)>0?Math.round(wins/(wins+losses)*100):0;
                            const bySess={};
                            recent.forEach(t=>{if(!t.session)return;const p=cachedCalc(t).pnl;if(!bySess[t.session])bySess[t.session]=0;bySess[t.session]+=p;});
                            const bestSess=Object.entries(bySess).sort((a,b)=>b[1]-a[1])[0];
                            // Compute current streak for share card
                            const sortedAll2=[...trades].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
                            let shareStreak=0,shareStreakDir=null;
                            sortedAll2.forEach(t=>{const p=cachedCalc(t).pnl;if(p>0){if(shareStreakDir==="win"||shareStreakDir===null){shareStreak++;shareStreakDir="win";}else{shareStreak=1;shareStreakDir="win";}}else if(p<0){if(shareStreakDir==="loss"||shareStreakDir===null){shareStreak++;shareStreakDir="loss";}else{shareStreak=1;shareStreakDir="loss";}}});
                            setShareWeek({count:recent.length,wins,losses,totalPnl,avgR,wr,discAvg:avg,discCol:col,bestSess:bestSess?bestSess[0]:null,bestSessPnl:bestSess?bestSess[1]:null,cutStr,streak:shareStreak>1?{count:shareStreak,dir:shareStreakDir}:null});
                          }}>Share</button>
                        </div>
                      </div>
                      <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden",marginBottom:12}}>
                        <div style={{height:"100%",width:(avg/10*100)+"%",background:col,borderRadius:2,transition:"width 0.4s"}}/>
                      </div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                        {noNotes.length>0&&<span style={{fontSize:9,padding:"3px 8px",borderRadius:5,background:"#ff4d6d15",color:"#ff4d6d",fontFamily:"DM Mono,monospace"}}>{noNotes.length} no notes</span>}
                        {noChecklist.length>0&&<span style={{fontSize:9,padding:"3px 8px",borderRadius:5,background:"#f6ad5515",color:"#f6ad55",fontFamily:"DM Mono,monospace"}}>{noChecklist.length} no checklist</span>}
                        {revenge.length>0&&<span style={{fontSize:9,padding:"3px 8px",borderRadius:5,background:"#ff4d6d15",color:"#ff4d6d",fontFamily:"DM Mono,monospace"}}>{revenge.length} revenge {revenge.length===1?"trade":"trades"}</span>}
                        {lowDisc.length===0&&<span style={{fontSize:9,padding:"3px 8px",borderRadius:5,background:"#00d49a15",color:"#00d49a",fontFamily:"DM Mono,monospace"}}>All trades well documented ✓</span>}
                      </div>
                    </div>
                  );
                })()}

                {/* Weekly Review Auto-Summary */}
                {trades.length>=5&&(()=>{
                  const now=new Date();
                  const monDiff=(now.getDay()+6)%7;
                  const mon=new Date(now);mon.setDate(now.getDate()-monDiff);
                  const weekStart=mon.toISOString().split("T")[0];
                  const weekTrades=trades.filter(t=>t.date>=weekStart);
                  if(!weekTrades.length) return null;
                  const cache7={};
                  weekTrades.forEach(t=>{cache7[t.id]=calc(t);});
                  const cc7=t=>cache7[t.id]||calc(t);
                  const wins7=weekTrades.filter(t=>cc7(t).pnl>0);
                  const losses7=weekTrades.filter(t=>cc7(t).pnl<0);
                  const pnl7=weekTrades.reduce((s,t)=>s+cc7(t).pnl,0);
                  const wr7=(wins7.length+losses7.length)>0?Math.round(wins7.length/(wins7.length+losses7.length)*100):0;
                  const rVals7=weekTrades.map(t=>cc7(t).r).filter(r=>r!==null);
                  const avgR7=rVals7.length?Math.round(rVals7.reduce((s,r)=>s+r,0)/rVals7.length*100)/100:null;
                  // Best playbook this week
                  const pbSummary={};
                  weekTrades.forEach(t=>{
                    if(!t.playbookId) return;
                    if(!pbSummary[t.playbookId]){pbSummary[t.playbookId]={pnl:0,count:0,wins:0};}
                    const r=cc7(t);
                    pbSummary[t.playbookId].pnl+=r.pnl;
                    pbSummary[t.playbookId].count++;
                    if(r.pnl>0) pbSummary[t.playbookId].wins++;
                  });
                  const pbEntries=Object.entries(pbSummary).sort((a,b)=>b[1].pnl-a[1].pnl);
                  const bestPb=pbEntries.length>0?pbEntries[0]:null;
                  const bestPbName=bestPb?(((playbooks||[]).find(p=>String(p.id)===String(bestPb[0])))||{}).name||null:null;
                  // Best/worst day
                  const dayMap7={};
                  weekTrades.forEach(t=>{if(!dayMap7[t.date])dayMap7[t.date]={pnl:0,count:0};dayMap7[t.date].pnl+=cc7(t).pnl;dayMap7[t.date].count++;});
                  const dayEntries=Object.entries(dayMap7).sort((a,b)=>b[1].pnl-a[1].pnl);
                  const bestDay=dayEntries[0];
                  const worstDay=dayEntries[dayEntries.length-1];
                  // Insights
                  const insights=[];
                  if(losses7.length>0&&wins7.length>0){
                    const avgWin=wins7.reduce((s,t)=>s+cc7(t).pnl,0)/wins7.length;
                    const avgLoss=Math.abs(losses7.reduce((s,t)=>s+cc7(t).pnl,0)/losses7.length);
                    if(avgLoss>avgWin*1.5) insights.push("Losses averaging "+fmt(avgLoss)+" vs wins "+fmt(avgWin)+" — review stop placement");
                  }
                  const mistakeTrades=weekTrades.filter(t=>t.mistake);
                  if(mistakeTrades.length>0) insights.push(mistakeTrades.length+" mistake trade"+(mistakeTrades.length!==1?"s":"")+" flagged this week");
                  if(wr7<40) insights.push("Win rate below 40% — consider reducing size until edge returns");
                  const disc7=weekTrades.map(t=>calcDisciplineScore(t));
                  const avgDisc7=disc7.reduce((s,x)=>s+x,0)/disc7.length;
                  if(avgDisc7<6) insights.push("Discipline avg "+avgDisc7.toFixed(1)+"/10 — log notes and emotion more consistently");
                  if(weekBestStreak>=5) insights.push("Best win streak this week: "+weekBestStreak+" trades in a row 🔥");
                  if(curStreakDir==="win"&&curStreak>=3) insights.push("Active "+curStreak+"-trade win streak — protect your edge");
                  if(curStreakDir==="loss"&&curStreak>=3) insights.push("On a "+curStreak+"-trade losing streak — consider reducing size or taking a break");
                  // Current streak from all trades (up to today)
                  const sortedAll=[...trades].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
                  let curStreak=0,curStreakDir=null;
                  sortedAll.forEach(t=>{const p=cachedCalc(t).pnl;if(p>0){if(curStreakDir==="win"||curStreakDir===null){curStreak++;curStreakDir="win";}else{curStreak=1;curStreakDir="win";}}else if(p<0){if(curStreakDir==="loss"||curStreakDir===null){curStreak++;curStreakDir="loss";}else{curStreak=1;curStreakDir="loss";}}});
                  // Best win streak this week
                  let weekBestStreak=0,weekCurStreak=0;
                  const sortedWeek=[...weekTrades].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
                  sortedWeek.forEach(t=>{if(cc7(t).pnl>0){weekCurStreak++;weekBestStreak=Math.max(weekBestStreak,weekCurStreak);}else if(cc7(t).pnl<0){weekCurStreak=0;}});
                  const col7=pnl7>=0?"var(--accent)":"#ff4d6d";
                  return(
                    <div className="stat-card" style={{marginBottom:12,borderColor:col7+"30"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                        <div className="stat-label" style={{margin:0}}>This Week</div>
                        <div style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace",marginTop:1}}>{weekStart} →</div>
                        <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:16,color:col7}}>{pnl7>=0?"+":""}{fmt(pnl7)}</div>
                      </div>
                      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:14}}>
                        <div><div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Trades</div><div style={{fontSize:15,fontWeight:500,color:"var(--text)"}}>{weekTrades.length}</div></div>
                        <div><div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Win Rate</div><div style={{fontSize:15,fontWeight:500,color:wr7>=50?"var(--accent)":"#ff4d6d"}}>{wr7}%</div></div>
                        {avgR7!==null&&<div><div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Avg R</div><div style={{fontSize:15,fontWeight:500,color:avgR7>=0?"var(--accent)":"#ff4d6d"}}>{avgR7>=0?"+":""}{avgR7}R</div></div>}
                        {curStreakDir&&<div><div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Streak</div><div style={{fontSize:15,fontWeight:500,color:curStreakDir==="win"?"var(--accent)":"#ff4d6d"}}>{curStreak}{curStreakDir==="win"?"W":"L"}</div></div>}
                      </div>
                      {bestDay&&dayEntries.length>1&&(
                        <div style={{display:"flex",gap:8,marginBottom:12}}>
                          <div style={{flex:1,background:"#00d49a10",border:"1px solid #00d49a20",borderRadius:8,padding:"8px 10px"}}>
                            <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Best Day</div>
                            <div style={{fontSize:11,color:"var(--accent)",fontFamily:"DM Mono,monospace"}}>{formatDate(bestDay[0])}</div>
                            <div style={{fontSize:12,color:"var(--accent)",fontWeight:600}}>{bestDay[1].pnl>=0?"+":""}{fmt(bestDay[1].pnl)}</div>
                          </div>
                          {worstDay[1].pnl<0&&(
                            <div style={{flex:1,background:"#ff4d6d10",border:"1px solid #ff4d6d20",borderRadius:8,padding:"8px 10px"}}>
                              <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Worst Day</div>
                              <div style={{fontSize:11,color:"#ff4d6d",fontFamily:"DM Mono,monospace"}}>{formatDate(worstDay[0])}</div>
                              <div style={{fontSize:12,color:"#ff4d6d",fontWeight:600}}>{fmt(worstDay[1].pnl)}</div>
                            </div>
                          )}
                        </div>
                      )}
                      {bestPbName&&(
                        <div style={{fontSize:11,color:"var(--text3)",marginBottom:10}}>Top playbook: <span style={{color:"var(--accent)",fontWeight:600}}>{bestPbName}</span> {bestPb[1].pnl>=0?"+":""}{fmt(bestPb[1].pnl)} ({Math.round(bestPb[1].wins/bestPb[1].count*100)}% WR)</div>
                      )}
                      {insights.length>0&&(
                        <div style={{borderTop:"1px solid var(--border)",paddingTop:10,marginTop:2}}>
                          <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>Insights</div>
                          {insights.map((ins,i)=>(
                            <div key={i} style={{display:"flex",gap:6,marginBottom:5}}>
                              <span style={{color:"#f6ad55",flexShrink:0,fontSize:11}}>&#9670;</span>
                              <span style={{fontSize:11,color:"var(--text2)",lineHeight:1.5}}>{ins}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })()}

                {/* R-Multiple Distribution */}
                {stats.rBuckets&&stats.rBuckets.some(b=>b.count>0)&&(()=>{
                  const maxCount=Math.max(...stats.rBuckets.map(b=>b.count),1);
                  const totalR2=stats.rBuckets.reduce((s,b)=>s+b.count,0);
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                        <div className="stat-label" style={{margin:0}}>R Distribution</div>
                        <div style={{fontSize:10,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>{totalR2} trades</div>
                      </div>
                      <div style={{display:"flex",gap:4,alignItems:"flex-end",height:60}}>
                        {stats.rBuckets.map((b,i)=>{
                          const pct=b.count/maxCount*100;
                          const isPos=i>=3;
                          const col=b.l==="0-1"?"#f6ad55":isPos?"var(--accent)":"#ff4d6d";
                          return(
                            <div key={b.l} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                              <div style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace"}}>{b.count>0?b.count:""}</div>
                              <div style={{width:"100%",height:pct*0.5+"px",minHeight:b.count>0?3:0,background:col,borderRadius:"2px 2px 0 0",opacity:0.85,transition:"height 0.3s"}}/>
                              <div style={{fontSize:9,color:i===3?"#f6ad55":isPos?"var(--accent)":"#ff4d6d",fontFamily:"DM Mono,monospace",textAlign:"center",lineHeight:1.2}}>{b.l}</div>
                            </div>
                          );
                        })}
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",marginTop:8,paddingTop:8,borderTop:"1px solid var(--border2)"}}>
                        <span style={{fontSize:9,color:"#ff4d6d",fontFamily:"DM Mono,monospace"}}>{stats.rBuckets.slice(0,3).reduce((s,b)=>s+b.count,0)} losing</span>
                        <span style={{fontSize:9,color:"#f6ad55",fontFamily:"DM Mono,monospace"}}>{stats.rBuckets[3].count} scratch</span>
                        <span style={{fontSize:9,color:"var(--accent)",fontFamily:"DM Mono,monospace"}}>{stats.rBuckets.slice(4).reduce((s,b)=>s+b.count,0)} winning</span>
                      </div>
                    </div>
                  );
                })()}

                {/* Streak History */}
                {stats.streakHistory&&stats.streakHistory.runs.length>=2&&(()=>{
                  const last12=stats.streakHistory.runs.slice(-12);
                  const maxCount=Math.max(...last12.map(r=>r.count),1);
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                        <div className="stat-label" style={{margin:0}}>Streak History</div>
                        <div style={{display:"flex",gap:10,fontSize:10,fontFamily:"DM Mono,monospace"}}>
                          <span style={{color:"var(--accent)"}}>Best {stats.streakHistory.best}W</span>
                          <span style={{color:"#ff4d6d"}}>Worst {stats.streakHistory.worst}L</span>
                        </div>
                      </div>
                      <div style={{display:"flex",gap:2,alignItems:"flex-end",height:40}}>
                        {last12.map((r,i)=>{
                          const h=Math.max(4,r.count/maxCount*40);
                          return(
                            <div key={i} title={r.count+(r.dir==='W'?' win streak':' loss streak')}
                              style={{flex:1,height:h+"px",background:r.dir==='W'?"var(--accent)":"#ff4d6d",borderRadius:"2px 2px 0 0",opacity:0.75,transition:"height 0.3s"}}/>
                          );
                        })}
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace"}}>
                        <span>← older</span>
                        <span>current →</span>
                      </div>
                    </div>
                  );
                })()}

                {/* Time-of-Day Heatmap */}
                {stats.timedCount>=5&&(()=>{
                  const hours=Object.keys(stats.byHour).map(Number).sort((a,b)=>a-b);
                  if(!hours.length) return null;
                  const maxAbs=Math.max(...hours.map(h=>Math.abs(stats.byHour[h].pnl)),1);
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div onClick={()=>setOpenbyHour(v=>!v)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",marginBottom:openbyHour?14:0}}>
                        <div className="stat-label" style={{margin:0}}>By Hour of Day</div>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace"}}>{stats.timedCount} timed</span>
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{transition:"transform 0.2s",transform:openbyHour?"rotate(180deg)":"rotate(0deg)"}}><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                      </div>
                      {openbyHour&&(
                      <div>
                        <div style={{display:"flex",gap:2,alignItems:"flex-end",height:50,marginBottom:4}}>
                          {hours.map(h=>{
                            const d=stats.byHour[h];
                            const wr=d.count?(d.wins/d.count*100):0;
                            const barH=Math.max(4,(Math.abs(d.pnl)/maxAbs)*50);
                            const col=d.pnl>=0?"var(--accent)":"#ff4d6d";
                            return(
                              <div key={h} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                                <div title={h+":00 — "+d.count+" trades, "+Math.round(wr)+"% WR, P&L: "+d.pnl.toFixed(0)}
                                  style={{width:"100%",height:barH+"px",background:col,borderRadius:"2px 2px 0 0",opacity:0.8}}/>
                                <div style={{fontSize:8,color:"var(--text5)",fontFamily:"DM Mono,monospace",marginTop:2,textAlign:"center",lineHeight:1,overflow:"hidden"}}>{hours.length>8&&h%2!==0?"":h}</div>
                              </div>
                            );
                          })}
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",marginTop:12,fontSize:9,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>
                          {(()=>{
                            const best=hours.reduce((b,h)=>stats.byHour[h].pnl>stats.byHour[b].pnl?h:b,hours[0]);
                            const worst=hours.reduce((w,h)=>stats.byHour[h].pnl<stats.byHour[w].pnl?h:w,hours[0]);
                            return<><span style={{color:"var(--accent)"}}>Best: {best}:00</span><span style={{color:"#ff4d6d"}}>Worst: {worst}:00</span></>;
                          })()}
                        </div>
                      </div>
                      )}
                    </div>
                  );
                })()}

                {/* Bias Discipline */}
                {stats.plan&&stats.plan.tagged>=3&&(()=>{
                  const p=stats.plan;
                  const withWr=(p.withWins+p.withLosses)>0?Math.round(p.withWins/(p.withWins+p.withLosses)*100):0;
                  const agWr=(p.againstWins+p.againstLosses)>0?Math.round(p.againstWins/(p.againstWins+p.againstLosses)*100):0;
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                        <div className="stat-label" style={{margin:0}}>Bias Discipline</div>
                        <span style={{fontSize:11,color:p.adherence>=75?"var(--accent)":p.adherence>=50?"#f6ad55":"#ff4d6d",fontFamily:"DM Mono,monospace",fontWeight:600}}>{p.adherence}% with plan</span>
                      </div>
                      <div style={{height:6,background:"var(--surface2)",borderRadius:3,overflow:"hidden",marginBottom:12}}>
                        <div style={{width:p.adherence+"%",height:"100%",background:p.adherence>=75?"var(--accent)":p.adherence>=50?"#f6ad55":"#ff4d6d",borderRadius:3}}/>
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,fontFamily:"DM Mono,monospace",marginBottom:5}}>
                        <span style={{color:"var(--text3)"}}>With plan ({p.withCount})</span>
                        <span><span style={{color:withWr>=50?"var(--accent)":"#ff4d6d"}}>{withWr}% WR</span> <span style={{color:p.withPnl>=0?"var(--accent)":"#ff4d6d",fontWeight:600,marginLeft:6}}>{p.withPnl>=0?"+":""}{fmt(p.withPnl)}</span></span>
                      </div>
                      {p.againstCount>0&&(
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,fontFamily:"DM Mono,monospace"}}>
                          <span style={{color:"var(--text3)"}}>Against ({p.againstCount})</span>
                          <span><span style={{color:agWr>=50?"var(--accent)":"#ff4d6d"}}>{agWr}% WR</span> <span style={{color:p.againstPnl>=0?"var(--accent)":"#ff4d6d",fontWeight:600,marginLeft:6}}>{p.againstPnl>=0?"+":""}{fmt(p.againstPnl)}</span></span>
                        </div>
                      )}
                    </div>
                  );
                })()}

                {/* Excursion (MFE/MAE) */}
                {stats.excursion&&stats.excursion.count>=3&&(()=>{
                  const ex=stats.excursion;
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                        <div className="stat-label" style={{margin:0}}>Excursion (MFE/MAE)</div>
                        <span style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace"}}>{ex.count} tracked</span>
                      </div>
                      {ex.capture!==null&&(
                        <div style={{marginBottom:12}}>
                          <div style={{fontSize:11,color:"var(--text2)",fontFamily:"DM Mono,monospace",marginBottom:5}}>
                            Winners bank <span style={{color:"var(--accent)",fontWeight:600}}>+{ex.avgBankedR.toFixed(1)}R</span> · moves run to <span style={{color:"#a78bfa",fontWeight:600}}>+{ex.avgMfeR.toFixed(1)}R</span>
                          </div>
                          <div style={{height:6,background:"var(--surface2)",borderRadius:3,overflow:"hidden"}}>
                            <div style={{width:Math.min(100,ex.capture)+"%",height:"100%",background:ex.capture>=70?"var(--accent)":ex.capture>=45?"#f6ad55":"#ff4d6d",borderRadius:3}}/>
                          </div>
                          <div style={{fontSize:9,color:"var(--text4)",fontFamily:"DM Mono,monospace",marginTop:3}}>You capture {ex.capture}% of the available move{ex.capture<45?" — you may be cutting winners early":""}</div>
                        </div>
                      )}
                      {ex.losersTotal>0&&(
                        <div style={{fontSize:10,color:ex.losersGreen>0?"#f6ad55":"var(--text4)",fontFamily:"DM Mono,monospace",marginBottom:ex.avgHeat!==null?6:0}}>
                          {ex.losersGreen} of {ex.losersTotal} loser{ex.losersTotal===1?"":"s"} {ex.losersTotal===1?"was":"were"} up 1R+ before losing{ex.losersGreen>0?" — consider partials":""}
                        </div>
                      )}
                      {ex.avgHeat!==null&&(
                        <div style={{fontSize:10,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>
                          Winners take {ex.avgHeat>=0?"+":""}{ex.avgHeat.toFixed(2)}R average heat before working
                        </div>
                      )}
                    </div>
                  );
                })()}

                {/* Duration vs Outcome */}
                {stats.durOutcome&&stats.durOutcome.count>=5&&stats.durOutcome.avgWinDur!==null&&stats.durOutcome.avgLossDur!==null&&(()=>{
                  const d=stats.durOutcome;
                  const maxDur=Math.max(d.avgWinDur,d.avgLossDur,1);
                  const holdLosers=d.avgLossDur>d.avgWinDur*1.5;
                  const cutFast=d.avgWinDur>d.avgLossDur*1.5;
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                        <div className="stat-label" style={{margin:0}}>Time in Trade</div>
                        <span style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace"}}>{d.count} timed</span>
                      </div>
                      <div style={{marginBottom:8}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                          <span style={{fontSize:10,color:"var(--accent)",fontFamily:"DM Mono,monospace"}}>Winners ({d.wins})</span>
                          <span style={{fontSize:11,color:"var(--accent)",fontFamily:"DM Mono,monospace",fontWeight:600}}>{d.avgWinDur}m avg</span>
                        </div>
                        <div style={{height:5,background:"var(--surface2)",borderRadius:3,overflow:"hidden"}}>
                          <div style={{width:(d.avgWinDur/maxDur*100)+"%",height:"100%",background:"var(--accent)",opacity:0.7,borderRadius:3}}/>
                        </div>
                      </div>
                      <div style={{marginBottom:10}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                          <span style={{fontSize:10,color:"#ff4d6d",fontFamily:"DM Mono,monospace"}}>Losers ({d.losses})</span>
                          <span style={{fontSize:11,color:"#ff4d6d",fontFamily:"DM Mono,monospace",fontWeight:600}}>{d.avgLossDur}m avg</span>
                        </div>
                        <div style={{height:5,background:"var(--surface2)",borderRadius:3,overflow:"hidden"}}>
                          <div style={{width:(d.avgLossDur/maxDur*100)+"%",height:"100%",background:"#ff4d6d",opacity:0.7,borderRadius:3}}/>
                        </div>
                      </div>
                      {holdLosers&&<div style={{fontSize:10,color:"#f6ad55",fontFamily:"DM Mono,monospace",lineHeight:1.5}}>You hold losers {Math.round(d.avgLossDur/Math.max(d.avgWinDur,1)*10)/10}x longer than winners — classic loss aversion. Honour the stop sooner.</div>}
                      {cutFast&&<div style={{fontSize:10,color:"var(--accent)",fontFamily:"DM Mono,monospace",lineHeight:1.5}}>Losers cut fast, winners held — textbook trade management.</div>}
                      {!holdLosers&&!cutFast&&<div style={{fontSize:10,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>Hold times are balanced across outcomes.</div>}
                    </div>
                  );
                })()}

                {/* By Tag */}
                {stats.byTag&&Object.keys(stats.byTag).length>0&&Object.values(stats.byTag).reduce((s,d)=>s+d.count,0)>=3&&(()=>{
                  const tags=Object.values(stats.byTag).sort((a,b)=>b.count-a.count).slice(0,8);
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div className="stat-label" style={{marginBottom:12}}>By Tag</div>
                      {tags.map((d,i)=>{
                        const wr=(d.wins+d.losses)>0?Math.round(d.wins/(d.wins+d.losses)*100):0;
                        return(
                          <div key={d.label} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0",borderBottom:i===tags.length-1?"none":"1px solid var(--border2)"}}>
                            <span style={{fontSize:11,color:"var(--text2)",fontFamily:"DM Mono,monospace",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"38%"}}>#{d.label}</span>
                            <span style={{fontSize:9,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>{d.count}x</span>
                            <span style={{fontSize:9,color:wr>=50?"var(--accent)":"#ff4d6d",fontFamily:"DM Mono,monospace"}}>{wr}%</span>
                            <span style={{fontSize:11,color:d.pnl>=0?"var(--accent)":"#ff4d6d",fontFamily:"DM Mono,monospace",fontWeight:600,textAlign:"right",minWidth:70}}>{d.pnl>=0?"+":""}{fmt(d.pnl)}</span>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}

                {/* By Month */}
                {stats.byMonth&&Object.keys(stats.byMonth).length>=2&&(()=>{
                  const months=Object.keys(stats.byMonth).sort().reverse().slice(0,12);
                  const fmtMonth=(m)=>{const parts=m.split("-");const d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,1);return d.toLocaleString("en-US",{month:"short"})+" "+parts[0].slice(2);};
                  const maxAbs=Math.max(...months.map(m=>Math.abs(stats.byMonth[m].pnl)),1);
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                        <div className="stat-label" style={{margin:0}}>By Month</div>
                        {months.length===12&&<span style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace"}}>last 12</span>}
                      </div>
                      {months.map((m,idx)=>{
                        const d=stats.byMonth[m];
                        const wr=(d.wins+d.losses)>0?Math.round(d.wins/(d.wins+d.losses)*100):0;
                        const barW=Math.abs(d.pnl)/maxAbs*100;
                        return(
                          <div key={m} style={{marginBottom:idx===months.length-1?0:10}}>
                            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
                              <span style={{fontSize:11,color:"var(--text2)",fontFamily:"DM Mono,monospace",width:56,flexShrink:0}}>{fmtMonth(m)}</span>
                              <span style={{fontSize:9,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>{d.count} trades</span>
                              <span style={{fontSize:9,color:wr>=50?"var(--accent)":"#ff4d6d",fontFamily:"DM Mono,monospace"}}>{wr}%</span>
                              <span style={{fontSize:11,color:d.pnl>=0?"var(--accent)":"#ff4d6d",fontFamily:"DM Mono,monospace",fontWeight:600,textAlign:"right",minWidth:72}}>{d.pnl>=0?"+":""}{fmt(d.pnl)}</span>
                            </div>
                            <div style={{height:3,background:"var(--surface2)",borderRadius:2,overflow:"hidden"}}>
                              <div style={{width:barW+"%",height:"100%",background:d.pnl>=0?"var(--accent)":"#ff4d6d",opacity:0.6,borderRadius:2}}/>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}

                {/* By Asset Class */}
                {trades.length>0&&(()=>{
                  const acs=[["Futures","futures","#60a5fa"],["Crypto","crypto","#a78bfa"],["Forex","forex","#f6ad55"]];
                  const active=acs.filter(([,k])=>stats.byAC[k]&&stats.byAC[k].count>0);
                  if(active.length<2) return null;
                  const maxAbs=Math.max(...active.map(([,k])=>Math.abs(stats.byAC[k].pnl)),1);
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div onClick={()=>setOpenbyAC(v=>!v)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",marginBottom:openbyAC?14:0}}>
                        <div className="stat-label" style={{margin:0}}>By Asset Class</div>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{transition:"transform 0.2s",transform:openbyAC?"rotate(180deg)":"rotate(0deg)"}}><polyline points="6 9 12 15 18 9"/></svg>
                      </div>
                      {openbyAC&&active.map(([label,key,col])=>{
                        const d=stats.byAC[key];
                        const wr=(d.wins+d.losses)>0?Math.round(d.wins/(d.wins+d.losses)*100):0;
                        const barPct=Math.min(100,Math.abs(d.pnl)/maxAbs*100);
                        return(
                          <div key={key} style={{marginBottom:14}}>
                            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5,alignItems:"center"}}>
                              <div style={{display:"flex",alignItems:"center",gap:6}}>
                                <span style={{width:8,height:8,borderRadius:"50%",background:col,display:"inline-block",flexShrink:0}}/>
                                <span style={{fontSize:12,color:"var(--text2)",fontWeight:500}}>{label}</span>
                              </div>
                              <span style={{fontSize:11,color:"var(--text4)"}}>{d.count} trade{d.count!==1?"s":""}</span>
                            </div>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                              <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>P&L</span>
                              <span style={{fontSize:12,color:d.pnl>=0?"var(--accent)":"#ff4d6d"}}>{fmt(d.pnl)}</span>
                            </div>
                            <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden",marginBottom:4}}>
                              <div style={{height:"100%",width:barPct+"%",background:d.pnl>=0?col:"#ff4d6d",borderRadius:2}}/>
                            </div>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                              <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>Win Rate</span>
                              <span style={{fontSize:11,color:wr>=50?"var(--accent)":"#ff4d6d"}}>{wr}%</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}

                {/* By Session */}
                {Object.keys(stats.bySess).length>0&&(()=>{
                  const rows=Object.entries(stats.bySess).sort((a,b)=>b[1].pnl-a[1].pnl);
                  const maxAbs=rows.length?Math.max(...rows.map(r=>Math.abs(r[1].pnl))):1;
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div onClick={()=>setOpenbySess(v=>!v)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",marginBottom:openbySess?14:0}}>
                        <div className="stat-label" style={{margin:0}}>By Session</div>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",transition:"transform 0.2s",transform:openbySess?"rotate(180deg)":"rotate(0deg)"}}><polyline points="6 9 12 15 18 9"/></svg>
                      </div>
                      {openbySess&&rows.map(([s,d])=>{
                        const wr=d.count?Math.round(d.wins/d.count*100):0;
                        return(
                          <div key={s} style={{marginBottom:14}}>
                            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                              <span style={{fontSize:12,color:"var(--text2)",fontWeight:500}}>{s}</span>
                              <span style={{fontSize:11,color:"var(--text4)"}}>{d.count} trade{d.count!==1?"s":""}</span>
                            </div>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                              <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>P&amp;L</span>
                              <span style={{fontSize:12,color:d.pnl>=0?"var(--accent)":"#ff4d6d"}}>{fmt(d.pnl)}</span>
                            </div>
                            <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden",marginBottom:6}}>
                              <div style={{height:"100%",width:(Math.min(100,Math.abs(d.pnl)/maxAbs*100))+"%",background:d.pnl>=0?"var(--accent)":"#ff4d6d",borderRadius:2}}/>
                            </div>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                              <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>Win Rate</span>
                              <span style={{fontSize:12,color:wr>=50?"var(--accent)":"#ff4d6d"}}>{wr}%</span>

                              <span style={{fontSize:12,color:d.pnl>=0?"var(--accent)":"#ff4d6d"}}>{fmt(d.pnl)}</span>
                            </div>
                            <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden",marginBottom:6}}>
                              <div style={{height:"100%",width:(Math.min(100,Math.abs(d.pnl)/maxAbs*100))+"%",background:d.pnl>=0?"var(--accent)":"#ff4d6d",borderRadius:2}}/>
                            </div>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                              <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>Win Rate</span>
                              <span style={{fontSize:12,color:wr>=50?"var(--accent)":"#ff4d6d"}}>{wr}%</span>
                            </div>
                            <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden"}}>
                              <div style={{height:"100%",width:wr+"%",background:wr>=50?"var(--accent)":"#ff4d6d",borderRadius:2}}/>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}

                {/* By Instrument */}
                {Object.keys(stats.byInst).length>0&&(()=>{
                  const rows=Object.entries(stats.byInst).sort((a,b)=>b[1].pnl-a[1].pnl);
                  const maxAbs=rows.length?Math.max(...rows.map(r=>Math.abs(r[1].pnl))):1;
                  return(
                    <div className="stat-card" style={{marginBottom:12}}>
                      <div onClick={()=>setOpenbyInst(v=>!v)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",marginBottom:openbyInst?14:0}}>

                      {openbyInst&&rows.map(([inst,d])=>{
                        const wr=d.count?Math.round(d.wins/d.count*100):0;
                        return(
                          <div key={inst} style={{marginBottom:14}}>
                            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                              <span style={{fontSize:13,color:"var(--text)",fontWeight:500,fontFamily:"Syne,sans-serif"}}>{inst}</span>
                              <span style={{fontSize:11,color:"var(--text4)"}}>{d.count} trade{d.count!==1?"s":""}</span>
                            </div>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                              <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>P&amp;L</span>
                              <span style={{fontSize:12,color:d.pnl>=0?"var(--accent)":"#ff4d6d"}}>{fmt(d.pnl)}</span>
                            </div>

                              <div style={{height:"100%",width:(Math.min(100,Math.abs(d.pnl)/maxAbs*100))+"%",background:d.pnl>=0?"var(--accent)":"#ff4d6d",borderRadius:2}}/>
                            </div>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                              <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>Win Rate</span>
                              <span style={{fontSize:12,color:wr>=50?"var(--accent)":"#ff4d6d"}}>{wr}%</span>
                            </div>
                            <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden"}}>
                              <div style={{height:"100%",width:wr+"%",background:wr>=50?"var(--accent)":"#ff4d6d",borderRadius:2}}/>
                            </div>
                          </div>

                      })}
                    </div>
