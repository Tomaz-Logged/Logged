// focused input, then leaves it displaced on close - freezing internal scrolling.
// Snap the window back whenever focus leaves an input or the visual viewport changes.
document.addEventListener('focusout',function(){setTimeout(function(){window.scrollTo(0,0);document.body.scrollTop=0;},60);});

function calc(t) {
  const inst = INSTRUMENTS.find(i=>i.symbol===t.instrument)
    || (typeof CRYPTO_INSTRUMENTS!=="undefined"&&CRYPTO_INSTRUMENTS.find(i=>i.symbol===t.instrument))
    || (typeof FOREX_INSTRUMENTS!=="undefined"&&FOREX_INSTRUMENTS.find(i=>i.symbol===t.instrument));
  if(!inst||!t.entry) return {pnl:0,ticks:0,r:null,avgExit:null};
  const dir = t.direction==="Long"?1:-1;

  // ── Crypto & Forex: risk-based (balance-%) model ──────────────────────────
  // For these asset classes `contracts` holds the RISK % of balance, not a
  // contract count. Position is sized so hitting the stop loses exactly that %.
  //   riskAmt   = balanceAtEntry × risk%/100
  //   posSize   = riskAmt / |entry − stop|     (asset units)
  //   pnl       = (exit − entry) × dir × posSize
  if(t.assetClass==="crypto" || t.assetClass==="forex") {
    const entry = parseFloat(t.entry);
    const stop  = parseFloat(t.stop);
    const riskPct = parseFloat(t.contracts);              // % of balance risked
    const bal = parseFloat(t.balanceAtEntry);             // captured at save time
    // Need entry, stop (for sizing) and a valid balance + risk to produce money figures
    const canSize = !isNaN(entry)&&!isNaN(stop)&&!isNaN(riskPct)&&!isNaN(bal)&&bal>0&&riskPct>0&&entry!==stop;

    if(t.outcome==="BE") return {pnl:0, ticks:0, r:0, avgExit:entry, pctModel:true, unpriced:false};

    // Determine exit price: SL→stop, else weighted TP (fallback to single exit field)
    let exitPrice=null;
    if(t.outcome==="SL" && !isNaN(stop)) exitPrice=stop;
    else {
      const tps=(t.tps||[]).filter(tp=>tp.price);
      if(tps.length){
        const tc=tps.reduce((s,tp)=>s+(parseFloat(tp.contracts)||1),0);
        exitPrice=tps.reduce((s,tp)=>s+(parseFloat(tp.price)||0)*(parseFloat(tp.contracts)||1),0)/tc;
      } else if(t.exit) exitPrice=parseFloat(t.exit);
    }
    if(exitPrice===null||isNaN(exitPrice)) return {pnl:0,ticks:0,r:null,avgExit:null,pctModel:true,unpriced:true};

    const stopDist = Math.abs(entry-stop);
    // R multiple = how many times the risk distance the exit travelled (signed)
    const rMultiple = stopDist>0 ? dir*(exitPrice-entry)/stopDist : null;
    let pnl=0;
    if(canSize){
      const riskAmt = bal*(riskPct/100);
      const posSize = riskAmt/stopDist;                  // asset units
      pnl = Math.round((exitPrice-entry)*dir*posSize*100)/100;
    }
    return {
      pnl,
      ticks:0,                                           // not meaningful for %-model
      r: rMultiple!==null?Math.round(rMultiple*100)/100:null,
      avgExit:Math.round(exitPrice*100000)/100000,
      pctModel:true,
      unpriced:!canSize                                  // flag: can't show $ without balance
    };
  }
  // ──────────────────────────────────────────────────────────────────────────

  // SL outcome — use stop price
  if(t.outcome==="SL"&&t.stop&&parseFloat(t.stop)) {
    const ticks = dir*(parseFloat(t.stop)-parseFloat(t.entry))/inst.tickSize;
    const contracts = parseFloat(t.contracts)||1;
    const pnl = Math.round(ticks*inst.tickValue*contracts*100)/100;
    const r = -1;
    return {pnl, ticks:Math.round(ticks*10)/10, r, avgExit:parseFloat(t.stop)};
  }

  // Breakeven outcome
  if(t.outcome==="BE") {
    return {pnl:0, ticks:0, r:0, avgExit:parseFloat(t.entry)};
  }

  const contracts = parseFloat(t.contracts)||1;
  const tps = (t.tps||[]).filter(tp=>tp.price).map(tp=>({
    ...tp,
    contracts: parseFloat(tp.contracts)||contracts
  }));

  // Legacy: old trade with exit field
  if(!tps.length && t.exit) {
    const ticks = dir*(parseFloat(t.exit)-parseFloat(t.entry))/inst.tickSize;
    const pnl = Math.round(ticks*inst.tickValue*(parseInt(t.contracts)||1)*100)/100;
    const st = t.stop ? Math.abs(parseFloat(t.entry)-parseFloat(t.stop))/inst.tickSize : null;
    const r = st ? Math.round(ticks/st*100)/100 : null;
    return {pnl, ticks:Math.round(ticks*10)/10, r, avgExit:parseFloat(t.exit)};
  }
  if(!tps.length) {
    // No TP price entered yet — can't calculate
    return {pnl:0,ticks:0,r:null,avgExit:null};
  }

  // Weighted average exit across all TPs
  const tpContracts = tps.reduce((s,tp)=>s+(parseFloat(tp.contracts)||0),0);
  // Scale-out runner accounting: if TP contracts < position size, the remaining
  // contracts closed elsewhere. runnerExit holds that price (e.g. a runner that
  // came back to stop, or a manual close). Default: remaining closed at stop.
  const remainingContracts = Math.max(0, contracts - tpContracts);
  let runnerExit = null;
  if(remainingContracts > 0){
    if(t.runnerExit!==undefined && t.runnerExit!==null && t.runnerExit!=="" && !isNaN(parseFloat(t.runnerExit))){
      runnerExit = parseFloat(t.runnerExit);
    } else if(t.stop && parseFloat(t.stop)){
      runnerExit = parseFloat(t.stop); // assume the runner stopped out
    }
  }
  // All exit legs (TPs + runner) for weighting and gross
  const legs = tps.map(tp=>({price:parseFloat(tp.price)||0, contracts:parseFloat(tp.contracts)||0}));
  if(remainingContracts>0 && runnerExit!==null) legs.push({price:runnerExit, contracts:remainingContracts});
  const totalContracts = legs.reduce((s,l)=>s+l.contracts,0);
  const weightedExit = totalContracts>0 ? legs.reduce((s,l)=>s+l.price*l.contracts,0) / totalContracts : parseFloat(tps[0].price)||0;
  const ticks = dir*(weightedExit-parseFloat(t.entry))/inst.tickSize;
  const gross = legs.reduce((s,l)=>{
    const legTicks = dir*(l.price-parseFloat(t.entry))/inst.tickSize;
    return s + legTicks*inst.tickValue*l.contracts;
  },0);
  const pnl = Math.round(gross*100)/100;
  const st = t.stop ? Math.abs(parseFloat(t.entry)-parseFloat(t.stop))/inst.tickSize : null;
  const r = st ? Math.round(ticks/st*100)/100 : null;
  // Risk/Reward: how many R is the TP target (always positive — it's the potential)
  const tp1Ticks = tps[0] ? Math.abs(dir*(parseFloat(tps[0].price)-parseFloat(t.entry))/inst.tickSize) : null;
  const rr = st && tp1Ticks ? Math.round(tp1Ticks/st*100)/100 : null;
  return {pnl, ticks:Math.round(ticks*10)/10, r, rr, avgExit:Math.round(weightedExit*100)/100, hasRunner:remainingContracts>0, runnerContracts:remainingContracts, runnerExit};
}

function parseCSVText(text){
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(inQ){
      if(c==='"'&&n==='"'){field+='"';i++;}
      else if(c==='"'){inQ=false;}
      else field+=c;
    } else {
      if(c==='"')inQ=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c==='\r'){}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

function exportFullBackup(tradeCount){
  const EXCLUDE=["logged_pin","logged_anthropic_key","logged_proxy_url"];
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf("logged_")===0&&EXCLUDE.indexOf(k)===-1){data[k]=localStorage.getItem(k);}
  }
  const payload={app:"Logged",version:1,exportedAt:new Date().toISOString(),data:data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="logged-backup-"+new Date().toISOString().split("T")[0]+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  try{localStorage.setItem("logged_last_backup",JSON.stringify({ts:Date.now(),count:tradeCount||0}));}catch(e){}
  return Object.keys(data).length;
}
function validateBackup(obj){
  if(!obj||typeof obj!=="object") return {valid:false,error:"Not a valid file"};
  if(obj.app!=="Logged"||!obj.data||typeof obj.data!=="object") return {valid:false,error:"Not a Logged backup file"};
  const keys=Object.keys(obj.data).filter(k=>k.indexOf("logged_")===0);
  if(!keys.length) return {valid:false,error:"Backup contains no data"};
  let tradeCount=0, accounts=1;
  try{tradeCount=(JSON.parse(obj.data["logged_v1"]||"[]")||[]).length;}catch(e){}
  try{
    const acc=JSON.parse(obj.data["logged_accounts_v1"]||"[]");
    if(acc&&acc.length) accounts=acc.length;
    (acc||[]).forEach(a=>{if(a&&a.id&&a.id!=="default"){try{tradeCount+=(JSON.parse(obj.data["logged_trades_"+a.id]||"[]")||[]).length;}catch(e){}}});
  }catch(e){}
  return {valid:true,keys:keys.length,tradeCount:tradeCount,accounts:accounts,exportedAt:obj.exportedAt||"unknown"};
}
function applyBackup(obj){
  Object.entries(obj.data).forEach(([k,v])=>{if(k.indexOf("logged_")===0){try{localStorage.setItem(k,v);}catch(e){}}});
  location.reload();
}

function csvNorm(h){return h.toLowerCase().trim().replace(/[_\-.\/]/g,' ').replace(/\s+/g,' ');}
function detectCSVMapping(headers){
  const map={};
  const nsyn=Object.fromEntries(Object.entries(CSV_FIELD_SYNONYMS).map(([f,arr])=>[f,arr.map(csvNorm)]));
  headers.forEach((h,i)=>{const nh=csvNorm(h);for(const [field,syns] of Object.entries(nsyn)){if(map[field]!==undefined)continue;if(syns.some(s=>nh===s)){map[field]=i;return;}}});
  headers.forEach((h,i)=>{const nh=csvNorm(h);for(const [field,syns] of Object.entries(nsyn)){if(map[field]!==undefined)continue;if(Object.values(map).includes(i))continue;if(syns.some(s=>nh.includes(s))){map[field]=i;return;}}});
  return map;
}
function csvNormDirection(v){if(!v)return 'Long';const s=v.toLowerCase().trim();if(['sell','short','bear','sld','sold'].some(x=>s.includes(x))||s==='s')return 'Short';if(['buy','long','bull','bot','bought'].some(x=>s.includes(x))||s==='b')return 'Long';return 'Long';}
function csvNormDate(v){
  if(!v)return '';v=v.trim();
  if(/^\d{4}[-.]\d{2}[-.]\d{2}/.test(v))return v.slice(0,10).replace(/\./g,'-');
  const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let [_,a,b,y]=m;if(y.length===2)y='20'+y;let day=a,mon=b;if(parseInt(a)>12){day=a;mon=b;}else if(parseInt(b)>12){day=b;mon=a;}return `${y}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}
  const d=new Date(v);if(!isNaN(d))return d.toISOString().slice(0,10);
  return '';
}
function csvNum(v){if(v==null)return '';let s=String(v).trim();const paren=/^\(.*\)$/.test(s);s=s.replace(/[^0-9.\-]/g,'');let n=parseFloat(s);if(isNaN(n))return '';if(paren)n=-Math.abs(n);return n;}
function csvDetectAssetClass(instrument, mappedAssetClass){
  // 1. Use explicit assetClass column if present
  if(mappedAssetClass){
    const ac=(mappedAssetClass||'').toLowerCase().trim();
    if(ac.includes('crypto')||ac.includes('coin')||ac.includes('digital')) return 'crypto';
    if(ac.includes('forex')||ac.includes('fx')||ac.includes('currency')) return 'forex';
    if(ac.includes('future')||ac.includes('cme')||ac.includes('contract')) return 'futures';
  }
  // 2. Auto-detect from instrument name
  const inst=(instrument||'').toUpperCase().trim();
  // Forex: pairs with / or 3+3 letter pattern for known pairs
  if(/^[A-Z]{3}\/[A-Z]{3}$/.test(inst)) return 'forex';
  if(/^(EUR|GBP|USD|JPY|AUD|NZD|CAD|CHF)[A-Z]{3}$/.test(inst)&&inst.length===6) return 'forex';
  // Crypto: known coins
  const cryptoSyms=['BTC','ETH','SOL','XRP','ADA','DOGE','AVAX','MATIC','LINK','ATOM','ARB','OP','WLD','SUI','APT','BNB','LTC','BCH','UNI','AAVE','CRV','GMX','BLUR','PERP','GRT','NEAR','FTM','ALGO','DOT','SHIB'];
  if(cryptoSyms.includes(inst)) return 'crypto';
  if(inst.endsWith('-USD')||inst.endsWith('-USDT')||inst.endsWith('-PERP')) return 'crypto';
  // Futures: known CME/CBOT symbols
  const futureSyms=['ES','MES','NQ','MNQ','YM','MYM','RTY','M2K','GC','MGC','SI','CL','MCL','NG','ZB','ZN','ZF','ZT','6E','6B','6J','6A','6C'];
  if(futureSyms.includes(inst)) return 'futures';
  // Default: futures (most common for manual imports)
  return 'futures';
}

function csvRowsToTrades(rows,map){
  const body=rows.slice(1);
  const get=(row,field)=>map[field]!==undefined?row[map[field]]:undefined;
  return body.map((row,idx)=>{
    const entry=csvNum(get(row,'entry')), exit=csvNum(get(row,'exit')), stop=csvNum(get(row,'stop'));
    const _mfe=csvNum(get(row,'mfe')), _mae=csvNum(get(row,'mae'));
    const ct=csvNum(get(row,'contracts'))||1;
    const pnl=csvNum(get(row,'pnl'));
    const outcome=pnl!==''?(pnl<0?'SL':pnl===0?'BE':'TP'):'TP';
    const rawInst=(get(row,'instrument')||'').trim().toUpperCase();
    const assetClass=csvDetectAssetClass(rawInst, get(row,'assetClass'));
    return {
      _row:idx+2,
      date:csvNormDate(get(row,'date')),
      time:(get(row,'time')||'').trim().slice(0,5),
      instrument:rawInst,
      direction:csvNormDirection(get(row,'direction')),
      contracts:ct,
      entry:entry===''?'':String(entry),
      stop:stop===''?'':String(stop),
      exit:exit===''?'':String(exit),
      tps:exit!==''?[{price:String(exit),contracts:String(ct)}]:[{price:'',contracts:''}],
      outcome,
      assetClass,
      chartUrl:(get(row,'chartUrl')||'').trim(),
      mfe:_mfe===''?'':String(_mfe),
      mae:_mae===''?'':String(_mae),
      tags:(get(row,'tags')||'').split(/[;,]/).map(s=>s.trim()).filter(Boolean).slice(0,10),
      _pnl:pnl,
    };
  });
}

function exportExcel(trades, returnString) {
  const headers = ["Date","Time","Instrument","Asset Class","Direction","Contracts","Entry","TP1","TP1 Qty","TP2","TP2 Qty","TP3","TP3 Qty","Avg Exit","Stop","Ticks","P&L","R","Outcome","Strategy","Session","Trade Type","Setup","Duration","Balance At Entry","Notes","Mistake","Playbook ID","Chart URL","MFE","MAE","Tags"];
  const rows = trades.map(t => {
    const {pnl,ticks,r,avgExit} = calc(t);
    const tps = t.tps||[];
    return [t.date,t.time||"—",t.instrument,t.assetClass||"futures",t.direction,t.contracts,t.entry,
      (tps[0]&&tps[0].price)||"",(tps[0]&&tps[0].contracts)||"",
      (tps[1]&&tps[1].price)||"",(tps[1]&&tps[1].contracts)||"",
      (tps[2]&&tps[2].price)||"",(tps[2]&&tps[2].contracts)||"",
      avgExit!==null&&avgExit!==undefined?avgExit:"",t.stop||"",ticks,pnl.toFixed(2),r||"",
      t.outcome||"TP",t.strategy,t.session,t.tradeType||"",t.setup,t.duration||"",
      t.balanceAtEntry||"",t.notes||"",t.mistake?"yes":"",t.playbookId||"",
      t.chartUrl||"",
      t.mfe||"",
      t.mae||"",
      (t.tags||[]).join("; ")
    ];
  });

  // Build CSV — works on all platforms including iOS Safari
  const escape = v => {
    const s = String(v==null?"":v).replace(/"/g,'').replace(/\r/g,' ');
    return s.includes(",")||s.includes('"') ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const csv = [headers, ...rows].map(row=>row.map(escape).join(",")).join("\n");
  if(returnString) return csv;
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "logged-trades.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

      +"<td>"+esc(t.date)+"</td><td>"+esc(t.instrument)+"</td><td>"+esc(t.direction)+"</td>"
      +"<td>"+esc(t.contracts)+"</td><td>"+esc(t.entry)+"</td><td>"+esc(tp1)+"</td><td>"+esc(t.stop||"—")+"</td>"
      +"<td style='color:"+tickCol+"'>"+(t.ticks>=0?"+":"")+t.ticks+"</td>"

  }).join("");

  var retDiv = balance>0?"<div class='stat'><div class='stat-l'>Return</div><div class='stat-v' style='color:"+(totalPnl>=0?"#00c97a":"#ff4d6d")+"'>"+(totalPnl>=0?"+":"")+(totalPnl/balance*100).toFixed(2)+"%</div></div>":"";
  var dateStr = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});

  var html = "<!DOCTYPE html><html><head><meta charset='UTF-8'/><title>Logged Trade Report</title>"
    +"<style>body{font-family:monospace;background:#0a0c10;color:#e2e8f0;padding:32px;margin:0}"
    +"h1{font-size:26px;font-weight:900;margin-bottom:4px}.sub{font-size:11px;letter-spacing:0.2em;color:#4a5568;text-transform:uppercase;margin-bottom:28px}"
    +".stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}"
    +".stat{background:#0f1318;border:1px solid #1a2030;border-radius:8px;padding:12px}"
    +".stat-l{font-size:8px;letter-spacing:0.15em;color:#4a5568;text-transform:uppercase;margin-bottom:4px}"
    +".stat-v{font-size:18px;font-weight:600}"
    +"table{width:100%;border-collapse:collapse;font-size:11px}"
    +"th{text-align:left;padding:8px 6px;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:#4a5568;border-bottom:1px solid #2d3748}"
    +"td{padding:7px 6px;vertical-align:middle;border-bottom:1px solid #1a2030}"
    +"@media print{body{background:#fff;color:#000}.stat{background:#f5f5f5;border-color:#ddd}th,td{border-color:#eee}}</style>"
    +"</head><body>"
    +"<h1>LOGGED</h1><div class='sub'>Trade Report &middot; "+dateStr+"</div>"
    +"<div class='stats'>"
    +"<div class='stat'><div class='stat-l'>Net P&amp;L</div><div class='stat-v' style='color:"+(totalPnl>=0?"#00c97a":"#ff4d6d")+"'>"+fmtN(totalPnl)+"</div></div>"
    +"<div class='stat'><div class='stat-l'>Win Rate</div><div class='stat-v'>"+winRate.toFixed(1)+"%</div></div>"
    +"<div class='stat'><div class='stat-l'>Profit Factor</div><div class='stat-v'>"+(pf===Infinity||pf>=999?"&infin;":pf>0?pf.toFixed(2):"—")+"</div></div>"
    +"<div class='stat'><div class='stat-l'>Avg R</div><div class='stat-v' style='color:"+(avgR>=0?"#00c97a":"#ff4d6d")+"'>"+(avgR>=0?"+":"")+avgR.toFixed(2)+"R</div></div>"
    +retDiv
    +"<div class='stat'><div class='stat-l'>Trades</div><div class='stat-v'>"+c.length+"</div></div>"
    +"</div>"
    +"<table><thead><tr><th>Date</th><th>Instrument</th><th>Side</th><th>Qty</th><th>Entry</th><th>TP</th><th>Stop</th><th>Ticks</th><th>P&amp;L</th><th>R</th><th>Outcome</th><th>Strategy</th><th>Session</th></tr></thead>"
    +"<tbody>"+rows+"</tbody></table>";

  // Trade detail cards — notes + images
  var details = trades.filter(function(t){
    return t.notes||(t.images&&t.images.length>0);
  }).map(function(t){
    var res = calc(t);
    var pnlCol = res.pnl>=0?"#00c97a":"#ff4d6d";
    var notesHtml = t.notes?"<div style='margin-top:8px;font-size:11px;color:#a0aec0;line-height:1.6;white-space:pre-wrap'>"+esc(t.notes)+"</div>":"";
    var imgsHtml = "";
    if(t.images&&t.images.length>0){
      imgsHtml = "<div style='display:flex;gap:10px;flex-wrap:wrap;margin-top:12px'>"
        +t.images.map(function(img){
          return "<img src='"+img.dataUrl+"' style='width:240px;height:160px;object-fit:contain;border-radius:6px;border:1px solid #2d3748;background:#000;'/>";
        }).join("")
        +"</div>";
    }
    return "<div style='border:1px solid #2d3748;border-radius:8px;padding:16px;margin-bottom:14px;page-break-inside:avoid'>"
      +"<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'>"
      +"<div style='font-weight:700;font-size:13px'>"+esc(t.date)+(t.time?" "+esc(t.time):"")+" &middot; "+esc(t.instrument)+" &middot; "+esc(t.direction)+"</div>"
      +"<div style='font-size:13px;font-weight:600;color:"+pnlCol+"'>"+fmtN(res.pnl)+(res.r!==null?" &middot; "+(res.r>=0?"+":"")+res.r+"R":"")+"</div>"
      +"</div>"+notesHtml+imgsHtml+"</div>";
  }).join("");

  // Equity curve SVG
  var sortedEq=[...trades].sort(function(a,b){return a.date.localeCompare(b.date)||((a.id||0)-(b.id||0));});
  var runEq=0;
  var eqPts=sortedEq.map(function(t){runEq+=calc(t).pnl;return runEq;});
  if(eqPts.length>=2){
    var mn=Math.min.apply(null,[0].concat(eqPts)),mx=Math.max.apply(null,[0].concat(eqPts));
    var rng=mx-mn||1,W=540,H=100;
    var pts=eqPts.map(function(v,i){return (i/(eqPts.length-1)*W)+","+(H-((v-mn)/rng*H));}).join(" ");
    var zy=H-((0-mn)/rng*H);
    var lc=totalPnl>=0?"#00c97a":"#ff4d6d";
    html+="<div style='margin-top:28px'>"
      +"<div style='font-size:9px;letter-spacing:0.15em;color:#4a5568;text-transform:uppercase;margin-bottom:10px'>Equity Curve</div>"
      +"<div style='background:#0f1318;border:1px solid #1a2030;border-radius:8px;padding:12px'>"
      +"<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px;display:block;overflow:visible'>"
      +"<polyline points='0,"+zy+" "+W+","+zy+"' stroke='#2d3748' stroke-width='1' fill='none' stroke-dasharray='4'/>"
      +"<polyline points='"+pts+"' stroke='"+lc+"' stroke-width='2' fill='none'/>"
      +"</svg>"
      +"<div style='display:flex;justify-content:space-between;font-size:9px;color:#4a5568;margin-top:4px'>"
      +"<span>"+esc(sortedEq[0].date)+"</span><span>"+esc(sortedEq[sortedEq.length-1].date)+"</span></div>"
      +"</div></div>";
  }

  // By Session + By Strategy breakdowns
  var sessBrkdn={},stBrkdn={};
  c.forEach(function(t){
    if(t.session){if(!sessBrkdn[t.session])sessBrkdn[t.session]={pnl:0,count:0,wins:0};sessBrkdn[t.session].pnl+=t.pnl;sessBrkdn[t.session].count++;if(t.pnl>0)sessBrkdn[t.session].wins++;}
    if(t.strategy){if(!stBrkdn[t.strategy])stBrkdn[t.strategy]={pnl:0,count:0,wins:0};stBrkdn[t.strategy].pnl+=t.pnl;stBrkdn[t.strategy].count++;if(t.pnl>0)stBrkdn[t.strategy].wins++;}
  });
  function brkdnTable(data){
    return "<table style='width:100%;border-collapse:collapse;font-size:10px'>"
      +"<thead><tr><th style='text-align:left;padding:5px 4px;font-size:8px;letter-spacing:0.1em;color:#4a5568;text-transform:uppercase;border-bottom:1px solid #2d3748'>Name</th>"
      +"<th style='text-align:center;padding:5px 4px;font-size:8px;letter-spacing:0.1em;color:#4a5568;text-transform:uppercase;border-bottom:1px solid #2d3748'>Trades</th>"
      +"<th style='text-align:center;padding:5px 4px;font-size:8px;letter-spacing:0.1em;color:#4a5568;text-transform:uppercase;border-bottom:1px solid #2d3748'>WR</th>"
      +"<th style='text-align:right;padding:5px 4px;font-size:8px;letter-spacing:0.1em;color:#4a5568;text-transform:uppercase;border-bottom:1px solid #2d3748'>P&L</th></tr></thead><tbody>"
      +Object.entries(data).sort(function(a,b){return b[1].pnl-a[1].pnl;}).map(function(e){
        var wr=Math.round(e[1].wins/e[1].count*100);
        return "<tr><td style='padding:5px 4px'>"+esc(e[0])+"</td><td style='text-align:center;padding:5px 4px'>"+e[1].count+"</td>"
          +"<td style='text-align:center;padding:5px 4px;color:"+(wr>=50?"#00c97a":"#ff4d6d")+"'>"+wr+"%</td>"
          +"<td style='text-align:right;padding:5px 4px;font-weight:600;color:"+(e[1].pnl>=0?"#00c97a":"#ff4d6d")+"'>"+fmtN(e[1].pnl)+"</td></tr>";
      }).join("")+"</tbody></table>";
  }
  if(Object.keys(sessBrkdn).length||Object.keys(stBrkdn).length){
    html+="<div style='display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px'>"
      +(Object.keys(sessBrkdn).length?"<div><div style='font-size:9px;letter-spacing:0.15em;color:#4a5568;text-transform:uppercase;margin-bottom:8px'>By Session</div>"
        +"<div style='background:#0f1318;border:1px solid #1a2030;border-radius:8px;padding:12px'>"+brkdnTable(sessBrkdn)+"</div></div>":"")
      +(Object.keys(stBrkdn).length?"<div><div style='font-size:9px;letter-spacing:0.15em;color:#4a5568;text-transform:uppercase;margin-bottom:8px'>By Strategy</div>"
        +"<div style='background:#0f1318;border:1px solid #1a2030;border-radius:8px;padding:12px'>"+brkdnTable(stBrkdn)+"</div></div>":"")
      +"</div>";
  }

  if(details){
    html += "<div style='margin-top:40px'>"
      +"<div style='font-size:11px;letter-spacing:0.2em;color:#4a5568;text-transform:uppercase;margin-bottom:20px;border-top:1px solid #2d3748;padding-top:20px'>Trade Notes &amp; Charts</div>"
      +details+"</div>";
  }

  html += "</body></html>";

  if(w){
    w.document.write(html);
    w.document.close();
  } else {
    var a = document.createElement("a");
    a.href = "data:text/html;charset=utf-8,"+encodeURIComponent(html);
    a.download = "logged-trade-report.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

function getStreak(trades) {
  const sorted = [...trades].sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length) return {count:0,type:"—"};
  // Skip BE trades to find the first decisive result
  const decisive = sorted.filter(t=>calc(t).pnl!==0);
  if(!decisive.length) return {count:0,type:"—"};
  const first = calc(decisive[0]).pnl;
  const type = first>0?"W":"L";
  let count=0;
  for(const t of sorted){
    const p=calc(t).pnl;
    if(p===0) continue; // skip BE — doesn't break or extend streak
    if((type==="W"&&p>0)||(type==="L"&&p<0)) count++;
    else break;
  }
  return {count,type};
}

/* ── Lightbox ── */
function Lightbox({images,start,onClose}){
  const [idx,setIdx]=useState(typeof start==="number"?start:0);
  const [zoomed,setZoomed]=useState(false);
  const [dragStart,setDragStart]=useState(null);

  const goNext=()=>{ if(idx<images.length-1){setIdx(idx+1);setZoomed(false);} };
  const goPrev=()=>{ if(idx>0){setIdx(idx-1);setZoomed(false);} };

  useEffect(()=>{
    const h=e=>{
      if(e.key==="Escape") onClose();
      if(e.key==="ArrowRight") setIdx(x=>Math.min(x+1,images.length-1));
      if(e.key==="ArrowLeft") setIdx(x=>Math.max(x-1,0));
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[]);

  const onTouchStart=e=>setDragStart(e.touches[0].clientX);
  const onTouchEnd=e=>{
    if(dragStart===null) return;
    const dx=e.changedTouches[0].clientX-dragStart;
    if(dx<-50) goNext();
    else if(dx>50) goPrev();
    setDragStart(null);
  };

  const img=images[idx]||images[0];
  if(!img||!img.dataUrl) return null;

  return(
    <div style={{position:"fixed",inset:0,zIndex:9999,background:"#000",display:"flex",flexDirection:"column"}}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px",paddingTop:"calc(16px + env(safe-area-inset-top))",background:"linear-gradient(180deg,rgba(0,0,0,0.75) 0%,transparent 100%)",position:"absolute",top:0,left:0,right:0,zIndex:2,pointerEvents:"none"}}>
        <div style={{pointerEvents:"auto"}}>
          {img.label&&<div style={{fontSize:13,fontWeight:600,color:"#fff",fontFamily:"DM Mono,monospace",letterSpacing:"0.04em"}}>{img.label}</div>}
          {images.length>1&&<div style={{fontSize:11,color:"rgba(255,255,255,0.5)",marginTop:2}}>{idx+1} of {images.length}</div>}
        </div>
        <button aria-label="Close" onClick={onClose} style={{pointerEvents:"auto",background:"rgba(255,255,255,0.15)",border:"none",borderRadius:"50%",width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#fff",fontSize:18,lineHeight:1}}>&#x2715;</button>
      </div>

      {/* Image area */}
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
        <img
          src={img.dataUrl}
          alt={img.label||"chart"}
          onClick={()=>setZoomed(z=>!z)}
          style={{
            maxWidth:zoomed?"200%":"95vw",
            maxHeight:zoomed?"200%":"82vh",
            objectFit:"contain",
            borderRadius:zoomed?0:8,
            cursor:zoomed?"zoom-out":"zoom-in",
            boxShadow:zoomed?"none":"0 8px 40px rgba(0,0,0,0.6)",
          }}
        />
        {images.length>1&&idx>0&&(
          <button aria-label="Previous image" onClick={goPrev} style={{position:"absolute",left:0,top:0,bottom:0,width:"22%",background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.7)",fontSize:36,display:"flex",alignItems:"center",justifyContent:"flex-start",paddingLeft:8}}>&#8249;</button>
        )}
        {images.length>1&&idx<images.length-1&&(
          <button aria-label="Next image" onClick={goNext} style={{position:"absolute",right:0,top:0,bottom:0,width:"22%",background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.7)",fontSize:36,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:8}}>&#8250;</button>
        )}
      </div>

      {/* Footer dots */}
      {images.length>1&&(
        <div style={{display:"flex",justifyContent:"center",gap:6,padding:"14px",paddingBottom:"calc(14px + env(safe-area-inset-bottom))"}}>
          {images.map((_,n)=>(
            <div key={n} onClick={()=>{setIdx(n);setZoomed(false);}}
              style={{width:n===idx?18:6,height:6,borderRadius:3,background:n===idx?"#fff":"rgba(255,255,255,0.3)",transition:"all 0.2s",cursor:"pointer"}}/>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── Equity SVG ── */
function EquityCurve({equity, totalPnl, balance, curr, isR}){
  if(equity.length<2) return <div style={{color:"var(--text4)",fontSize:12,textAlign:"center",padding:"30px 0"}}>Log more trades to see your curve</div>;
  const sym = (curr&&curr.symbol)||"$";
  const startBal = balance||0;
  // If balance set, show absolute account value. Otherwise show P&L delta.
  const vals = startBal>0 ? equity.map(e=>startBal+e.eq) : equity.map(e=>e.eq);
  const mn=vals.length?Math.min(...vals, startBal||0):(startBal||0);
  const mx=vals.length?Math.max(...vals, startBal||0):(startBal||0)+1;
  const rng=mx-mn||1;
  const W=300,H=80;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*W},${H-((v-mn)/rng)*H}`).join(" ");
  // baseline = starting balance line if balance set, else zero line
  const baselineVal = startBal>0 ? startBal : 0;
  const zy = H-((baselineVal-mn)/rng)*H;
  const col = totalPnl>=0?"var(--accent)":"#ff4d6d";
  const fmtV = v => {
    if(isR) return `${v>=0?"+":""}${v.toFixed(1)}R`;
    if(Math.abs(v)>=1000000) return `${sym}${(v/1000000).toFixed(1)}M`;
    if(Math.abs(v)>=1000) return `${sym}${(v/1000).toFixed(1)}k`;
    return `${sym}${v.toFixed(0)}`;
  };
  return(
    <div>
      {/* Y axis labels */}
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:9,color:"var(--text4)"}}>{fmtV(mx)}</span>
        {startBal>0&&<span style={{fontSize:9,color:"#a78bfa"}}>Start: {fmtV(startBal)}</span>}
        <span style={{fontSize:9,color:"var(--text4)"}}>{fmtV(mn)}</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:90,overflow:"visible"}}>
        {/* Baseline */}
        <line x1={0} y1={zy} x2={W} y2={zy} stroke="var(--text5)" strokeWidth={0.8} strokeDasharray="3,3"/>
        {/* Starting balance line */}
        {startBal>0&&<line x1={0} y1={zy} x2={W} y2={zy} stroke="#a78bfa" strokeWidth={1.5} strokeDasharray="6,3" opacity={0.7}/>}
        {startBal>0&&<text x={W-4} y={zy-4} fontSize={8} fill="#a78bfa" fillOpacity={0.9} textAnchor="end">Start</text>}
        {/* Fill area under curve */}
        <polygon points={`0,${H} ${pts} ${W},${H}`} fill={col} fillOpacity={0.06}/>
        {/* Curve */}
        <polyline points={pts} fill="none" stroke={col} strokeWidth={2} strokeLinejoin="round"/>
        {/* Dots */}
        {vals.map((v,i)=>(
          <circle key={i} cx={(i/(vals.length-1))*W} cy={H-((v-mn)/rng)*H} r={2.5} fill={col} opacity={0.6}/>
        ))}
        {/* Start and end labels */}
        <text x={4} y={H-((vals[0]-mn)/rng)*H-6} fontSize={8} fill={col} fillOpacity={0.7}>{fmtV(vals[0])}</text>
        <text x={W-4} y={H-((vals[vals.length-1]-mn)/rng)*H-6} fontSize={8} fill={col} fillOpacity={0.7} textAnchor="end">{fmtV(vals[vals.length-1])}</text>
      </svg>
      {/* Summary row */}
      <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
        <div style={{fontSize:10,color:"var(--text4)"}}>
          {isR?"R curve":(startBal>0?`Start: ${fmtV(startBal)}`:"P&L curve")}
        </div>
        <div style={{fontSize:10,color:totalPnl>=0?"var(--accent)":"#ff4d6d",fontWeight:500}}>
          {isR?`${totalPnl>=0?"+":""}${totalPnl.toFixed(2)}R total`:`${totalPnl>=0?"+":""}${sym}${Math.abs(totalPnl).toFixed(2)} (${totalPnl>=0?"+":""}${startBal>0?((totalPnl/startBal)*100).toFixed(2):"—"}%)`}
        </div>
        <div style={{fontSize:10,color:"var(--text4)"}}>
          {isR?"":(startBal>0?`Now: ${fmtV(startBal+totalPnl)}`:"")}
        </div>
      </div>
    </div>
  );
}

/* ── Image Uploader ── */
function ImageUploader({images,onChange,onImageClick}){
  const ref=useRef();
  const [drag,setDrag]=useState(false);

  const MAX_IMG_SIZE = 5 * 1024 * 1024; // 5MB
  const [sizeErr, setSizeErr] = useState('');
  const MAX_IMAGES = 6;
  const process=files=>{
    Array.from(files).forEach(f=>{
      if(!f.type.startsWith("image/"))return;
      if(images.length>=MAX_IMAGES){
        setSizeErr("Max "+MAX_IMAGES+" images per trade");
        setTimeout(()=>setSizeErr(''),3000);
        return;
      }
      if(f.size > MAX_IMG_SIZE){
        setSizeErr("Image too large — max 5MB per image");
        setTimeout(()=>setSizeErr(''),3000);
        return;
      }
      const reader = new FileReader();
      reader.onload = e => {
        onChange(p=>{
          if(p.length>=MAX_IMAGES) return p;
          return [...p,{id:Date.now()+Math.random(),dataUrl:e.target.result,label:f.name.replace(/\.[^.]+$/,"")}];
        });
      };
      reader.readAsDataURL(f);
    });
  };
  return(
    <div>
      <div className={`upload-zone${drag?" drag":""}`}
        onClick={e=>{if(e.target.closest('.thumb-wrap'))return;ref.current.click();}}
        onDrop={e=>{e.preventDefault();setDrag(false);process(e.dataTransfer.files);}}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}>
        {images.length===0&&(
          <>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{marginBottom:4}}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <div style={{fontSize:12,color:"var(--text4)"}}>Tap to add chart screenshots</div>
            <div style={{fontSize:10,color:"var(--text5)",marginTop:3}}>PNG · JPG · WEBP · max 5MB</div>
          </>
        )}
        {sizeErr&&<div style={{fontSize:11,color:"#ff4d6d",marginTop:6,textAlign:"center"}}>{sizeErr}</div>}
        {images.length>0&&(
          <>
            <div className="thumb-row" style={{marginBottom:10}}>
              {images.map((img)=>(
                <div key={img.id} className="thumb-wrap">
                  <img src={img.dataUrl} alt="" onClick={e=>{e.stopPropagation();onImageClick&&onImageClick(images,images.indexOf(img));}}/>
                  <div className="thumb-overlay"/>
                  <input
                  className="thumb-label"
                  value={img.label||""}
                  onChange={e=>{const v=e.target.value;onChange(p=>p.map(x=>x.id===img.id?{...x,label:v}:x));}}
                  onClick={e=>e.stopPropagation()}
                  placeholder="label..."
                  style={{background:"transparent",border:"none",outline:"none",width:"100%",cursor:"text",pointerEvents:"all"}}
                />
                  <button className="thumb-del" onClick={e=>{e.stopPropagation();onChange(p=>p.filter(x=>x.id!==img.id));}}>&#x2715;</button>
                </div>
              ))}
            </div>
            <div style={{fontSize:10,color:"var(--text4)",textAlign:"center"}}>
              {images.length<MAX_IMAGES
                ? "+ tap to add more · "+images.length+"/"+MAX_IMAGES+" images"
                : <span style={{color:"#f6ad55"}}>Max images reached ({MAX_IMAGES}/{MAX_IMAGES})</span>}
            </div>
          </>
        )}
        <input ref={ref} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>process(e.target.files)}/>
      </div>
    </div>
  );
}

/* ── PIN Screen ── */
function getInitials(name){ return (name||"").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,3); }
function getInitialsFontSize(initials, size="sm"){ 
  const sizes = {sm:[16,13,10], md:[20,15,12], lg:[22,17,13]};
  const s = sizes[size]||sizes.sm;
  return initials.length===1?s[0]:initials.length===2?s[1]:s[2];
}
function InitialAvatar({name, size=28, fontSize="sm", onClick, style={}}){
  const initials = getInitials(name);
  const fs = getInitialsFontSize(initials, fontSize);
  return(
    <div onClick={onClick} style={{width:size,height:size,borderRadius:"50%",background:"var(--accent-bg)",border:"1px solid var(--accent-dim)",display:"flex",alignItems:"center",justifyContent:"center",cursor:onClick?"pointer":"default",flexShrink:0,...style}}>
      <span style={{fontSize:fs,fontFamily:"Syne,sans-serif",fontWeight:800,color:"var(--accent)"}}>{initials}</span>
    </div>
  );
}
function PinScreen({onUnlock}){
  const profile = useMemo(()=>{try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||"null")}catch{return null}},[]);
  const isSetup = !profile;
  const [step, setStep] = useState(isSetup?"name":"pin");
  const [name, setName] = useState("");
  const [pin, setPin] = useState("");
  const [confirmPin, setConfirmPin] = useState("");
  const [entered, setEntered] = useState("");
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);
  const [success, setSuccess] = useState(false);

  const triggerError = () => {
    if(navigator.vibrate) navigator.vibrate([40,30,40]);
    setError(true); setShake(true);
    setTimeout(()=>{setEntered("");setError(false);setShake(false);},500);
  };

  const haptic = () => { if(navigator.vibrate) navigator.vibrate(8); };

  const pressDigit = (d) => {
    haptic();
    if(step==="pin"){
      const next = entered+d;
      if(next.length>4) return;
      setEntered(next);
      if(next.length===4){
        if(next===profile.pin){
          setSuccess(true);
          setTimeout(()=>onUnlock(profile.name),280);
        } else {
          triggerError();
        }
      }
    } else if(step==="setpin"){
      const next = pin+d;
      if(next.length>4) return;
      setPin(next);
      if(next.length===4) setStep("confirm");
    } else if(step==="confirm"){
      const next = confirmPin+d;
      if(next.length>4) return;
      setConfirmPin(next);
      if(next.length===4){
        if(next===pin){
          localStorage.setItem(PROFILE_KEY, JSON.stringify({name:name.trim(), pin:next}));
          setSuccess(true);
          setTimeout(()=>onUnlock(name.trim()),280);
        } else {
          setTimeout(()=>{setConfirmPin(""); setPin(""); setStep("setpin"); triggerError();},50);
        }
      }
    }
  };

  const pressDelete = () => {
    haptic();
    if(step==="pin") setEntered(e=>e.slice(0,-1));
    else if(step==="setpin") setPin(p=>p.slice(0,-1));
    else if(step==="confirm") setConfirmPin(p=>p.slice(0,-1));
  };

  const currentEntry = step==="pin"?entered:step==="setpin"?pin:confirmPin;
  const DIGITS = ["1","2","3","4","5","6","7","8","9","*","0","⌫"];

  return(
    <div className="pin-screen" style={{background:"radial-gradient(ellipse at 0% 0%,#1a0a2e 0%,transparent 60%),radial-gradient(ellipse at 100% 100%,#00251a 0%,transparent 60%),#080b12"}}>
      <div style={{textAlign:"center",marginBottom:8}}>
        <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:28,color:"var(--text)",letterSpacing:"-0.02em"}}>LOGGED</div>
        <div style={{fontSize:9,letterSpacing:"0.15em",color:"var(--text4)",textTransform:"uppercase",marginTop:2}}>futures journal</div>
        <div style={{fontSize:11,color:"var(--text3)",marginTop:8,letterSpacing:"0.12em",textTransform:"uppercase",fontFamily:"Syne,sans-serif",fontWeight:700}}>LOGGED IT. LEARNED IT. OWNED IT.</div>
      </div>

      {step==="name"&&(
        <div style={{width:"100%",maxWidth:280,marginTop:32}}>
          <div style={{fontSize:13,color:"var(--text3)",textAlign:"center",marginBottom:20,lineHeight:1.6}}>What is your name?</div>
          <input className="pin-name-input" placeholder="Your name..." value={name} onChange={e=>setName(e.target.value)} autoFocus
            onKeyDown={e=>{if(e.key==="Enter"&&name.trim())setStep("setpin");}}/>
          <button className="btn-primary" style={{marginTop:16}} disabled={!name.trim()}
            onClick={()=>setStep("setpin")}>Continue →</button>
        </div>
      )}

      {(step==="setpin"||step==="confirm"||step==="pin")&&(
        <>
          <div style={{fontSize:13,color:"var(--text3)",textAlign:"center",marginTop:24,lineHeight:1.6}}>
            {step==="pin"&&<>
              <InitialAvatar name={profile.name} size={48} fontSize="md" style={{margin:"0 auto 8px",background:"var(--accent-bg)",border:"1px solid #00d49a30"}}/>
              <span style={{color:"var(--text2)",fontWeight:500}}>{profile.name}</span><br/>Enter your PIN
            </>}
            {step==="setpin"&&<span>Set a 4-digit PIN</span>}
            {step==="confirm"&&<span>Confirm your PIN</span>}
          </div>

          {/* Dots */}
          <div className="pin-dots" style={{animation:shake?"shake 0.4s ease":undefined}}>
            {[0,1,2,3].map(i=>(
              <div key={i} style={{
                width:14,height:14,borderRadius:"50%",
                transition:"all 0.15s ease",
                background: error?"#ff4d6d":success?"var(--accent)":currentEntry.length>i?"var(--accent)":"transparent",
                border: error?"2px solid #ff4d6d":success?"2px solid var(--accent)":currentEntry.length>i?"2px solid var(--accent)":"2px solid var(--border3)",
                transform: currentEntry.length>i?"scale(1.15)":"scale(1)",
                boxShadow: (currentEntry.length>i&&!error)?"0 0 8px var(--accent-dim)":undefined,
              }}/>
            ))}
          </div>

          {/* Keypad */}
          <div className="pin-pad">
            {DIGITS.map((d,i)=>(
              d==="*"?(
                <button key={i} className="pin-btn del" style={{color:"var(--text5)",cursor:"default"}} onClick={()=>{}}>＃</button>
              ):d==="⌫"?(
                <button key={i} aria-label="Delete" className="pin-btn del" onClick={pressDelete}
                  style={{fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>
                  </svg>
                </button>
              ):(
                <button key={i} className="pin-btn" onClick={()=>pressDigit(d)}>{d}</button>
              )
            ))}
          </div>
        </>
      )}

      <style>{`
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
        .pin-btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;}
        .pin-btn:active{background:var(--accent-bg)!important;border-color:var(--accent-dim)!important;transform:scale(0.93);}
      `}</style>
    </div>
  );
}

/* ── Calendar View ── */
function CalendarView({trades, fmt, calc, curr, onDayFilter}){
  const today = new Date();
  const [calYear, setCalYear] = useState(today.getFullYear());
  const [calMonth, setCalMonth] = useState(today.getMonth());
  const [selectedDay, setSelectedDay] = useState(null);
  const [showMonthPicker, setShowMonthPicker] = useState(false);

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // Build day map for current month
  const dayMap = useMemo(()=>{
    const map = {};
    trades.forEach(t=>{
      const d = new Date(t.date);
      if(d.getFullYear()===calYear && d.getMonth()===calMonth){
        const key = t.date;
        if(!map[key]) map[key]={pnl:0,count:0,trades:[]};
        map[key].pnl += calc(t).pnl;
        map[key].count++;
        map[key].trades.push(t);
      }
    });
    return map;
  },[trades, calYear, calMonth]);

  // Monthly summary
  const monthPnl = Object.values(dayMap).reduce((s,d)=>s+d.pnl,0);
  const greenDays = Object.values(dayMap).filter(d=>d.pnl>0).length;
  const redDays = Object.values(dayMap).filter(d=>d.pnl<0).length;

  // Build calendar grid
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);

  const prevMonth = ()=>{ if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1); setSelectedDay(null); };
  const nextMonth = ()=>{ if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1); setSelectedDay(null); };

  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

  const selKey = selectedDay ? `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(selectedDay).padStart(2,"0")}` : null;
  const selData = selKey ? dayMap[selKey] : null;

  return(
    <>
      {/* Month header */}
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:16}}>
        <button aria-label="Previous month" onClick={prevMonth} style={{background:"none",border:"none",color:"var(--text3)",fontSize:20,cursor:"pointer",padding:"4px 8px"}}>‹</button>
        <div style={{textAlign:"center",position:"relative"}}>
          <button onClick={()=>setShowMonthPicker(v=>!v)}
            style={{background:"none",border:"none",cursor:"pointer",padding:"4px 8px",borderRadius:8,transition:"background 0.15s"}}
            onMouseEnter={e=>e.currentTarget.style.background="var(--surface2)"}
            onMouseLeave={e=>e.currentTarget.style.background="none"}>
            <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:20,color:"var(--text)",lineHeight:1.3,paddingBottom:2,display:"flex",alignItems:"center",gap:6}}>
              {MONTHS[calMonth]}
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div style={{fontSize:11,color:"var(--text4)"}}>{calYear}</div>
          </button>
          {showMonthPicker&&(
            <div style={{position:"absolute",top:"100%",left:"50%",transform:"translateX(-50%)",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:12,zIndex:50,boxShadow:"0 8px 32px rgba(0,0,0,0.4)",minWidth:240,marginTop:4}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <button onClick={(e)=>{e.stopPropagation();setCalYear(y=>y-1);}} style={{background:"none",border:"none",color:"var(--text3)",fontSize:18,cursor:"pointer",padding:"2px 8px"}}>‹</button>
                <span style={{fontFamily:"Syne,sans-serif",fontWeight:700,fontSize:15,color:"var(--text)"}}>{calYear}</span>
                <button onClick={(e)=>{e.stopPropagation();setCalYear(y=>y+1);}} style={{background:"none",border:"none",color:"var(--text3)",fontSize:18,cursor:"pointer",padding:"2px 8px"}}>›</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4}}>
                {MONTHS.map((m,i)=>(
                  <button key={i} onClick={(e)=>{e.stopPropagation();setCalMonth(i);setSelectedDay(null);setShowMonthPicker(false);}}
                    style={{padding:"8px 4px",border:"1px solid "+(i===calMonth?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",
                      background:i===calMonth?"var(--accent-bg)":"transparent",
                      color:i===calMonth?"var(--accent)":"var(--text3)",transition:"all 0.15s"}}>
                    {m.slice(0,3)}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
        <button aria-label="Next month" onClick={nextMonth} style={{background:"none",border:"none",color:"var(--text3)",fontSize:20,cursor:"pointer",padding:"4px 8px"}}>›</button>
      </div>

      {/* Monthly summary */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[
          {l:"Month P&L",v:fmt(monthPnl),c:monthPnl>=0?"var(--accent)":"#ff4d6d"},
          {l:"Green Days",v:greenDays,c:"#00d49a"},
          {l:"Red Days",v:redDays,c:"#ff4d6d"},
        ].map(s=>(
          <div key={s.l} className="stat-card" style={{flex:1,padding:"10px 12px"}}>
            <div className="stat-label">{s.l}</div>
            <div style={{fontSize:16,fontWeight:500,color:s.c}}>{s.v}</div>
          </div>
        ))}
      </div>

      {/* Day headers */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
        {DAYS.map(d=>(
          <div key={d} style={{textAlign:"center",fontSize:9,letterSpacing:"0.1em",color:"var(--text4)",textTransform:"uppercase",padding:"4px 0"}}>{d}</div>
        ))}
      </div>

      {/* Calendar grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:16}}>
        {cells.map((day,i)=>{
          if(!day) return <div key={`e${i}`}/>;
          const key = `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
          const data = dayMap[key];
          const isToday = key===todayStr;
          const isSelected = day===selectedDay;
          const bg = data ? (data.pnl>0?"var(--accent)":"#ff4d6d") : "transparent";
          const intensity = data&&data.pnl>0 ? Math.min(0.35, 0.08 + Math.abs(data.pnl)/500*0.2) : 0;
          const isRed = data&&data.pnl<0;
          return(
            <div key={day} onClick={()=>setSelectedDay(day===selectedDay?null:day)}
              style={{aspectRatio:"1",borderRadius:8,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:data?"pointer":"default",
                background:isRed?"transparent":data?`${bg}${Math.round(intensity*255).toString(16).padStart(2,"0")}`:"var(--surface2)",
                border:isSelected?"2px solid "+(data?bg:"var(--accent)"):isRed?"2px solid #ff4d6d":isToday?"2px solid var(--accent)":"2px solid transparent",
                transition:"all 0.15s",position:"relative"}}>
              <div style={{fontSize:11,fontWeight:isToday?700:400,color:data?(data.pnl>0?"var(--accent)":"#ff4d6d"):"var(--text4)"}}>{day}</div>
              {data&&<div style={{fontSize:9,color:data.pnl>0?"var(--accent)":"#ff4d6d",opacity:0.7,letterSpacing:"-0.02em",textAlign:"center"}}>
                {curr.symbol}{Math.abs(data.pnl)>=1000?`${(Math.abs(data.pnl)/1000).toFixed(1)}k`:Math.abs(data.pnl).toFixed(0)}
              </div>}
            </div>
          );
        })}
      </div>

      {/* Selected day detail */}
      {selectedDay&&(
        <div className="stat-card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:16,color:"var(--text)",lineHeight:1.3,paddingBottom:2}}>{MONTHS[calMonth]} {selectedDay}</div>
            {selData&&<div style={{fontSize:18,fontWeight:500,color:selData.pnl>=0?"var(--accent)":"#ff4d6d"}}>{fmt(selData.pnl)}</div>}
          </div>
          {!selData?(
            <div style={{fontSize:12,color:"var(--text4)",textAlign:"center",padding:"16px 0"}}>No trades on this day</div>
          ):(
            <>
              {/* Win/loss ratio row */}
              {selData.trades.length>0&&(()=>{
                const wins=selData.trades.filter(t=>calc(t).pnl>0).length;
                const losses=selData.trades.filter(t=>calc(t).pnl<0).length;
                const bes=selData.trades.filter(t=>calc(t).pnl===0).length;
                return(
                  <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                    <span style={{fontSize:10,padding:"3px 8px",borderRadius:6,background:"var(--accent-bg)",color:"var(--accent)",fontFamily:"DM Mono,monospace"}}>{wins}W · {losses}L{bes>0?" · "+bes+"BE":""}</span>
                    <span style={{fontSize:10,padding:"3px 8px",borderRadius:6,background:"var(--surface2)",color:"var(--text3)",fontFamily:"DM Mono,monospace"}}>{selData.trades.length} trade{selData.trades.length!==1?"s":""}</span>
                  </div>
                );
              })()}
              {onDayFilter&&(
                <button onClick={()=>{
                  const key=calYear+"-"+String(calMonth+1).padStart(2,"0")+"-"+String(selectedDay).padStart(2,"0");
                  onDayFilter(key);
                }} style={{width:"100%",background:"var(--accent-bg)",border:"1px solid var(--accent-dim)",borderRadius:8,padding:"9px 14px",cursor:"pointer",fontSize:11,color:"var(--accent)",fontFamily:"DM Mono,monospace",fontWeight:600,marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                  View in Journal
                </button>
              )}
              {selData.trades.map(t=>{
                const {pnl,ticks,r}=calc(t);
                return(
                  <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
                    <div>
                      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:3}}>
                        <span style={{fontSize:14,fontWeight:800,color:"var(--text)",fontFamily:"Syne,sans-serif",letterSpacing:"-0.01em"}}>{t.instrument}</span>
                        <span style={{fontSize:11,color:t.direction==="Long"?"var(--accent)":"#ff4d6d"}}>{t.direction==="Long"?"▲":"▼"} {t.direction}</span>
                        {(t.emotion||[]).length>0&&<span style={{fontSize:11}}>{(Array.isArray(t.emotion)?t.emotion:[t.emotion]).map(e=>e.split(" ")[0]).join("")}</span>}
                      </div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                        <span className="tag">{t.strategy}</span>
                        <span className="tag">{t.outcome||"TP"}</span>
                      </div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:15,fontWeight:500,color:pnl>=0?"var(--accent)":"#ff4d6d"}}>{fmt(pnl)}</div>
                      <div style={{fontSize:11,color:"var(--text4)"}}>{ticks>=0?"+":""}{ticks} ticks{r!==null?" · "+(r>=0?"+":"")+r+"R":""}</div>
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}

      {/* Goals shortcut */}
    </>
  );
}

/* ── Confetti ── */
function fireConfetti(){
  const colors=["#00d49a","#ff4d6d","#f6ad55","#fff","#a78bfa"];
  const pieces=Array.from({length:60},(_,i)=>{
    const el=document.createElement("div");
    el.className="confetti-piece";
    el.style.left=Math.random()*100+"vw";
    el.style.top="-10px";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.borderRadius=Math.random()>0.5?"50%":"2px";
    el.style.width=(Math.random()*8+4)+"px";
    el.style.height=(Math.random()*8+4)+"px";
    el.style.animationDuration=(Math.random()*2+1.5)+"s";
    el.style.animationDelay=(Math.random()*0.5)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),(3000));
    return el;
  });
}

/* ── Goals View ── */
function GoalsView({trades, goals, setGoals, fmt, calc, goalColour, setShareGoal, shareCardStyle, playbooks, setShareCardStyle, traderName}){
  const [localShareGoal, setLocalShareGoal] = useState(null);
  const [showAddGoal, setShowAddGoal] = useState(false);
  const [editGroupId, setEditGroupId] = useState(null);
  const [groupForm, setGroupForm] = useState({title:"", period:"Daily", targets:[], playbookId:null});
  const [newTarget, setNewTarget] = useState({type:"PnL", amount:""});

  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const weekStart = new Date(now); weekStart.setDate(now.getDate()-now.getDay());
  const todayStr = now.toISOString().split("T")[0];

  const getPeriodTrades = (period, dateFrom, dateTo) => trades.filter(t=>{
    const d = new Date(t.date);
    if(period==="Daily") return t.date===todayStr;
    if(period==="Weekly") return d>=weekStart;
    if(period==="Monthly") return d>=monthStart;
    if(period==="Custom") {
      if(dateFrom && t.date < dateFrom) return false;
      if(dateTo && t.date > dateTo) return false;
      return true;
    }
    return true;
  });

  const getProgress = (type, period, dateFrom, dateTo, playbookId) => {
    const ptRaw = getPeriodTrades(period, dateFrom, dateTo);
    const pt = playbookId ? ptRaw.filter(t=>String(t.playbookId)===String(playbookId)) : ptRaw;
    switch(type){
      case "PnL": return pt.reduce((s,t)=>s+calc(t).pnl,0);
      case "WinRate": { const w=pt.filter(t=>calc(t).pnl>0).length; return pt.length?Math.round(w/pt.length*100):0; }
      case "Trades": return pt.length;
      case "AvgR": { const rt=pt.filter(t=>calc(t).r!==null); return rt.length?Math.round(rt.reduce((s,t)=>s+calc(t).r,0)/rt.length*100)/100:0; }
      case "MaxLoss": { const net=pt.reduce((s,t)=>s+calc(t).pnl,0); return net<0?Math.abs(net):0; }
      default: return 0;
    }
  };

  // ── Streak tracking (derived from trade log, not stored) ──────────────────
  // Computes progress for a single named day (YYYY-MM-DD).
  const getDayProgress = (type, dayStr) => {
    const pt = trades.filter(t=>t.date===dayStr);
    switch(type){
      case "PnL": return pt.reduce((s,t)=>s+calc(t).pnl,0);
      case "WinRate": { const w=pt.filter(t=>calc(t).pnl>0).length; return pt.length?Math.round(w/pt.length*100):0; }
      case "Trades": return pt.length;
      case "AvgR": { const rt=pt.filter(t=>calc(t).r!==null); return rt.length?Math.round(rt.reduce((s,t)=>s+calc(t).r,0)/rt.length*100)/100:0; }
      case "MaxLoss": { const net=pt.reduce((s,t)=>s+calc(t).pnl,0); return net<0?Math.abs(net):0; }
      default: return 0;
    }
  };
  // True if every target in the group is satisfied for the given day's trades.
  const dayMeetsGoal = (group, dayStr) => {
    const dayTrades = trades.filter(t=>t.date===dayStr);
    if(!dayTrades.length) return false;                 // no trading that day → streak breaks
    return (group.targets||[]).every(t=>{
      const prog = getDayProgress(t.type, dayStr);
      return t.type==="MaxLoss" ? prog<=t.amount : prog>=t.amount;  // loss: stay under; others: reach (signed)
    });
  };
  // Current consecutive-day streak ending today (only meaningful for Daily goals).
  const getStreak = (group) => {
    if(group.period!=="Daily" || !(group.targets||[]).length) return {current:0, best:0};
    // Collect distinct trading days, newest first
    const days = [...new Set(trades.map(t=>t.date))].sort().reverse();
    if(!days.length) return {current:0, best:0};
    // Current streak: consecutive trading days (most recent backwards) that met the goal
    let current=0;
    for(const d of days){ if(dayMeetsGoal(group,d)) current++; else break; }
    // Best streak across all trading days (consecutive met days)
    let best=0, run=0;
    for(const d of [...days].reverse()){ if(dayMeetsGoal(group,d)){run++; if(run>best)best=run;} else run=0; }
    return {current, best};
  };

  const TYPES = [
    {k:"PnL",l:"Profit Target",unit:"$"},
    {k:"WinRate",l:"Win Rate",unit:"%"},
    {k:"Trades",l:"No. of Trades",unit:""},
    {k:"AvgR",l:"Avg R / trade",unit:"R"},
    {k:"MaxLoss",l:"Max Loss",unit:"$"},
  ];

  const fmtVal = (type, val) => {
    switch(type){
      case "PnL": return fmt(val);
      case "WinRate": return `${val}%`;
      case "Trades": return `${val}`;
      case "AvgR": return `${val>=0?"+":""}${val}R`;
      case "MaxLoss": return `$${Math.abs(val).toFixed(0)}`;
      default: return val;
    }
  };

  const fmtTarget = (type, amt) => {
    switch(type){
      case "PnL": case "MaxLoss": return `$${amt}`;
      case "WinRate": return `${amt}%`;
      case "AvgR": return `${amt}R`;
      default: return `${amt}`;
    }
  };

  const getColor = (type, pct, progress) => {
    if(type==="MaxLoss") return pct<=100?"var(--accent)":"#ff4d6d";
    if(type==="PnL") return progress>=0?"var(--accent)":"#ff4d6d";
    // simple = just green/red, traffic = green/amber/red
    if(goalColour==="traffic"){
      return pct>=100?"#00d49a":pct>=60?"#f6ad55":"#ff4d6d";
    }
    return pct>=100?"var(--accent)":"#ff4d6d";
  };

  const openNew = () => {
    setGroupForm({title:"", period:"Daily", targets:[]});
    setNewTarget({type:"PnL", amount:""});
    setEditGroupId(null);
    setShowAddGoal(true);
  };

  const addTargetToForm = () => {
    if(!newTarget.amount||isNaN(parseFloat(newTarget.amount))) return;
    setGroupForm(f=>({...f, targets:[...f.targets, {...newTarget, amount:parseFloat(newTarget.amount), id:Date.now()}]}));
    setNewTarget({type:"PnL", amount:""});
  };

  const saveGroup = () => {
    if(!groupForm.title||!groupForm.targets.length) return;
    if(editGroupId){
      setGoals(g=>g.map(gi=>gi.id===editGroupId?{...groupForm,id:editGroupId}:gi));
    } else {
      setGoals(g=>[...g,{...groupForm,id:Date.now()+Math.floor(Math.random()*1000000)}]);
    }
    setShowAddGoal(false);
  };

  return(
    <>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:16}}>
        <div className="section-title" style={{marginBottom:0}}>Goals</div>
        <button className="btn-ghost" style={{width:"auto",padding:"8px 18px",fontSize:11}} onClick={openNew}>+ Add Goals</button>
      </div>

      {goals.length===0?(
        <div className="empty">
          <div style={{marginBottom:16}}>
                <svg width="72" height="72" viewBox="0 0 72 72" fill="none" style={{opacity:0.5}}>
                  {/* Podium steps */}
                  <rect x="24" y="34" width="24" height="30" rx="2" stroke="#00d49a" strokeWidth="1.8" fill="#00d49a" fillOpacity="0.15"/>
                  <rect x="4" y="44" width="20" height="20" rx="2" stroke="#00d49a" strokeWidth="1.8" fill="#00d49a" fillOpacity="0.1" opacity="0.7"/>
                  <rect x="48" y="50" width="20" height="14" rx="2" stroke="#00d49a" strokeWidth="1.8" fill="#00d49a" fillOpacity="0.1" opacity="0.5"/>
                  {/* Numbers */}
                  <text x="36" y="52" textAnchor="middle" fontSize="11" fill="#00d49a" fontWeight="bold">1</text>
                  <text x="14" y="60" textAnchor="middle" fontSize="10" fill="#00d49a" fontWeight="bold" opacity="0.7">2</text>
                  <text x="58" y="62" textAnchor="middle" fontSize="10" fill="#00d49a" fontWeight="bold" opacity="0.5">3</text>
                  {/* Trophy cup body */}
                  <path d="M28 2 L44 2 L42 16 C42 21 38 24 36 24 C34 24 30 21 30 16 Z" fill="#00d49a" fillOpacity="0.25" stroke="#00d49a" strokeWidth="1.8" strokeLinejoin="round"/>
                  {/* Trophy handles */}
                  <path d="M28 6 C22 6 20 10 20 13 C20 16 22 18 26 18" stroke="#00d49a" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
                  <path d="M44 6 C50 6 52 10 52 13 C52 16 50 18 46 18" stroke="#00d49a" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
                  {/* Trophy stem */}
                  <rect x="34" y="24" width="4" height="5" fill="#00d49a" fillOpacity="0.4"/>
                  {/* Trophy base */}
                  <rect x="30" y="29" width="12" height="2.5" rx="1" fill="#00d49a" fillOpacity="0.6" stroke="#00d49a" strokeWidth="1.2"/>
                  {/* Star inside trophy */}
                  <path d="M36 7 L37 10 L40 10 L37.5 12 L38.5 15 L36 13 L33.5 15 L34.5 12 L32 10 L35 10 Z" fill="#00d49a" opacity="0.9"/>
                </svg>
              </div>
          <div className="empty-title">No goals set</div>
          <div className="empty-sub">What does a good week look like? Set a target and chase it.</div>
          <div style={{fontSize:12,color:"var(--text5)",marginBottom:24}}>Create a goal group to track multiple targets</div>
          <button className="btn-ghost" style={{width:"auto",padding:"12px 32px",marginTop:8}} onClick={openNew}>+ Create Goals</button>
        </div>
      ):(
        goals.map(group=>{
          const allDone = (group.targets||[]).every(t=>{
            const progress = getProgress(t.type, group.period, group.dateFrom, group.dateTo, group.playbookId);
            return t.type==="MaxLoss"?progress<=t.amount:progress>=t.amount;
          });
          return(
            <div key={group.id} className="stat-card" style={{marginBottom:12}}>
              {/* Group header */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
                <div>
                  <div style={{fontSize:15,color:"var(--text)",fontWeight:500,marginBottom:4}}>{group.title}</div>
                  <div style={{display:"flex",gap:6}}>
                    <span className="tag">{group.period==="Custom"&&group.dateFrom?`${group.dateFrom}→${group.dateTo||"now"}`:group.period}</span>
                    <span className="tag">{group.targets.length} target{group.targets.length!==1?"s":""}</span>
                {group.playbookId&&playbooks&&(()=>{const pb=playbooks.find(p=>String(p.id)===String(group.playbookId));return pb?<span className="tag" style={{color:"var(--accent)",borderColor:"var(--accent-dim)",background:"var(--accent-bg)"}}>&#9654; {pb.name}</span>:null;})()}
                    {group.period==="Daily"&&(()=>{const st=getStreak(group);if(st.current>0)return(<span style={{fontSize:9,padding:"2px 8px",borderRadius:4,background:"#f5b14c20",color:"#f5b14c",letterSpacing:"0.06em",fontWeight:600}}>🔥 {st.current} day{st.current!==1?"s":""}{st.best>st.current?` · best ${st.best}`:""}</span>);if(st.best>0)return(<span style={{fontSize:9,padding:"2px 8px",borderRadius:4,background:"var(--tag-bg)",color:"var(--text4)",letterSpacing:"0.06em"}}>best streak {st.best}</span>);return null;})()}
                    {allDone&&<span onClick={fireConfetti} style={{fontSize:9,padding:"2px 8px",borderRadius:4,background:"var(--accent-bg)",color:"var(--accent)",letterSpacing:"0.08em",cursor:"pointer"}}>✓ ALL MET 🎉</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn-ghost" style={{padding:"4px 10px",fontSize:10}} onClick={()=>setLocalShareGoal(group)}>Share</button>
                  <button className="btn-ghost" style={{padding:"4px 10px",fontSize:10}} onClick={()=>{setGroupForm({...group});setEditGroupId(group.id);setNewTarget({type:"PnL",amount:""});setShowAddGoal(true);}}>Edit</button>
                  <button onClick={()=>setGoals(g=>g.filter(gi=>gi.id!==group.id))} style={{background:"none",border:"none",color:"var(--text5)",cursor:"pointer",fontSize:18,padding:"2px 4px"}} onMouseEnter={e=>e.target.style.color="#ff4d6d"} onMouseLeave={e=>e.target.style.color="var(--text5)"}>×</button>
                </div>
              </div>
              {/* Individual targets as P&L cards */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {(group.targets||[]).map((target,i)=>{
                const progress = getProgress(target.type, group.period, group.dateFrom, group.dateTo, group.playbookId);
                // MaxLoss measures loss magnitude vs ceiling; others measure signed progress vs target.
                const rawPct = target.type==="MaxLoss"
                  ? Math.round(progress/target.amount*100)
                  : Math.round(Math.max(0,progress)/target.amount*100);
                const pct = Math.min(Math.max(rawPct,0), 100);
                const met = target.type==="MaxLoss" ? progress<=target.amount : progress>=target.amount;
                const col = getColor(target.type, rawPct, progress);
                const typeInfo = TYPES.find(t=>t.k===target.type);
                return(
                  <div key={target.id||i} style={{background:progress<0&&!met?"#ff4d6d05":"var(--bg)",border:"1px solid "+(met?col+"40":progress<0&&!met?"#ff4d6d20":"var(--border)"),borderRadius:10,padding:"12px 14px",position:"relative",overflow:"hidden"}}>
                    {/* Thin colour bar at top */}
                    <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:col,opacity:met?1:0.4}}/>
                    {/* Label */}
                    <div style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>{typeInfo&&typeInfo.l}</div>
                    {/* Current value */}
                    <div style={{fontSize:18,fontWeight:500,color:col,fontFamily:"DM Mono,monospace",letterSpacing:"-0.01em",lineHeight:1,marginBottom:4}}>{fmtVal(target.type,progress)}</div>
                    {/* Target */}

                    {/* Progress bar */}

                  </div>
                );
              })}
              </div>
            </div>
          );
        })

        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:200,display:"flex",alignItems:"flex-end"}} onMouseDown={e=>{if(e.target===e.currentTarget)setShowAddGoal(false);}}>

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>

                    style={{flex:1,padding:"10px 4px",border:"1px solid "+(groupForm.period===p?"var(--accent-dim)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:10,fontFamily:"DM Mono,monospace",

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

/* ── Number Input with comma formatting ── */
function NumberInput({value, onChange, placeholder, className, style, step}){
  const [display, setDisplay] = React.useState(value||"");

  React.useEffect(()=>{
    if(document.activeElement!==inputRef.current){
      setDisplay(value?Number(value).toLocaleString("en-GB"):"");
    }
  },[value]);

  const inputRef = React.useRef(null);

  const handleChange = (e) => {
    const raw = e.target.value.replace(/,/g,"");
    if(raw===""||raw==="-"||/^-?\d*\.?\d*$/.test(raw)){
      setDisplay(raw);
      onChange({target:{value:raw}});
    }
  };

  const handleBlur = () => {
    const num = parseFloat(display.replace(/,/g,""));
    if(!isNaN(num)) setDisplay(num.toLocaleString("en-GB"));
  };

  const handleFocus = () => {
    setDisplay(display.replace(/,/g,""));
  };

  return(
    <input
      ref={inputRef}
      type="text"
      inputMode="decimal"
      placeholder={placeholder}
      className={className}
      style={style}
      value={display}
      onChange={handleChange}
      onBlur={handleBlur}
      onFocus={handleFocus}
    />
  );
}

/* ── Swipe Actions ── */
function SwipeToDelete({children, onDelete, onEdit}){
  const [offset, setOffset] = useState(0);
  const [swiping, setSwiping] = useState(false);
  const startX = useRef(0);
  const startY = useRef(0);
  const isDragging = useRef(false);
  const THRESHOLD = 80;

  const onTouchStart = e => {
    if(offset !== 0) { setOffset(0); setSwiping(false); return; }
    startX.current = e.touches[0].clientX;
    startY.current = e.touches[0].clientY;
    isDragging.current = false;
  };

  const onTouchMove = e => {
    const dx = e.touches[0].clientX - startX.current;
    const dy = e.touches[0].clientY - startY.current;
    if(!isDragging.current && Math.abs(dy) > Math.abs(dx)) return;
    isDragging.current = true;
    setSwiping(true);
    // Only allow left swipe (negative offset)
    setOffset(Math.max(-140, Math.min(0, dx)));
    e.preventDefault();
  };

  const onTouchEnd = () => {
    if(offset < -THRESHOLD){
      setOffset(-140);
      setTimeout(()=>{ onDelete(); setOffset(0); setSwiping(false); }, 200);
    } else {
      setOffset(0);
      setSwiping(false);
    }
    isDragging.current = false;
  };

  return(
    <div className="swipe-wrap">
      {/* Delete bg (left swipe only) */}
      <div className="swipe-delete-bg">
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
          </svg>
          <span style={{fontSize:9,color:"white",letterSpacing:"0.1em",textTransform:"uppercase"}}>Delete</span>
        </div>
      </div>
      {/* Card */}
      <div className="swipe-card"
        style={{transform:"translateX("+offset+"px)",transition:swiping?"none":"transform 0.25s ease"}}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}>
        {children}
      </div>
    </div>
  );
}

/* ── Duration Picker — infinite continuous roll ── */
function DurationPicker({value, onChange}){
  const totalMins = parseInt(value)||0;
  const [open, setOpen] = React.useState(false);
  const [selH, setSelH] = React.useState(Math.floor(totalMins/60));
  const [selM, setSelM] = React.useState(totalMins%60);
  const hRef = React.useRef(null);
  const mRef = React.useRef(null);
  const hAdj = React.useRef(false);
  const mAdj = React.useRef(false);

  const ITEM_H = 48;
  const H_LIST = Array.from({length:24},(_,i)=>i);
  const M_LIST = Array.from({length:60},(_,i)=>i);
  const REPS = 9; // enough repetitions to feel truly infinite

  // Build repeated arrays once
  const hItems = Array.from({length:REPS*H_LIST.length},(_,i)=>H_LIST[i%H_LIST.length]);
  const mItems = Array.from({length:REPS*M_LIST.length},(_,i)=>M_LIST[i%M_LIST.length]);

  function initCol(ref, list, idx){
    if(!ref.current) return;
    const mid = Math.floor(REPS/2);
    ref.current.scrollTop = (mid * list.length + idx - 2) * ITEM_H;
  }

  React.useEffect(()=>{
    if(open){
      const h=Math.floor((parseInt(value)||0)/60);
      const m=(parseInt(value)||0)%60;
      setSelH(h); setSelM(m);
      // Two rAF to ensure the DOM is rendered before scrolling
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        initCol(hRef,H_LIST,h);
        initCol(mRef,M_LIST,m);
      }));
    }
  },[open]);

  function handleScroll(ref, list, setter, adjRef){
    const el=ref.current; if(!el) return;
    const len=list.length, band=len*ITEM_H;
    // Silent wrap — jump to middle when approaching either end
    if(!adjRef.current && el.scrollTop < band){
      adjRef.current=true;
      el.scrollTop += band * Math.floor(REPS/2);
      setTimeout(()=>{ adjRef.current=false; },30);
    } else if(!adjRef.current && el.scrollTop >= band*(REPS-1)){
      adjRef.current=true;
      el.scrollTop -= band * Math.floor(REPS/2);
      setTimeout(()=>{ adjRef.current=false; },30);
    }
    // Debounced snap + state update
    clearTimeout(ref._snap);
    ref._snap=setTimeout(()=>{
      const idx=(Math.round(el.scrollTop/ITEM_H)+2)%len;
      setter(idx);
      const absIdx=Math.round(el.scrollTop/ITEM_H)+2;
      el.scrollTop=(absIdx-2)*ITEM_H;
    },160);
  }

  function handleConfirm(){
    const h=hRef.current?(Math.round(hRef.current.scrollTop/ITEM_H)+2)%H_LIST.length:selH;
    const m=mRef.current?(Math.round(mRef.current.scrollTop/ITEM_H)+2)%M_LIST.length:selM;
    onChange(h*60+m);
    setOpen(false);
  }

  const display=totalMins===0?"— Tap to set":
    (Math.floor(totalMins/60)>0?Math.floor(totalMins/60)+"h ":"")+
    (totalMins%60>0?String(totalMins%60).padStart(2,"0")+"m":
     (Math.floor(totalMins/60)>0?"":"—"));

  const colStyle={
    height:ITEM_H*5,
    overflowY:"scroll",
    scrollSnapType:"y mandatory",
    WebkitOverflowScrolling:"touch",
    position:"relative",
    flex:1,
  };

  const itemStyle=()=>({
    height:ITEM_H,
    display:"flex",
    alignItems:"center",
    justifyContent:"center",
    scrollSnapAlign:"center",
    fontSize:20,
    fontFamily:"DM Mono,monospace",
    fontWeight:500,
    color:"var(--text)",
    letterSpacing:"0.02em",
    userSelect:"none",
    opacity:0.9,
  });

  return(<>
    <div onClick={()=>setOpen(true)} className="field-input" style={{cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",userSelect:"none"}}>
      <span style={{color:totalMins>0?"var(--text)":"var(--text3)",fontFamily:"DM Mono,monospace",fontSize:14}}>{display}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>

    {open&&(
      <div style={{position:"fixed",inset:0,zIndex:9999,display:"flex",flexDirection:"column",justifyContent:"flex-end"}} onClick={e=>{if(e.target===e.currentTarget){setOpen(false);}}}>
        <div style={{background:"rgba(0,0,0,0.6)",position:"absolute",inset:0}} onClick={()=>setOpen(false)}/>
        <div style={{position:"relative",background:"var(--surface)",borderRadius:"20px 20px 0 0",paddingBottom:38,boxShadow:"0 -12px 48px #00000070"}}>

          {/* Header */}
