                      <div style={{fontSize:9,color:"var(--text5)",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:3}}>{s.l}</div>
                      <div style={{fontFamily:"DM Mono,monospace",fontSize:13,color:"var(--text3)"}}>{s.v}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{padding:"10px 20px",borderTop:"1px solid #1c2230",display:"flex",justifyContent:"space-between"}}>
                {/* trader name in footer */}
                <div style={{fontFamily:"Syne,sans-serif",fontSize:9,color:"var(--text5)",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase"}}>{traderName||"LOGGED"}</div>
                <div style={{fontSize:9,color:"#1c2230",letterSpacing:"0.1em"}}>logged.app</div>
              </div>
            </div>
            <button onClick={()=>setShareCurve(false)} style={{marginTop:16,background:"none",border:"1px solid var(--accent-dim)",borderRadius:8,padding:"10px 24px",color:"var(--accent)",fontFamily:"DM Mono,monospace",fontSize:11,cursor:"pointer"}}>Close</button>
          </div>
        );
      })()}

      {/* Content */}
      <div className="content" ref={contentRef}>

        {/* Pull to refresh indicator */}
        {pullRefresh&&(
          <div style={{textAlign:"center",padding:"8px 0 4px",color:"var(--accent)",fontSize:11,letterSpacing:"0.1em",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{animation:"spin 0.8s linear infinite"}}>
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Refreshing...
          </div>
        )}

        {/* JOURNAL */}
        {view==="journal"&&(()=>{ const col="#f5b14c"; return (
          <>
            {showInstall&&(
              <div className="install-banner">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                <p>
                  {isIOS
                    ? <>Tap <strong>Share</strong> then <strong>"Add to Home Screen"</strong> to install Logged as an app.</>
                    : <>Tap <strong>Install</strong> to add Logged to your home screen.</>
                  }
                </p>
                {!isIOS&&deferredPrompt&&(
                  <button onClick={async()=>{deferredPrompt.prompt();const r=await deferredPrompt.userChoice;if(r.outcome==="accepted")dismissInstall();}}>Install</button>
                )}
                {isIOS&&<button onClick={dismissInstall}>Got it</button>}
              </div>
            )}

            <div className="section-title">Trade Log</div>

            {/* Prop-Firm Status */}
            {activeAccount.propEnabled&&(()=>{
              const startBal=parseFloat(balance)||0;
              // Prop tracking needs a starting balance for drawdown floors to make sense
              if(startBal<=0){
                return(
                  <div style={{background:"var(--surface)",border:"1px solid #f6ad5540",borderRadius:12,padding:14,marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                      <div style={{width:6,height:6,borderRadius:"50%",background:"#f6ad55"}}/>
                      <span style={{fontSize:11,fontFamily:"DM Mono,monospace",color:"var(--text2)",fontWeight:600}}>PROP STATUS</span>
                    </div>
                    <div style={{fontSize:11,color:"var(--text4)",lineHeight:1.5}}>Set your account's starting balance to track drawdown and targets. Tap the balance at the top of Stats to add it.</div>
                  </div>
                );
              }
              const target=parseFloat(activeAccount.propTarget)||0;
              const maxDailyLoss=parseFloat(activeAccount.propDailyLoss)||0;
              const maxDD=parseFloat(activeAccount.propMaxDD)||0;
              const ddType=activeAccount.propDDType||"trailing";
              // Build running balance chronologically
              const sorted=[...trades].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.id-b.id);
              let running=startBal, peak=startBal;
              const dailyPnl={};
              sorted.forEach(t=>{
                const p=cachedCalc(t).pnl;
                running+=p;
                if(running>peak)peak=running;
                const d=t.date||"";
                dailyPnl[d]=(dailyPnl[d]||0)+p;
              });
              const totalPnl=running-startBal;
              const currentBal=running;
              // Distance to profit target
              const targetProgress=target>0?Math.min(100,Math.max(0,(totalPnl/target)*100)):0;
              const targetRemaining=target>0?target-totalPnl:0;
              // Today's loss vs daily limit
              const todayStr2=new Date().toISOString().split("T")[0];
              const todayLoss=dailyPnl[todayStr2]||0;
              const dailyLossRemaining=maxDailyLoss>0?maxDailyLoss+Math.min(0,todayLoss):maxDailyLoss;
              // Drawdown floor
              let ddFloor=0;
              if(ddType==="trailing")ddFloor=peak-maxDD;
              else if(ddType==="static")ddFloor=startBal-maxDD;
              else ddFloor=(currentBal-todayLoss)-maxDD; // intraday: from today's start
              const ddBuffer=maxDD>0?currentBal-ddFloor:0;
              const ddBufferPct=maxDD>0?Math.min(100,Math.max(0,(ddBuffer/maxDD)*100)):100;
              // Warning levels
              const dailyDanger=maxDailyLoss>0&&dailyLossRemaining<maxDailyLoss*0.25;
              const ddDanger=maxDD>0&&ddBuffer<maxDD*0.25;
              const passed=target>0&&totalPnl>=target;
              return(
                <div style={{background:passed?"var(--accent-bg)":"var(--surface)",border:"1px solid "+(ddDanger||dailyDanger?"#ff4d6d":passed?"var(--accent)":"var(--border)"),borderRadius:12,padding:14,marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <div style={{width:6,height:6,borderRadius:"50%",background:passed?"var(--accent)":ddDanger||dailyDanger?"#ff4d6d":"#f6ad55"}}/>
                      <span style={{fontSize:11,fontFamily:"DM Mono,monospace",color:"var(--text2)",fontWeight:600,letterSpacing:"0.03em"}}>{passed?"TARGET PASSED":"PROP STATUS"}</span>
                    </div>
                    <span style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace",textTransform:"uppercase"}}>{ddType} DD</span>
                  </div>

                  {/* Profit target progress */}
                  {target>0&&(
                    <div style={{marginBottom:12}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{fontSize:10,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>Target</span>
                        <span style={{fontSize:10,color:passed?"var(--accent)":"var(--text3)",fontFamily:"DM Mono,monospace"}}>{passed?"✓ Passed":fmt(Math.max(0,targetRemaining))+" to go"}</span>
                      </div>
                      <div style={{height:6,background:"var(--surface2)",borderRadius:3,overflow:"hidden"}}>
                        <div style={{width:targetProgress+"%",height:"100%",background:passed?"var(--accent)":"var(--accent-dim)",borderRadius:3,transition:"width 0.3s"}}/>
                      </div>
                      <div style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace",marginTop:2}}>{fmt(totalPnl)} / {fmt(target)} ({Math.round(targetProgress)}%)</div>
                    </div>
                  )}

                  {/* Daily loss buffer */}
                  {maxDailyLoss>0&&(
                    <div style={{marginBottom:12}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{fontSize:10,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>Daily loss left</span>
                        <span style={{fontSize:10,color:dailyDanger?"#ff4d6d":"var(--text3)",fontFamily:"DM Mono,monospace"}}>{fmt(Math.max(0,dailyLossRemaining))}</span>
                      </div>
                      <div style={{height:6,background:"var(--surface2)",borderRadius:3,overflow:"hidden"}}>
                        <div style={{width:(maxDailyLoss>0?Math.min(100,Math.max(0,(dailyLossRemaining/maxDailyLoss)*100)):0)+"%",height:"100%",background:dailyDanger?"#ff4d6d":"#f6ad55",borderRadius:3,transition:"width 0.3s"}}/>
                      </div>
                    </div>
                  )}

                  {/* Drawdown buffer */}
                  {maxDD>0&&(
                    <div>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{fontSize:10,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>Drawdown buffer</span>
                        <span style={{fontSize:10,color:ddDanger?"#ff4d6d":"var(--text3)",fontFamily:"DM Mono,monospace"}}>{fmt(Math.max(0,ddBuffer))}</span>
                      </div>
                      <div style={{height:6,background:"var(--surface2)",borderRadius:3,overflow:"hidden"}}>
                        <div style={{width:ddBufferPct+"%",height:"100%",background:ddDanger?"#ff4d6d":ddBufferPct<50?"#f6ad55":"var(--accent)",borderRadius:3,transition:"width 0.3s"}}/>
                      </div>
                      <div style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace",marginTop:2}}>Floor: {fmt(ddFloor)} · Now: {fmt(currentBal)}</div>
                    </div>
                  )}
                  {(ddDanger||dailyDanger)&&<div style={{fontSize:10,color:"#ff4d6d",fontFamily:"DM Mono,monospace",marginTop:10,textAlign:"center",fontWeight:600}}>&#9888; Close to breach — protect the account</div>}
                </div>
              );
            })()}

            {/* Today's Bias */}
            {(()=>{
              const _today=new Date().toISOString().split("T")[0];
              const tb=dailyBias[_today];
              const openSheet=()=>{const b=tb||{};setBiasDraft({bias:b.bias||"Neutral",draw:b.draw||"",levels:b.levels||"",news:b.news||""});setShowBiasSheet(true);};
              if(!tb){
                return(
                  <button onClick={openSheet} style={{width:"100%",background:"var(--surface)",border:"1px dashed var(--border2)",borderRadius:10,padding:"10px 14px",marginBottom:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:"var(--text4)",fontSize:11,fontFamily:"DM Mono,monospace"}}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    Set today's bias
                  </button>
                );
              }
              const col=tb.bias==="Long"?"var(--accent)":tb.bias==="Short"?"#ff4d6d":"#f6ad55";
              return(
                <div onClick={openSheet} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",marginBottom:10,cursor:"pointer"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
                      <div style={{width:6,height:6,borderRadius:"50%",background:col,flexShrink:0}}/>
                      <span style={{fontSize:11,fontFamily:"DM Mono,monospace",color:col,fontWeight:600,flexShrink:0}}>{tb.bias.toUpperCase()}</span>
                      {tb.draw&&<span style={{fontSize:10,color:"var(--text4)",fontFamily:"DM Mono,monospace",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>&rarr; {tb.draw}</span>}
                    </div>
                    {tb.news&&<span style={{fontSize:9,color:"#f6ad55",fontFamily:"DM Mono,monospace",flexShrink:0}}>News: {tb.news}</span>}
                  </div>
                  {tb.levels&&<div style={{fontSize:9,color:"var(--text5)",fontFamily:"DM Mono,monospace",marginTop:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Levels: {tb.levels}</div>}
                </div>
              );
            })()}

            {/* Daily P&L banner */}
            {(()=>{
              const todayStr=new Date().toISOString().split("T")[0];
              const todayTrades=trades.filter(t=>t.date===todayStr);
              if(!todayTrades.length) return null;
              const todayPnl=todayTrades.reduce((s,t)=>s+cachedCalc(t).pnl,0);
              const wins=todayTrades.filter(t=>cachedCalc(t).pnl>0).length;
              const losses=todayTrades.filter(t=>cachedCalc(t).pnl<0).length;
              const bes=todayTrades.filter(t=>cachedCalc(t).pnl===0).length;
              const col=todayPnl>0?"var(--accent)":todayPnl<0?"#ff4d6d":"var(--text3)";
              // Per-session breakdown for today
              const sessBkdn={};
              todayTrades.forEach(t=>{
                const s=t.session||"Other";
                if(!sessBkdn[s])sessBkdn[s]={pnl:0,count:0};
                sessBkdn[s].pnl+=cachedCalc(t).pnl;
                sessBkdn[s].count++;
              });
              const sessEntries=Object.entries(sessBkdn).sort((a,b)=>b[1].pnl-a[1].pnl);
              const multiSess=sessEntries.length>1;
              return(
                <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"10px 14px",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:6,height:6,borderRadius:"50%",background:col,flexShrink:0}}/>
                      <div>
                        <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"DM Mono,monospace",marginBottom:1}}>Today</div>
                        <div style={{fontSize:12,color:"var(--text2)",fontFamily:"DM Mono,monospace"}}>
                          {todayTrades.length} trade{todayTrades.length!==1?"s":""} · {wins}W {losses}L{bes>0?" "+bes+"BE":""}
                        </div>
                      </div>
                    </div>
                    <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:18,color:col}}>{todayPnl>=0?"+":""}{fmt(todayPnl)}</div>
                  </div>
                  {multiSess&&(
                    <div style={{display:"flex",gap:10,marginTop:8,paddingTop:8,borderTop:"1px solid var(--border2)",flexWrap:"wrap"}}>
                      {sessEntries.map(([sess,d])=>{
                        const sc=d.pnl>0?"var(--accent)":d.pnl<0?"#ff4d6d":"var(--text4)";
                        return(
                          <div key={sess} style={{display:"flex",alignItems:"center",gap:5}}>
                            <span style={{width:4,height:4,borderRadius:"50%",background:sc,display:"inline-block",flexShrink:0}}/>
                            <span style={{fontSize:10,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>{sess}</span>
                            <span style={{fontSize:10,color:sc,fontFamily:"DM Mono,monospace",fontWeight:600}}>{d.pnl>=0?"+":""}{fmt(d.pnl)}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })()}

            {showKillzone&&<KillzoneTimer onDismiss={()=>{setShowKillzone(false);try{localStorage.setItem("logged_killzone_dismissed","1");}catch{}}}/>}

            {/* Backup nudge */}
            {!backupSnooze&&trades.length>0&&(()=>{
              const stale=!backupMeta?trades.length>=10:((trades.length-(backupMeta.count||0))>=25||Date.now()-backupMeta.ts>7*86400000);
              if(!stale) return null;
              const sinceCount=backupMeta?trades.length-(backupMeta.count||0):trades.length;
              return(
                <div style={{background:"#f6ad5510",border:"1px solid #f6ad5535",borderRadius:10,padding:"9px 12px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                  <div style={{fontSize:10,color:"var(--text3)",fontFamily:"DM Mono,monospace",lineHeight:1.4,minWidth:0}}>{sinceCount} trade{sinceCount===1?"":"s"} not backed up — your journal lives only on this device.</div>
                  <div style={{display:"flex",gap:6,flexShrink:0,alignItems:"center"}}>
                    <button onClick={()=>{const n=exportFullBackup(trades.length);setBackupMeta({ts:Date.now(),count:trades.length});setSaveToast({msg:"Backup saved — "+n+" items"});setTimeout(()=>setSaveToast(null),2500);}}
                      style={{background:"#f6ad5520",border:"1px solid #f6ad5550",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:10,color:"#f6ad55",fontFamily:"DM Mono,monospace",fontWeight:600}}>Back up</button>
                    <button onClick={()=>{setBackupSnooze(true);try{sessionStorage.setItem("logged_backup_snooze","1");}catch(e){}}}
                      style={{background:"none",border:"none",color:"var(--text5)",fontSize:14,cursor:"pointer",padding:"0 2px",lineHeight:1}}>×</button>
                  </div>
                </div>
              );
            })()}

            <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",marginBottom:12,marginTop:-8}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                {/* Sort dropdown */}
                <div style={{position:"relative",display:"flex",alignItems:"center",background:"none",border:"1px solid var(--accent-dim)",borderRadius:8,overflow:"hidden",height:36}}>
                  <span style={{fontSize:11,color:"var(--text4)",fontFamily:"DM Mono,monospace",padding:"0 8px 0 12px",flexShrink:0}}>Sort</span>
                  <div style={{width:1,height:20,background:"var(--accent-dim)"}}/>
                  <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} style={{background:"transparent",border:"none",padding:"0 28px 0 8px",color:"var(--accent)",fontSize:11,fontFamily:"DM Mono,monospace",cursor:"pointer",outline:"none",appearance:"none",WebkitAppearance:"none",height:36}}>
                    <option value="date">Date</option>
                    <option value="pnl">P&amp;L</option>
                    <option value="r">R</option>
                    <option value="instrument">Instrument</option>
                    <option value="duration">Duration</option>
                  </select>
                  <svg style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}} width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" color="var(--text4)"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <button aria-label="Toggle search" onClick={()=>setShowSearch(s=>!s)} style={{background:showSearch?"var(--accent-bg)":"none",border:"1px solid var(--accent-dim)",borderRadius:8,height:36,padding:"0 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,color:"var(--accent)",transition:"all 0.15s",position:"relative"}}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  <span style={{fontSize:11,fontFamily:"DM Mono,monospace"}}>Filter</span>
                  {(filterOutcome!=="All"||filterInstrument!=="All"||filterDirection!=="All"||filterPlaybook!=="All"||filterDateFrom||filterDateTo||filterAssetClass!=="All"||filterSession!=="All"||searchQuery)&&<div style={{position:"absolute",top:-3,right:-3,width:8,height:8,borderRadius:"50%",background:"var(--accent)"}}/>}
                </button>
              </div>
            </div>

            {trades.length>0&&(()=>{
              const recent=[...trades].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
              const scores=recent.map(t=>calcDisciplineScore(t));
              const avg=Math.round(scores.reduce((s,x)=>s+x,0)/scores.length*10)/10;
              const col=avg>=8?"#00d49a":avg>=6?"#f6ad55":"#ff4d6d";
              const label=avg>=8?"Excellent":avg>=6?"Good":avg>=4?"Needs work":"Poor";
              const C=2*Math.PI*28;
              const dash=(avg/10)*C;
              return(
                <div className="stat-card" style={{marginBottom:16,background:"linear-gradient(135deg,"+col+"08 0%,transparent 60%)",border:"1px solid "+col+"30",position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,"+col+","+col+"40,transparent)"}}/>
                  <div style={{display:"flex",alignItems:"center",gap:16}}>
                    <div style={{position:"relative",flexShrink:0,width:72,height:72}}>
                      <svg width="72" height="72" viewBox="0 0 72 72">
                        <circle cx="36" cy="36" r="28" fill="none" stroke="var(--border2)" strokeWidth="5"/>
                        <circle cx="36" cy="36" r="28" fill="none" stroke={col} strokeWidth="5"
                          strokeDasharray={dash+" "+(C-dash)}
                          strokeDashoffset={C*0.25}
                          strokeLinecap="round"/>
                      </svg>
                      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                        <div style={{fontFamily:"Syne,sans-serif",fontWeight:900,fontSize:20,color:col,lineHeight:1}}>{avg}</div>
                        <div style={{fontSize:8,color:"var(--text5)",letterSpacing:"0.1em"}}>/10</div>
                      </div>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                        <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:16,color:"var(--text)"}}>Discipline Score</div>
                        <div style={{fontSize:10,color:col,background:col+"15",border:"1px solid "+col+"30",borderRadius:6,padding:"2px 8px",letterSpacing:"0.06em"}}>{label}</div>
                      </div>
                      <div style={{fontSize:11,color:"var(--text4)",marginBottom:8}}>Last {recent.length} trades</div>
                      <div style={{display:"flex",gap:3,alignItems:"flex-end",height:24}}>
                        {scores.map((sc,i)=>{
                          const bc=sc>=8?"#00d49a":sc>=6?"#f6ad55":"#ff4d6d";
                          return(<div key={i} title={"Trade "+(recent.length-i)+": "+sc+"/10"} style={{flex:1,height:(sc/10*24)+"px",background:bc,borderRadius:"2px 2px 0 0",opacity:0.7,minHeight:3}}/>);
                        })}
                      </div>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginTop:12}}>
                    {[
                      {l:"Checklist",v:Math.round(recent.filter(t=>(t.checklist||[]).length>0).length/recent.length*100)+"%"},
                      {l:"Notes",v:Math.round(recent.filter(t=>(t.notes||"").length>20).length/recent.length*100)+"%"},
                      {l:"Emotion",v:Math.round(recent.filter(t=>(t.emotion||[]).length>0).length/recent.length*100)+"%"},
                    ].map(({l,v})=>(
                      <div key={l} style={{background:"var(--surface2)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                        <div style={{fontSize:14,fontWeight:600,color:"var(--text)",fontFamily:"DM Mono,monospace"}}>{v}</div>
                        <div style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.08em",textTransform:"uppercase",marginTop:2}}>{l}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

            {/* Search & Filter panel */}
            {showSearch&&(
              <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"12px",marginBottom:14}}>
                {/* Search */}
                <input className="field-input" placeholder="Search notes, strategy, setup, instrument..." value={searchQuery}
                  onChange={e=>setSearchQuery(e.target.value)}
                  style={{marginBottom:10,fontSize:16,padding:"10px 12px"}}/>

                {/* Date range filter */}
                <div>
                  <div style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>Date Range</div>
                  {/* Quick presets */}
                  <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
                    {[
                      {l:"Today",fn:()=>{const d=new Date().toISOString().split("T")[0];setFilterDateFrom(d);setFilterDateTo(d);}},
                      {l:"This Week",fn:()=>{const now=new Date();const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));setFilterDateFrom(mon.toISOString().split("T")[0]);setFilterDateTo(new Date().toISOString().split("T")[0]);}},
                      {l:"Last Week",fn:()=>{const now=new Date();const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7)-7);const sun=new Date(mon);sun.setDate(mon.getDate()+6);setFilterDateFrom(mon.toISOString().split("T")[0]);setFilterDateTo(sun.toISOString().split("T")[0]);}},
                      {l:"This Month",fn:()=>{const now=new Date();setFilterDateFrom(now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-01");setFilterDateTo(new Date().toISOString().split("T")[0]);}},
                      {l:"Last Month",fn:()=>{const now=new Date();const lm=new Date(now.getFullYear(),now.getMonth()-1,1);const le=new Date(now.getFullYear(),now.getMonth(),0);setFilterDateFrom(lm.toISOString().split("T")[0]);setFilterDateTo(le.toISOString().split("T")[0]);}},
                    ].map(({l,fn})=>{
                      const isActive=(()=>{
                        const now=new Date();
                        if(l==="Today"){const d=now.toISOString().split("T")[0];return filterDateFrom===d&&filterDateTo===d;}
                        if(l==="This Week"){const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));return filterDateFrom===mon.toISOString().split("T")[0]&&filterDateTo===now.toISOString().split("T")[0];}
                        return false;
                      })();
                      return <button key={l} onClick={fn} style={{padding:"4px 10px",border:"1px solid "+(isActive?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"DM Mono,monospace",background:isActive?"var(--accent-bg)":"var(--input-bg)",color:isActive?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>{l}</button>;
                    })}
                  </div>
                  {/* Manual inputs */}
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <input type="date" value={filterDateFrom} onChange={e=>setFilterDateFrom(e.target.value)}
                      style={{flex:1,background:"var(--input-bg)",border:"1px solid var(--border2)",borderRadius:6,padding:"6px 10px",color:filterDateFrom?"var(--text)":"var(--text4)",fontSize:12,fontFamily:"DM Mono,monospace"}}/>
                    <span style={{fontSize:11,color:"var(--text4)"}}>to</span>
                    <input type="date" value={filterDateTo} onChange={e=>setFilterDateTo(e.target.value)}
                      style={{flex:1,background:"var(--input-bg)",border:"1px solid var(--border2)",borderRadius:6,padding:"6px 10px",color:filterDateTo?"var(--text)":"var(--text4)",fontSize:12,fontFamily:"DM Mono,monospace"}}/>
                    {(filterDateFrom||filterDateTo)&&<button onClick={()=>{setFilterDateFrom("");setFilterDateTo("");}} style={{background:"none",border:"none",color:"var(--text4)",fontSize:16,cursor:"pointer",padding:"0 4px",lineHeight:1}}>×</button>}
                  </div>
                </div>

                {/* Outcome filter */}
                <div style={{marginBottom:8}}>
                  <div style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>Outcome</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {["All","TP","SL","BE","Partial","Imported","Mistake"].map(o=>(
                      <button key={o} onClick={()=>setFilterOutcome(o)} style={{padding:"5px 12px",border:"1px solid "+(filterOutcome===o?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:filterOutcome===o?"var(--accent-bg)":"var(--input-bg)",color:filterOutcome===o?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>{o}</button>
                    ))}
                  </div>
                </div>

                {/* Instrument filter */}
                <div>
                  <div style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>Instrument</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <button onClick={()=>setFilterInstrument("All")} style={{padding:"5px 12px",border:"1px solid "+(filterInstrument==="All"?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:filterInstrument==="All"?"var(--accent-bg)":"var(--input-bg)",color:filterInstrument==="All"?"var(--accent)":"var(--text4)"}}>All</button>
                    {INSTRUMENTS.filter(i=>trades.some(t=>t.instrument===i.symbol)).map(i=>(
                      <button key={i.symbol} onClick={()=>setFilterInstrument(i.symbol)} style={{padding:"5px 12px",border:"1px solid "+(filterInstrument===i.symbol?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:filterInstrument===i.symbol?"var(--accent-bg)":"var(--input-bg)",color:filterInstrument===i.symbol?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>{i.symbol}</button>
                    ))}
                  </div>
                </div>

                {/* Asset Class filter */}
                <div>
                  <div style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>Asset Class</div>
                  <div style={{display:"flex",gap:6}}>
                    {[["All","All"],["Futures","futures"],["Crypto","crypto"],["Forex","forex"]].map(([label,val])=>(
                      <button key={val} onClick={()=>setFilterAssetClass(val)} style={{padding:"5px 12px",border:"1px solid "+(filterAssetClass===val?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:filterAssetClass===val?"var(--accent-bg)":"var(--input-bg)",color:filterAssetClass===val?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>{label}</button>
                    ))}
                  </div>
                </div>

                {/* Session filter */}
                <div>
                  <div style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>Session</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {["All",...allSessions].map(s=>(
                      <button key={s} onClick={()=>setFilterSession(s)} style={{padding:"5px 12px",border:"1px solid "+(filterSession===s?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:filterSession===s?"var(--accent-bg)":"var(--input-bg)",color:filterSession===s?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>{s}</button>
                    ))}

                              <div className="trade-meta">
                                {trade.playbookId&&(()=>{const pb=playbooks.find(p=>p.id===trade.playbookId);return pb?<span className="tag" style={{color:"var(--accent)",borderColor:"var(--accent-dim)",background:"var(--accent-bg)"}}>&#9654; {pb.name}</span>:null;})()}

                                {trade.plannedEntry&&trade.entry&&parseFloat(trade.plannedEntry)!==parseFloat(trade.entry)&&(()=>{const diff=parseFloat(trade.entry)-parseFloat(trade.plannedEntry);const isSlip=(trade.direction==="Long"&&diff>0)||(trade.direction==="Short"&&diff<0);return<span className="tag" style={{color:isSlip?"#ff4d6d":"var(--accent)",borderColor:isSlip?"#ff4d6d30":"var(--accent-dim)"}}>{isSlip?"⚠ slip":"✓ impr"}: {diff>=0?"+":""}{diff.toFixed(4)}</span>;})()}
                                {trade.mfe&&trade.stop&&trade.entry&&(()=>{const e=parseFloat(trade.entry),s=parseFloat(trade.stop);const risk=Math.abs(e-s);if(!risk)return null;const dir=trade.direction==="Long"?1:-1;const v=Math.round(dir*(parseFloat(trade.mfe)-e)/risk*100)/100;return<span className="tag" style={{color:"#a78bfa",borderColor:"#a78bfa30"}}>MFE {v>=0?"+":""}{v}R</span>;})()}
                                {trade.mae&&trade.stop&&trade.entry&&(()=>{const e=parseFloat(trade.entry),s=parseFloat(trade.stop);const risk=Math.abs(e-s);if(!risk)return null;const dir=trade.direction==="Long"?1:-1;const v=Math.round(dir*(parseFloat(trade.mae)-e)/risk*100)/100;return<span className="tag" style={{color:"var(--text4)",borderColor:"var(--border2)"}}>MAE {v>=0?"+":""}{v}R</span>;})()}
                                {trade.planAligned===true&&<span className="tag" style={{color:"var(--accent)",borderColor:"var(--accent-dim)"}}>{"\u2713"} plan</span>}
                                {trade.planAligned===false&&<span className="tag" style={{color:"#f6ad55",borderColor:"#f6ad5540"}}>{"\u26A0"} anti-plan</span>}

                              {trade.playbookId&&(()=>{
                              const pb=playbooks.find(p=>p.id===trade.playbookId);
                              if(!pb) return null;
                              const fields=[
                                {l:"Instrument",match:!pb.instrument||pb.instrument===trade.instrument},
                                {l:"Direction",match:!pb.direction||pb.direction===trade.direction},
                                {l:"Session",match:!pb.session||pb.session===trade.session},
                                {l:"Setup",match:!pb.setup||pb.setup===trade.setup},
                              ].filter(f=>f.l==="Instrument"?pb.instrument:f.l==="Direction"?pb.direction:f.l==="Session"?pb.session:pb.setup);
                              if(!fields.length) return null;
                              const matched=fields.filter(f=>f.match).length;
                              const pct=Math.round(matched/fields.length*100);
                              const col=pct===100?"var(--accent)":pct>=75?"#f6ad55":"#ff4d6d";
                              return(
                                <div style={{marginTop:10,background:"var(--surface2)",borderRadius:8,padding:"10px 12px"}}>
                                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>

                                </div>

                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                View Chart
                              </a>

                              {trade.checklist&&trade.checklist.length>0&&(
                                <div style={{marginTop:10}}>
                                  <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Pre-Trade Checklist</div>

                                  <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Charts</div>
                                  {imgs.length===1?(
                                    <div className="thumb-featured" onClick={()=>setLightbox({images:imgs,start:0})}>
                                      <img src={imgs[0].dataUrl} alt=""/>

                                    </div>

                                    <div>
                                      <div className="thumb-featured" onClick={()=>setLightbox({images:imgs,start:0})} style={{marginBottom:8}}>
                                        <img src={imgs[0].dataUrl} alt=""/>
                                        <div className="thumb-overlay"/>

                                            <img src={img.dataUrl} alt=""/>

                              <div style={{display:"flex",gap:8,marginTop:12}}>
                                <button className="btn-ghost" style={{flex:1}} onClick={()=>edit(trade)}>Edit</button>
                                <button className="btn-ghost" style={{flex:1}} onClick={()=>setShareTrade(trade)}>
                                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{marginRight:4}}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                                  Share
                                </button>
                                <button onClick={()=>{setTrades(ts=>ts.map(t=>t.id===trade.id?{...t,mistake:!t.mistake}:t));}} style={{flex:1,padding:"10px 14px",border:"1px solid "+(trade.mistake?"#f6ad55":"var(--border2)"),borderRadius:10,cursor:"pointer",fontSize:13,background:trade.mistake?"#f6ad5515":"var(--surface2)",color:trade.mistake?"#f6ad55":"var(--text3)"}}>
                  {trade.mistake?"⚠ Mistake":"Mark Mistake"}
                </button>
                <button className="btn-danger" style={{flex:1}} onClick={()=>confirmDelete(trade.id)}>Delete</button>
                              </div>
                            </div>
                          )}
                        </div>
                        </SwipeToDelete>
                      );
                    })}
                  </div>
                );
              })}
              </>
            )}
          </>
        ); })()}

        {/* ADD / EDIT */}
        {view==="add"&&(
          <div onKeyDown={(e)=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();(function(){const el=document.querySelector("[data-save-trade]");if(el)el.click();})();}if(e.key==="Escape"){setView("list");}}}>
            <div className="section-title">{editId?"Edit Trade":"Log Trade"}</div>

            {/* Playbook — first so it auto-fills the fields below */}
            {playbooks.length>0&&(
            <div className="field-group">
              <label className="field-label">Playbook</label>
              <select className="field-input" value={form.playbookId||""} onChange={e=>{
                const pb = playbooks.find(p=>p.id===parseInt(e.target.value)||p.id===e.target.value);
                if(pb){
                  setFv("playbookId", pb.id);
                  // Only autofill instrument if it belongs to the current asset class
                  if(pb.instrument){
                    const ac = form.assetClass||"futures";
                    const inFutures = INSTRUMENTS.some(i=>i.symbol===pb.instrument);
                    const inCrypto = CRYPTO_INSTRUMENTS.some(i=>i.symbol===pb.instrument);

            {/* Form Validation Errors */}
            {(()=>{
              const errors=[];
              if(!form.instrument||form.instrument==="") errors.push("Instrument required");
              if(!form.date||form.date==="") errors.push("Date required");
              if(!form.direction||form.direction==="") errors.push("Direction required");
              if(!form.entry||form.entry==="") errors.push("Entry price required");
              if(!form.stop||form.stop==="") errors.push("Stop loss required");
              if(!form.outcome||form.outcome==="") errors.push("Outcome required");
              if(form.assetClass==="futures"&&form.contracts&&(parseFloat(form.contracts)<=0||form.contracts==="")) errors.push("Contracts must be at least 1");
              const entry=parseFloat(form.entry);
              const tp=parseFloat(form.exit);
              const sl=parseFloat(form.stop);
              if(form.entry&&isNaN(entry)) errors.push("Entry must be a valid number");
              if(form.exit&&isNaN(tp)) errors.push("Take Profit must be a valid number");
              if(form.stop&&isNaN(sl)) errors.push("Stop loss must be a valid number");
              if(form.direction==="Long"&&!isNaN(entry)&&!isNaN(tp)&&tp<=entry) errors.push("TP must be above entry for long trades");
              if(form.direction==="Long"&&!isNaN(entry)&&!isNaN(sl)&&sl>=entry) errors.push("SL must be below entry for long trades");
              if(form.direction==="Short"&&!isNaN(entry)&&!isNaN(tp)&&tp>=entry) errors.push("TP must be below entry for short trades");
              if(form.direction==="Short"&&!isNaN(entry)&&!isNaN(sl)&&sl<=entry) errors.push("SL must be above entry for short trades");

            {/* Trading hours warning */}

              const pad = n=>String(n).padStart(2,"0");

              if(!outside) return null;
              return(
                <div style={{background:"#f6ad5512",border:"1px solid #f6ad5530",borderRadius:10,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f6ad55" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  <span style={{fontSize:11,color:"#f6ad55",fontFamily:"DM Mono,monospace",letterSpacing:"0.04em"}}>Outside your trading hours ({tradingHoursStart} – {tradingHoursEnd})</span>
                </div>
              );
            })()}

            {!editId&&effectiveDailyLossLimit>0&&(()=>{
              const todayStr=form.date||new Date().toISOString().split("T")[0];

              const limitHit=todayPnl<0&&Math.abs(todayPnl)>=effectiveDailyLossLimit;
              const approaching=!limitHit&&todayPnl<0&&Math.abs(todayPnl)>=effectiveDailyLossLimit*0.75;

                  </div>

            <div className="grid2">

                <button onClick={()=>setFv("assetClass","crypto")} style={{flex:1,padding:"10px 12px",border:"1px solid "+(form.assetClass==="crypto"?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:form.assetClass==="crypto"?"var(--accent-bg)":"var(--input-bg)",color:form.assetClass==="crypto"?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>Crypto</button>
                <button onClick={()=>setFv("assetClass","forex")} style={{flex:1,padding:"10px 12px",border:"1px solid "+(form.assetClass==="forex"?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:form.assetClass==="forex"?"var(--accent-bg)":"var(--input-bg)",color:form.assetClass==="forex"?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>Forex</button>

            <div className="field-group">
              
    

    <label className="field-label">Instrument </label>
              <div style={{position:"relative",width:"100%"}}>
                <select className="field-input" value={form.instrument} onChange={setF("instrument")} style={{width:"100%",appearance:"none",paddingRight:"32px"}}>
                  {(form.assetClass==="crypto"?CRYPTO_INSTRUMENTS:form.assetClass==="forex"?FOREX_INSTRUMENTS:INSTRUMENTS).map(i=><option key={i.symbol} value={i.symbol}>{i.symbol} ({i.name})</option>)}
                </select>
                <div style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",pointerEvents:"none",fontSize:"12px",color:"var(--text4)"}}>▼</div>
              </div>
            </div>

            <div className="field-group">
              <label className="field-label">Direction </label>
              <div style={{display:"flex",gap:10}}>
                <button className={`dir-btn${form.direction==="Long"?" long-active":""}`} onClick={()=>setFv("direction","Long")}>▲ Long</button>
                <button className={`dir-btn${form.direction==="Short"?" short-active":""}`} onClick={()=>setFv("direction","Short")}>▼ Short</button>
              </div>
            </div>

            {/* Entry fills */}
            {/* Planned Entry (optional - for slippage tracking) */}
            {(parseFloat(form.entry)>0||form.plannedEntry)&&(
            <div className="field-group">

              const maxDailyLoss=parseFloat(activeAccount.propDailyLoss)||0;
              const maxDD=parseFloat(activeAccount.propMaxDD)||0;
              const ddType=activeAccount.propDDType||"trailing";
              // Would this trade breach daily loss?
              const dailyAfter=todayPnl-potentialLoss;
              const dailyBreached=maxDailyLoss>0&&dailyAfter<=-maxDailyLoss;
              const dailyClose=maxDailyLoss>0&&!dailyBreached&&dailyAfter<=-maxDailyLoss*0.8;
              // Would this trade breach drawdown?
              let ddFloor=0;
              if(ddType==="trailing")ddFloor=peak-maxDD;
              else if(ddType==="static")ddFloor=startBal-maxDD;
              else ddFloor=(running-todayPnl)-maxDD;
              const balAfter=running-potentialLoss;
              const ddBreached=maxDD>0&&balAfter<=ddFloor;
              const ddClose=maxDD>0&&!ddBreached&&(balAfter-ddFloor)<=maxDD*0.2;
              if(!dailyBreached&&!dailyClose&&!ddBreached&&!ddClose) return null;
              const critical=dailyBreached||ddBreached;
              return(
                <div style={{background:critical?"#ff4d6d15":"#f6ad5515",border:"1px solid "+(critical?"#ff4d6d":"#f6ad55")+"60",borderRadius:10,padding:12,marginBottom:14}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                    <span style={{fontSize:14}}>{critical?"\u26D4":"\u26A0"}</span>
                    <span style={{fontSize:11,fontWeight:600,color:critical?"#ff4d6d":"#f6ad55",fontFamily:"DM Mono,monospace",letterSpacing:"0.03em"}}>{critical?"WOULD BREACH LIMIT":"CLOSE TO LIMIT"}</span>

                  <div style={{fontSize:10,color:"var(--text3)",fontFamily:"DM Mono,monospace",lineHeight:1.6}}>
                    <div>This trade risks {fmt(potentialLoss)} at stop.</div>
                    {(dailyBreached||dailyClose)&&<div style={{color:dailyBreached?"#ff4d6d":"#f6ad55"}}>{dailyBreached?"\u2192 Breaches":"\u2192 Near"} daily loss limit ({fmt(maxDailyLoss)})</div>}
                    {(ddBreached||ddClose)&&<div style={{color:ddBreached?"#ff4d6d":"#f6ad55"}}>{ddBreached?"\u2192 Breaches":"\u2192 Near"} max drawdown floor ({fmt(ddFloor)})</div>}
                  </div>
                </div>
              );
            })()}

            {/* Bias alignment */}
            {!editId&&(()=>{
              const b=dailyBias[form.date];
              if(!b||(b.bias!=="Long"&&b.bias!=="Short")||!form.direction) return null;
              const aligned=b.bias===form.direction;
              return(
                <div style={{fontSize:10,fontFamily:"DM Mono,monospace",color:aligned?"var(--accent)":"#f6ad55",marginBottom:12,display:"flex",alignItems:"center",gap:5}}>

                  const dir=form.direction==="Long"?1:-1;
                  const mfeR=form.mfe&&!isNaN(parseFloat(form.mfe))?Math.round(dir*(parseFloat(form.mfe)-e)/risk*100)/100:null;
                  const maeR=form.mae&&!isNaN(parseFloat(form.mae))?Math.round(dir*(parseFloat(form.mae)-e)/risk*100)/100:null;

                    <div style={{fontSize:10,fontFamily:"DM Mono,monospace",marginTop:5,display:"flex",gap:12}}>

                        setFv("emotion",sel?cur.filter(x=>x!==e):[...cur,e]);
                      }}
                        style={{padding:"10px 8px",border:"1px solid "+(sel?e==="😡 Revenge"?"#ff4d6d":"var(--accent)":e==="😡 Revenge"?"#ff4d6d30":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:12,fontFamily:"DM Mono,monospace",background:sel?e==="😡 Revenge"?"#ff4d6d20":"var(--accent-bg)":e==="😡 Revenge"?"#ff4d6d08":"var(--surface2)",color:sel?e==="😡 Revenge"?"#ff4d6d":"var(--accent)":e==="😡 Revenge"?"#ff4d6d80":"var(--text3)",transition:"all 0.15s",textAlign:"left"}}>{e}</button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Size increase warning after same-day loss */}
            {!editId&&(()=>{
              const todayStr=form.date||new Date().toISOString().split("T")[0];
              const todayTrades=[...trades].filter(t=>t.date===todayStr).sort((a,b)=>(a.id||0)-(b.id||0));
              if(!todayTrades.length) return null;
              const lastTrade=todayTrades[todayTrades.length-1];
              const lastPnl=cachedCalc(lastTrade).pnl;
              const lastContracts=parseFloat(lastTrade.contracts)||1;
              const thisContracts=parseFloat(form.contracts)||1;
              if(lastPnl>=0||thisContracts<=lastContracts) return null;
              return(
                <div style={{background:"#f6ad5512",border:"1px solid #f6ad5530",borderRadius:10,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f6ad55" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

            {(formForCalc.entry&&(form.tps||[]).some(tp=>tp.price&&tp.contracts))||(filledFormEntries.length>0&&(form.tps||[]).some(tp=>tp.price&&tp.contracts))?(

                  <span style={{color:prevR>=0?"var(--accent)":"#ff4d6d"}}>{prevR>=0?"+":""}{prevR}R</span>
                </div>}
                {(()=>{const {rr}=calc(formForCalc); return rr?(<div className="pnl-box">

                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    {pb.name} rules

                  <div style={{display:"flex",flexDirection:"column",gap:3}}>
                    {pb.rules.map((r,i)=>(

                        <span style={{color:"var(--accent)",fontSize:10,marginTop:1,flexShrink:0}}>&#10003;</span>
                        <span style={{fontSize:11,color:"var(--text3)",lineHeight:1.4}}>{r.text}</span>
                      </div>

                </div>

            })()}

            {/* Pre-trade checklist */}
            {checklistItems.length>0&&(
              <div className="field-group">
                <div onClick={()=>setShowChecklist(v=>!v)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",padding:"10px 14px",background:"var(--surface2)",border:"1px solid "+((form.checklist||[]).length>0?"var(--accent-dim)":"var(--border2)"),borderRadius:8,marginBottom:showChecklist?8:0,transition:"all 0.15s"}}>
                  <label className="field-label" style={{margin:0,cursor:"pointer",color:(form.checklist||[]).length>0?"var(--accent)":"var(--text4)"}}>Pre-Trade Checklist</label>

                  ))}
                </div>
              )}
              <textarea className="field-input" rows={6}
                placeholder={(()=>{
                  if(form.mistake) return "Which rule did you break?\nWhat was the trigger that made you deviate?\nHow will you prevent this next time?";
                  if(form.outcome==="SL") return "What went wrong?\nWas the setup valid or did you enter too early?\nWhat would you do differently?";
                  if(form.outcome==="TP") return "What worked well?\nWas execution clean?\nAny lessons to carry forward?";
                  if(form.outcome==="BE") return "Why did you move to breakeven?\nWas this the right call or did you exit too early?";
                  return "Why did you take this trade?\nWhat did the market look like?\nWhat would you do differently?";
                })()}
                value={form.notes} onChange={setF("notes")}
                style={{resize:"vertical",lineHeight:1.6,fontSize:14}}/>
              {form.notes&&(
                <div style={{fontSize:10,color:"var(--text5)",marginTop:4,textAlign:"right"}}>{form.notes.length} chars · {form.notes.trim().split(/\s+/).length} words</div>
