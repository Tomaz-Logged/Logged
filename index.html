/* ── Custom Date Picker ── */
function DatePicker({value, onChange}){
  const [open, setOpen] = useState(false);
  const [viewDate, setViewDate] = useState(()=>{
    const d = value?new Date(value+"T12:00:00"):new Date();
    return {year:d.getFullYear(), month:d.getMonth()};
  });

  const selected = value?new Date(value+"T12:00:00"):null;
  const today = new Date();
  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const getDays = (year, month) => {
    const first = new Date(year, month, 1);
    const last = new Date(year, month+1, 0);
    const startDay = (first.getDay()+6)%7; // Mon=0
    const days = [];
    for(let i=0; i<startDay; i++) days.push(null);
    for(let i=1; i<=last.getDate(); i++) days.push(i);
    return days;
  };

  const days = getDays(viewDate.year, viewDate.month);
  const fmt = (d) => {
    if(!d) return "";
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  };

  const selectDay = (day) => {
    const m = String(viewDate.month+1).padStart(2,"0");
    const d = String(day).padStart(2,"0");
    onChange(viewDate.year+"-"+m+"-"+d);
    setOpen(false);
  };

  const prevMonth = (e) => { e.stopPropagation(); setViewDate(v=>v.month===0?{year:v.year-1,month:11}:{...v,month:v.month-1}); };
  const nextMonth = (e) => { e.stopPropagation(); setViewDate(v=>v.month===11?{year:v.year+1,month:0}:{...v,month:v.month+1}); };

  const isSelected = (day) => selected&&selected.getFullYear()===viewDate.year&&selected.getMonth()===viewDate.month&&selected.getDate()===day;
  const isToday = (day) => today.getFullYear()===viewDate.year&&today.getMonth()===viewDate.month&&today.getDate()===day;

  return(
    <div style={{position:"relative"}}>
      <div onClick={()=>setOpen(v=>!v)} className="field-input"
        style={{cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",userSelect:"none",borderColor:open?"var(--accent)":"var(--border2)"}}>
        <span style={{color:value?"var(--text)":"var(--text4)",fontSize:16}}>{value?fmt(new Date(value+"T12:00:00")):"Select date"}</span>
      </div>
      {open&&(
        <>
          <div style={{position:"fixed",inset:0,zIndex:199,background:"rgba(0,0,0,0.5)"}} onClick={()=>setOpen(false)}/>
          <div style={{position:"fixed",left:16,right:16,bottom:110,background:"var(--surface)",borderRadius:12,padding:"20px",zIndex:200,boxShadow:"0 -8px 40px rgba(0,0,0,0.5)",border:"1px solid var(--border)"}}>
            {/* Header */}
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
              <button aria-label="Previous month" onClick={prevMonth} style={{background:"none",border:"none",color:"var(--text3)",cursor:"pointer",fontSize:26,padding:"0 12px",lineHeight:1}}>‹</button>
              <span style={{fontFamily:"Syne,sans-serif",fontWeight:700,fontSize:18,color:"var(--text)"}}>{MONTHS[viewDate.month]} {viewDate.year}</span>
              <button aria-label="Next month" onClick={nextMonth} style={{background:"none",border:"none",color:"var(--text3)",cursor:"pointer",fontSize:26,padding:"0 12px",lineHeight:1}}>›</button>
            </div>
            {/* Day headers */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:8}}>
              {DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"var(--text4)",letterSpacing:"0.05em",paddingBottom:6}}>{d}</div>)}
            </div>
            {/* Days */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
              {days.map((day,i)=>(
                <div key={i} onClick={day?()=>selectDay(day):undefined}
                  style={{
                    textAlign:"center",padding:"12px 2px",borderRadius:10,cursor:day?"pointer":"default",fontSize:16,
                    background:isSelected(day)?"var(--accent)":isToday(day)?"var(--accent-bg)":"transparent",
                    color:isSelected(day)?"var(--bg)":isToday(day)?"var(--accent)":day?"var(--text)":"transparent",
                    fontWeight:isSelected(day)||isToday(day)?700:400,
                    transition:"all 0.15s",
                    WebkitTapHighlightColor:"transparent"
                  }}>
                  {day||""}
                </div>
              ))}
            </div>
            {/* Today shortcut */}
            <button onClick={()=>{
              const t = new Date();
              const m = String(t.getMonth()+1).padStart(2,"0");
              const d = String(t.getDate()).padStart(2,"0");
              onChange(t.getFullYear()+"-"+m+"-"+d);
              setOpen(false);
            }} style={{marginTop:16,width:"100%",background:"var(--accent-bg)",border:"1px solid var(--accent-dim)",borderRadius:10,padding:"12px",color:"var(--accent)",fontFamily:"DM Mono,monospace",fontSize:13,cursor:"pointer",fontWeight:500}}>
              Today
            </button>
          </div>
        </>
      )}
    </div>
  );
}

function AIReport({trades, stats, fmt, curr, apiKey, proxyUrl}){
  const {useState, useEffect} = React;
  const [report, setReport] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [period, setPeriod] = useState("week");

  const getPeriodTrades = () => {
    const now = new Date();
    const cutoff = new Date();
    if(period==="week") cutoff.setDate(now.getDate()-7);
    else if(period==="month") cutoff.setMonth(now.getMonth()-1);
    else return trades;
    return trades.filter(t=>new Date(t.date)>=cutoff);
  };

  const generate = async () => {
    if(!apiKey){ setError("Add your Anthropic API key in Settings → Data & Privacy."); return; }
    const pt = getPeriodTrades();
    if(!pt.length){ setError("No trades in this period."); return; }
    setLoading(true); setError(null); setReport(null);

    const sanitise = s => (s||"").replace(/[\x00-\x1F\x7F]/g," ").replace(/`/g,"'").trim();

    const tradeSummary = pt.map(t=>{
      const {pnl,ticks,r} = calc(t);
      return `${t.date}${t.time?" "+t.time:""} | ${t.instrument} | ${t.direction} | ${t.contracts} contracts | Entry: ${t.entry} | Outcome: ${t.outcome} | P&L: ${fmt(pnl)} | R: ${r!==null?r+"R":"—"} | Strategy: ${sanitise(t.strategy)} | Session: ${t.session}${t.tradeType?" | Type: "+sanitise(t.tradeType):""} | Notes: ${sanitise(t.notes)||"none"}`;
    }).join("");

    const wins = pt.filter(t=>calc(t).pnl>0);
    const losses = pt.filter(t=>calc(t).pnl<0);
    const totalPnl = pt.reduce((s,t)=>s+calc(t).pnl,0);
    const bes = pt.filter(t=>calc(t).pnl===0);
    const winRate = (wins.length+losses.length)>0?(wins.length/(wins.length+losses.length)*100).toFixed(1):0;

    const prompt = `You are a trading coach. Analyse this performance:

Period: ${period}
Trades: ${pt.length} (${winRate}% win rate)
Net P&L: ${fmt(totalPnl)}
Wins: ${wins.length}, Losses: ${losses.length}, BE: ${bes.length}
Avg R: ${stats.avgR!==undefined?stats.avgR.toFixed(2):"n/a"}
Profit Factor: ${stats.pf?stats.pf.toFixed(2):"n/a"}

Give 2-3 key strengths from this data and 2-3 areas to improve.`;;

    try {
      const requestBody = {
        model:"claude-haiku-4-5-20251001",
        max_tokens:1024,
        messages:[{role:"user",content:prompt}]
      };
      // Use proxy if set (required for iOS Safari) otherwise try direct
      const useProxy = proxyUrl && proxyUrl.trim().length > 0;
      const endpoint = useProxy ? proxyUrl.trim() : "https://api.anthropic.com/v1/messages";
      const fetchBody = useProxy
        ? JSON.stringify({apiKey: apiKey.trim(), ...requestBody})
        : JSON.stringify(requestBody);
      const fetchHeaders = useProxy
        ? {"Content-Type":"application/json"}
        : {"Content-Type":"application/json","x-api-key":apiKey.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
      const res = await fetch(endpoint, {
        method:"POST",
        headers: fetchHeaders,
        body: fetchBody
      });
      let data;
      try { data = await res.json(); }
      catch(jsonErr){ throw new Error("Could not parse API response (status "+res.status+")"); }
      if(!res.ok){
        const errType = data.error&&data.error.type;
        const errMsg = data.error&&data.error.message;
        if(res.status===401) throw new Error("Invalid API key — check it in Settings.");
        if(res.status===429) throw new Error("Rate limit — wait a moment and try again.");
        throw new Error("API "+res.status+(errType?" · "+errType:"")+(errMsg?" · "+errMsg:""));
      }
      const text = data.content&&data.content[0]&&data.content[0].text;
      if(!text) throw new Error("Empty response (status "+res.status+") — try again.");
      setReport(text);
    } catch(e) {
      setError(e.message||"Failed to generate report. Please try again.");
    }
    setLoading(false);
  };

  const renderReport = (text) => {
    return text.split("").map((line, i) => {
      if(line.startsWith("**")&&line.endsWith("**")) {
        return <div key={i} style={{fontSize:11,letterSpacing:"0.1em",textTransform:"uppercase",color:"var(--accent)",fontFamily:"Syne,sans-serif",fontWeight:700,marginTop:i>0?16:0,marginBottom:6}}>{line.replace(/\*\*/g,"")}</div>;
      }
      if(line.match(/^\d+\.\s\*\*/)) {
        const title = line.match(/\*\*([^*]+)\*\*/)[1];
        const rest = line.replace(/^\d+\.\s\*\*[^*]+\*\*\s*-?\s*/,"");
        return <div key={i} style={{marginTop:i>0?14:0}}>
          <div style={{fontSize:11,letterSpacing:"0.1em",textTransform:"uppercase",color:"var(--accent)",fontFamily:"Syne,sans-serif",fontWeight:700,marginBottom:6}}>{title}</div>
          {rest&&<div style={{fontSize:13,color:"var(--text2)",lineHeight:1.6}}>{rest}</div>}
        </div>;
      }
      if(line.trim()) return <div key={i} style={{fontSize:13,color:"var(--text2)",lineHeight:1.6,marginTop:6}}>{line}</div>;
      return null;
    });
  };

  return(
    <div>
      {/* Period selector */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[{k:"week",l:"This Week"},{k:"month",l:"This Month"},{k:"all",l:"All Time"}].map(p=>(
          <button key={p.k} onClick={()=>{setPeriod(p.k);setReport(null);}}
            style={{flex:1,padding:"8px 4px",border:"1px solid "+(period===p.k?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:10,fontFamily:"DM Mono,monospace",background:period===p.k?"var(--accent-bg)":"var(--surface2)",color:period===p.k?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>{p.l}</button>
        ))}
      </div>

      {/* Trade count for period */}
      <div style={{fontSize:11,color:"var(--text4)",marginBottom:14,textAlign:"center"}}>
        {getPeriodTrades().length} trade{getPeriodTrades().length!==1?"s":""}  in period
      </div>

      {/* Generate button */}
      {!report&&!loading&&(
        <><button onClick={generate} disabled={!getPeriodTrades().length||!apiKey}
          style={{width:"100%",background:apiKey?"var(--accent)":"var(--surface2)",color:apiKey?"var(--bg)":"var(--text4)",border:apiKey?"none":"1px solid var(--border2)",borderRadius:10,padding:"14px",fontFamily:"DM Mono,monospace",fontSize:13,fontWeight:500,letterSpacing:"0.1em",textTransform:"uppercase",cursor:apiKey?"pointer":"default",opacity:(getPeriodTrades().length&&apiKey)?1:0.5}}>
          {apiKey?"Generate AI Report":"API Key Required"}
        </button></>
      )}

      {/* Loading */}
      {loading&&(
        <div style={{textAlign:"center",padding:"40px 0"}}>
          <div style={{width:32,height:32,border:"3px solid var(--border)",borderTopColor:"var(--accent)",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 12px"}}/>
          <div style={{fontSize:12,color:"var(--text4)",fontFamily:"DM Mono,monospace"}}>Analysing your trades...</div>
        </div>
      )}

      {/* Error */}
      {error&&(
        <div style={{background:"#ff4d6d15",border:"1px solid #ff4d6d30",borderRadius:10,padding:14,fontSize:12,color:"#ff4d6d",textAlign:"center"}}>{error}</div>
      )}

      {/* Report */}
      {report&&(
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:18}}>
          {renderReport(report)}
          <button onClick={()=>{setReport(null);}} style={{marginTop:20,width:"100%",background:"none",border:"1px solid var(--border2)",borderRadius:8,padding:"10px",color:"var(--text4)",fontFamily:"DM Mono,monospace",fontSize:11,cursor:"pointer"}}>
            Generate New Report
          </button>
        </div>
      )}
    </div>
  );
}

function ImportCSV({onImport, onClose, assetClass}){
  const [stage,setStage]=React.useState("upload"); // upload | map | preview
  const [rows,setRows]=React.useState(null);
  const [headers,setHeaders]=React.useState([]);
  const [mapping,setMapping]=React.useState({});
  const [fileName,setFileName]=React.useState("");
  const [error,setError]=React.useState("");
  const [broker,setBroker]=React.useState("Generic");
  const [rawHeaders,setRawHeaders]=React.useState([]);

  const FIELDS=[
    {key:"date",label:"Date",req:true},
    {key:"time",label:"Time",req:false},
    {key:"instrument",label:"Instrument",req:true},
    {key:"direction",label:"Direction",req:false},
    {key:"contracts",label:"Contracts / Size",req:false},
    {key:"entry",label:"Entry price",req:true},
    {key:"exit",label:"Exit price",req:false},
    {key:"stop",label:"Stop price",req:false},
    {key:"pnl",label:"P&L (reference)",req:false},
  ];

  const handleFile=(e)=>{
    setError("");
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const text=ev.target.result;
        const parsed=parseCSVText(text);
        if(parsed.length<2){setError("That file has no data rows.");return;}
        // Auto-detect broker from headers
        const headerStr=parsed[0].join(",").toLowerCase();
        let detectedBroker="Generic";
        if(headerStr.includes("avg fill price")||headerStr.includes("buy time")) detectedBroker="Tradovate";
        else if(headerStr.includes("entry time")&&headerStr.includes("r|trader")||headerStr.includes("entry time")&&headerStr.includes("qty")&&headerStr.includes("entry price")) detectedBroker="Rithmic";
        else if(headerStr.includes("tradeprice")||headerStr.includes("fifopnl")) detectedBroker="IBKR";
        else if(headerStr.includes("realized profit")&&headerStr.includes("pair")) detectedBroker="Binance";
        setBroker(detectedBroker);
        setRows(parsed);
        setHeaders(parsed[0]);
        setMapping(detectCSVMapping(parsed[0]));
        setStage("map");
      }catch(err){setError("Could not read that file. Is it a valid CSV?");}
    };
    reader.onerror=()=>setError("Could not read that file.");
    reader.readAsText(file);
  };

  const preview = rows ? csvRowsToTrades(rows, mapping) : [];
  const validPreview = preview.filter(t=>t.date&&t.instrument&&t.entry!=="");
  const missingReq = FIELDS.filter(f=>f.req&&mapping[f.key]===undefined);

  const doImport=()=>{
    const ts=validPreview.map(t=>{
      const {_row,_pnl,...clean}=t;
      return {...clean, assetClass: assetClass||"futures", strategy:"", session:"", setup:"", notes:"", emotion:[], images:[], checklist:[], entries:[], imported:true, id:Date.now()+Math.floor(Math.random()*100000)};
    });
    onImport(ts);
  };

  const box={background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:8,color:"var(--text2)",fontFamily:"DM Mono,monospace",fontSize:12,padding:"8px 10px"};

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--surface)",borderTopLeftRadius:18,borderTopRightRadius:18,width:"100%",maxWidth:480,maxHeight:"88vh",overflowY:"auto",padding:"20px 18px 28px",border:"1px solid var(--border)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:13,letterSpacing:"0.1em",color:"var(--text2)",textTransform:"uppercase",fontWeight:600}}>Import CSV</div>
          <button aria-label="Close" onClick={onClose} style={{background:"none",border:"none",color:"var(--text3)",fontSize:18,cursor:"pointer",lineHeight:1}}>&#x2715;</button>
        </div>

        {stage==="upload"&&(
          <div>
            <p style={{fontSize:12,color:"var(--text4)",lineHeight:1.6,marginTop:0}}>Upload a CSV exported from your broker or platform. Logged will detect the columns and let you check the mapping before importing.</p>
            <label style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,border:"1.5px dashed var(--border2)",borderRadius:12,padding:"32px 16px",cursor:"pointer",background:"var(--surface2)"}}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span style={{fontSize:12,color:"var(--text2)",fontFamily:"DM Mono,monospace"}}>Choose CSV file</span>
              {fileName&&<span style={{fontSize:10,color:"var(--text4)"}}>{fileName}</span>}
              <input type="file" accept=".csv,text/csv" onChange={handleFile} style={{display:"none"}}/>
            </label>
            {error&&<div style={{color:"#ff4d6d",fontSize:11,marginTop:12,textAlign:"center"}}>{error}</div>}
            <div style={{marginTop:14}}>
              <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>Broker Format <span style={{fontWeight:400,textTransform:"none",letterSpacing:0,fontSize:9,color:"var(--text5)"}}>(helps with column matching)</span></div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {Object.keys(BROKER_PRESETS).map(b=>(
                  <button key={b} onClick={()=>setBroker(b)}
                    style={{padding:"5px 10px",border:"1px solid "+(broker===b?"var(--accent)":"var(--border2)"),borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"DM Mono,monospace",background:broker===b?"var(--accent-bg)":"var(--input-bg)",color:broker===b?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>
                    {b}
                  </button>
                ))}
              </div>
              {broker!=="Generic"&&BROKER_PRESETS[broker]&&<div style={{fontSize:10,color:"var(--text5)",marginTop:6,lineHeight:1.4}}>{BROKER_PRESETS[broker].note}</div>}
            </div>
          </div>
        )}

        {stage==="map"&&(
          <div>

function getTraderRank(totalR){
  if(totalR <= 0)  return {label:"Rookie Trader",     icon:"🌱", col:"#718096"};
  if(totalR < 5)   return {label:"Developing Trader", icon:"⚡", col:"#a78bfa"};
  if(totalR < 15)  return {label:"Consistent Trader", icon:"📈", col:"#60a5fa"};
  if(totalR < 30)  return {label:"Skilled Trader",    icon:"🔥", col:"#f6ad55"};
  if(totalR < 50)  return {label:"Elite Trader",      icon:"💎", col:"#00d49a"};
  return           {label:"Legendary Trader",          icon:"🏆", col:"#ffd700"};
}

// ── Shared chart components (used in both share overlays) ────
const C_BULL="#00d49a", C_BEAR="#ff4d6d";
const Candle=({x,o,h,l,c,bw,color,op=1,glow=false})=>{
  const up=c<=o;// screen coords: bullish = close higher up = smaller y
  // If no explicit color passed, colour by candle direction (TradingView style)
  const col = color || (up?C_BULL:C_BEAR);
  const top=Math.min(o,c), bot=Math.max(o,c), bH=Math.max(2.5,bot-top);
  return(<g opacity={op}>
    {glow&&<rect x={x-bw/2-1.5} y={top-1.5} width={bw+3} height={bH+3} rx="2.5" fill={col} opacity="0.18"/>}
    <line x1={x} y1={h} x2={x} y2={top} stroke={col} strokeWidth="1" strokeLinecap="round" opacity="0.65"/>
    <line x1={x} y1={bot} x2={x} y2={l} stroke={col} strokeWidth="1" strokeLinecap="round" opacity="0.65"/>
    <rect x={x-bw/2} y={top} width={bw} height={bH} rx="1.5"
      fill={col+"e6"} stroke={col} strokeWidth="1.3"/>
  </g>);
};
const yS=(price,minP,maxP,padT,cH)=>padT+cH-((price-minP)/(maxP-minP||1))*cH;
// Entry marker — a small arrow + dashed line showing where price entered the setup
const EntryMark=({x,y,col,dir})=>{
  const up=dir==="up";
  return(<g>
    <circle cx={x} cy={y} r="3" fill={col} opacity="0.9"/>
    <circle cx={x} cy={y} r="5.5" fill="none" stroke={col} strokeWidth="1" opacity="0.4"/>
  </g>);
};
function Chart3BR({isWin:_dir,col}){
  const isWin=!_dir;  // flip: badge stays correct in wrapper, drawing matches direction
  const W=260,H=160,pL=14,pR=14,pT=18,pB=16;
  const cH=H-pT-pB;
  // 7 candles: 2 down, the pivot, the reversal, then 3 continuation
  const bull=[
    {o:50,h:46,l:54,c:53},{o:53,h:49,l:62,c:60},
    {o:60,h:57,l:74,c:72},   // 1 - strong down
    {o:72,h:69,l:78,c:74},   // 2 - pivot bar at the low
    {o:74,h:52,l:76,c:54},   // 3 - reversal up
    {o:54,h:40,l:56,c:42},{o:42,h:28,l:44,c:30},
  ];
  const bear=bull.map(c=>({o:120-c.o,h:120-c.l,l:120-c.h,c:120-c.c}));
  const candles=isWin?bull:bear;
  const mn=Math.min(...candles.flatMap(c=>[c.h,c.l]))-5;
  const mx=Math.max(...candles.flatMap(c=>[c.h,c.l]))+5;
  const Y=p=>yS(p,mn,mx,pT,cH);
  const n=candles.length, slot=(W-pL-pR)/n, bw=slot*0.46;
  const b1=2,b2=3,b3=4;
  const entryY=Y(candles[b3].c);
  return(<svg width={W} height={H} viewBox={"0 0 "+W+" "+H} style={{display:"block"}}>
    <rect width={W} height={H} fill="#080b14" rx="4"/>
    {[0.25,0.5,0.75].map((f,i)=><line key={i} x1={pL} y1={pT+f*cH} x2={W-pR} y2={pT+f*cH} stroke="#ffffff" strokeWidth="0.3" opacity="0.04"/>)}
    <rect x={pL+b1*slot-1} y={pT} width={3*slot+2} height={cH} fill="#ffffff" opacity="0.05" rx="3"/>
    {[b1,b2,b3].map((bi,k)=>(
      <text key={k} x={pL+(bi+0.5)*slot} y={pT-5} textAnchor="middle" fontSize="8" fill="#ffffff" opacity="0.55" fontFamily="monospace" fontWeight="bold">{k+1}</text>
    ))}
    {candles.map((c,i)=>{
      const x=pL+(i+0.5)*slot;
      const inSetup=i>=b1&&i<=b3;
      return <Candle key={i} x={x} o={Y(c.o)} h={Y(c.h)} l={Y(c.l)} c={Y(c.c)} bw={inSetup?bw+1:bw} op={inSetup?1:0.4} glow={i===b3}/>;
    })}
    <EntryMark x={pL+(b3+0.5)*slot} y={entryY} col={col} dir={isWin?"up":"down"}/>
  </svg>);
}

function ChartFVG({isWin:_dir,col}){
  const isWin=!_dir;  // flip: badge stays correct in wrapper, drawing matches direction
  const W=260,H=160,pL=14,pR=14,pT=18,pB=16;
  const cH=H-pT-pB;
  // 7 candles: 1 setup, 3-candle impulse (gap), retrace, entry, continuation
  const bull=[
    {o:80,h:76,l:84,c:78},
    {o:78,h:68,l:80,c:70},   // 1 impulse
    {o:70,h:58,l:72,c:60},   // 2 impulse (gap)
    {o:60,h:50,l:62,c:52},   // 3 impulse
    {o:52,h:50,l:66,c:64},   // retrace into gap
    {o:64,h:54,l:66,c:56},   // entry react
    {o:56,h:42,l:58,c:44},
  ];
  const bear=bull.map(c=>({o:120-c.o,h:120-c.l,l:120-c.h,c:120-c.c}));
  const candles=isWin?bull:bear;
  const mn=Math.min(...candles.flatMap(c=>[c.h,c.l]))-5;
  const mx=Math.max(...candles.flatMap(c=>[c.h,c.l]))+5;
  const Y=p=>yS(p,mn,mx,pT,cH);
  const n=candles.length, slot=(W-pL-pR)/n, bw=slot*0.46;
  // gap between candle1 high and candle3 low
  const gapA=isWin?Y(candles[1].h):Y(candles[1].l);
  const gapB=isWin?Y(candles[3].l):Y(candles[3].h);
  const gapTop=Math.min(gapA,gapB), gapBot=Math.max(gapA,gapB);
  const gapLeft=pL+1*slot-bw/2;

/* ── Playbooks View ── */
function PlaybooksView({playbooks, setPlaybooks, trades, cachedCalc, fmt, customSessions}){
  const allSessions = [...SESSIONS, ...(customSessions||[])];
  const [showForm, setShowForm] = React.useState(false);
  const [editId, setEditId] = React.useState(null);
  const [form, setForm] = React.useState({name:"",instrument:"",direction:"",session:"",setup:"",minRR:"",maxRisk:"",notes:"",rules:[]});
  const [newRule, setNewRule] = React.useState("");
  const [expandedId, setExpandedId] = React.useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = React.useState(null);

  const blankForm = () => ({name:"",instrument:"",direction:"",session:"",setup:"",minRR:"",maxRisk:"",notes:"",rules:[]});

  const openNew = () => { setForm(blankForm()); setEditId(null); setShowForm(true); };
  const openEdit = (pb) => { setForm({...pb}); setEditId(pb.id); setShowForm(true); };

  const save = () => {
    if(!form.name.trim()) return;
    const entry = {...form, id: editId||(Date.now()+Math.floor(Math.random()*1000000))};
    if(editId) setPlaybooks(p=>p.map(x=>x.id===editId?entry:x));
    else setPlaybooks(p=>[...p,entry]);
    setShowForm(false);
    setEditId(null);
  };

  const addRule = () => {
    if(!newRule.trim()) return;
    setForm(f=>({...f, rules:[...(f.rules||[]),{id:Date.now(),text:newRule.trim()}]}));
    setNewRule("");
  };

  // Per-playbook stats
  const pbStats = (pb) => {
    const linked = trades.filter(t=>t.playbookId===pb.id);
    if(!linked.length) return null;
    const results = linked.map(t=>cachedCalc(t));
    const wins = results.filter(r=>r.pnl>0).length;
    const losses = results.filter(r=>r.pnl<0).length;
    const totalPnl = results.reduce((s,r)=>s+r.pnl,0);
    const rVals = results.map(r=>r.r).filter(r=>r!==null);
    const avgR = rVals.length ? Math.round(rVals.reduce((s,r)=>s+r,0)/rVals.length*100)/100 : null;
    const wr = (wins+losses)>0 ? Math.round(wins/(wins+losses)*100) : 0;
    return {count:linked.length, wins, losses, totalPnl, avgR, wr};
  };

  // Deviation: how often trades matched playbook criteria
  const deviationStats = (pb) => {
    const linked = trades.filter(t=>t.playbookId===pb.id);
    if(!linked.length) return null;
    let matchCount = 0;
    linked.forEach(t=>{
      let match = true;
      if(pb.instrument && t.instrument !== pb.instrument) match = false;
      if(pb.direction && t.direction !== pb.direction) match = false;
      if(pb.session && t.session !== pb.session) match = false;
      if(pb.setup && t.setup !== pb.setup) match = false;
      if(match) matchCount++;
    });
    return Math.round(matchCount/linked.length*100);
  };

  const FIELDS = [
    {k:"instrument",l:"Instrument"},
    {k:"direction",l:"Direction",opts:["Long","Short"]},
    {k:"session",l:"Session",opts:allSessions},
    {k:"setup",l:"Setup Grade",opts:["A+","A","B","C"]},
  ];

  return(
    <>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:16}}>

// ── Killzone Countdown Timer ──────────────────────────────────────────────
function KillzoneTimer({onDismiss}){
  const [now, setNow] = React.useState(new Date());
  React.useEffect(()=>{
    const t=setInterval(()=>setNow(new Date()),30000); // update every 30s
    return ()=>clearInterval(t);
  },[]);

  // Session opens in ET — use Intl API for correct timezone conversion
  // This works correctly regardless of user's local timezone
  const killzones=[
    {name:"Asia Open",   hour:20, min:0,  col:"#a78bfa"},
    {name:"London Open", hour:3,  min:0,  col:"#60a5fa"},
    {name:"NY Open",     hour:9,  min:30, col:"var(--accent)"},
    {name:"NY Close",    hour:16, min:0,  col:"#f6ad55"},
  ];

  // Get current time in ET using Intl API (handles DST automatically)
  const etTimeStr = now.toLocaleString("en-US", {timeZone:"America/New_York",hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const [etHStr,etMStr,etSStr] = etTimeStr.split(":");
  const etH=parseInt(etHStr), etM=parseInt(etMStr), etS=parseInt(etSStr||"0");
  const etNowSecs = etH*3600 + etM*60 + etS;

  let next=null, minDiff=Infinity;
  killzones.forEach(kz=>{
    const kzSecs = kz.hour*3600 + kz.min*60;
    let diff = (kzSecs - etNowSecs) * 1000;
    if(diff<=0) diff += 24*3600000; // already passed today → tomorrow
    if(diff<minDiff){minDiff=diff;next={...kz,diff};}
  });

  if(!next) return null;
  const h=Math.floor(next.diff/3600000);
  const m=Math.floor((next.diff%3600000)/60000);
  const label=h>0?h+"h "+m+"m":m+"m";
  const isImminent=next.diff<30*60000; // <30 min

  return(
    <div style={{background:isImminent?"var(--accent-bg)":"var(--surface)",border:"1px solid "+(isImminent?"var(--accent-dim)":"var(--border)"),borderRadius:10,padding:"8px 14px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:6,height:6,borderRadius:"50%",background:next.col,flexShrink:0,animation:isImminent?"pulse 1.5s infinite":undefined}}/>
        <div>
          <div style={{fontSize:9,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"DM Mono,monospace"}}>{isImminent?"Imminent":"Next Killzone"}</div>
          <div style={{fontSize:12,color:isImminent?next.col:"var(--text2)",fontFamily:"DM Mono,monospace",fontWeight:isImminent?600:400}}>
            {next.name} <span style={{color:isImminent?"var(--accent)":"var(--text4)"}}>in {label}</span>
          </div>
        </div>
      </div>
      <button onClick={onDismiss} style={{background:"none",border:"none",color:"var(--text5)",fontSize:16,cursor:"pointer",padding:"0 0 0 8px",lineHeight:1}}>×</button>
    </div>
  );
}

      if (isNaN(entry) || isNaN(stop) || isNaN(bal) || isNaN(risk)) return null;
      if (bal <= 0 || risk <= 0 || entry === stop) return null;

      return {

    else if (sortBy === "pnl") sorted.sort((a, b) => cachedCalc(b).pnl - cachedCalc(a).pnl);

  };
  const [sortOrder, setSortOrder] = useState("date"); // "date" | "r" | "pnl"

  // Group trades by date
  const [statsPeriod, setStatsPeriod] = useState("All");

  const calcCache=useMemo(()=>{
    const cache={};

    trades.forEach(t=>{
      const raw=calc(t);
      if(commRate>0){
        const contracts=parseFloat(t.contracts)||1;
        const commTotal=Math.round(commRate*contracts*2*100)/100; // round-trip (in+out)
        const netPnl=Math.round((raw.pnl-commTotal)*100)/100;
        const riskTicks=t.stop&&t.entry?Math.abs(parseFloat(t.entry)-parseFloat(t.stop)):null;
        const inst2=INSTRUMENTS.find(i=>i.symbol===t.instrument)||null;
        const riskDollars=riskTicks&&inst2?riskTicks/inst2.tickSize*inst2.tickValue*contracts:null;
        const netR=riskDollars?Math.round(netPnl/riskDollars*100)/100:raw.r;
        cache[t.id]={...raw,pnl:netPnl,r:netR,commission:commTotal,grossPnl:raw.pnl};
      } else {
        cache[t.id]={...raw,commission:0,grossPnl:raw.pnl};

    });

  },[trades,activeAccount,statsPeriod,statsPlaybook]);
  const cachedCalc=(t)=>calcCache[t.id]||calc(t);

  const groupedTrades = useMemo(()=>{

        (Array.isArray(t.emotion)?t.emotion.join(" "):t.emotion||"").toLowerCase().includes(q)||
        (t.setup||"").toLowerCase().includes(q)||
        (t.tradeType||"").toLowerCase().includes(q)||
        (t.direction||"").toLowerCase().includes(q)

    }

    // Sort by chosen order
    if(sortOrder==="r"){
      filtered.sort((a,b)=>{
        const ra=cachedCalc(a).r, rb=cachedCalc(b).r;
        if(ra===null&&rb===null) return 0;
        if(ra===null) return 1;
        if(rb===null) return -1;
        return rb-ra;
      });
      return filtered.map(t=>[t.date||"Unknown",[t]]);
    }
    if(sortOrder==="pnl"){
      filtered.sort((a,b)=>cachedCalc(b).pnl-cachedCalc(a).pnl);
      return filtered.map(t=>[t.date||"Unknown",[t]]);
    }
    if(sortOrder==="instrument"){
      filtered.sort((a,b)=>(a.instrument||"").localeCompare(b.instrument||""));
      return filtered.map(t=>[t.instrument||"Unknown",[t]]);
    }
    if(sortOrder==="duration"){
      filtered.sort((a,b)=>(b.duration||0)-(a.duration||0));

    // Default: sort newest first, group by date
    filtered.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const groups={};
    filtered.forEach(t=>{
      const key = t.date||"Unknown";
      if(!groups[key]) groups[key]=[];

    return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));
  },[trades, filterOutcome, filterInstrument, searchQuery, sortOrder, sortBy, filterDirection, filterPlaybook, filterDateFrom, filterDateTo, filterAssetClass, filterSession]);

  const stats=useMemo(()=>{
    // Filter trades by statsPeriod
    const now=new Date();
    const _monDiff=(now.getDay()+6)%7;
    const _mon=new Date(now);_mon.setDate(now.getDate()-_monDiff);
    const periodStart = statsPeriod==="This Wk"?_mon:
      statsPeriod==="1M"?new Date(now.getFullYear(),now.getMonth()-1,now.getDate()):
      statsPeriod==="3M"?new Date(now.getFullYear(),now.getMonth()-3,now.getDate()):null;
    const periodFiltered = periodStart
      ? trades.filter(t=>new Date(t.date)>=periodStart)
      : trades;
    const filteredForStats = statsPlaybook==="all"
      ? periodFiltered
      : periodFiltered.filter(t=>String(t.playbookId)===String(statsPlaybook));
    const c=filteredForStats.map(t=>({...t,...cachedCalc(t)}));
    const wins=c.filter(t=>t.pnl>0),losses=c.filter(t=>t.pnl<0);
    const totalPnl=c.reduce((s,t)=>s+t.pnl,0);
    const winRate=(wins.length+losses.length)>0?(wins.length/(wins.length+losses.length))*100:0;
    const avgWin=wins.length?wins.reduce((s,t)=>s+t.pnl,0)/wins.length:0;
    const avgLoss=losses.length?losses.reduce((s,t)=>s+t.pnl,0)/losses.length:0;
    const pf=Math.abs(avgLoss)>0?avgWin/Math.abs(avgLoss):wins.length>0?Infinity:0;
    const best=c.length?Math.max(...c.map(t=>t.pnl)):0;
    const worst=c.length?Math.min(...c.map(t=>t.pnl)):0;
    const rT=c.filter(t=>t.r!==null);
    const avgR=rT.length?rT.reduce((s,t)=>s+t.r,0)/rT.length:0;
    // Expectancy — the system quality number.
    // Dollar expectancy = average P&L per trade (what you expect to make each trade)
    // R expectancy = (winRate × avgWinR) − (lossRate × avgLossR) — account-size independent
    const decidedTrades=wins.length+losses.length;
    const expectancyDollar=decidedTrades>0?(totalPnl/c.length):0;
    const winsR=rT.filter(t=>t.pnl>0), lossesR=rT.filter(t=>t.pnl<0);

    const winRateFrac=decidedTrades>0?wins.length/decidedTrades:0;
    const expectancyR=rT.length>0?(winRateFrac*avgWinR)-((1-winRateFrac)*avgLossR):null;
    let run=0;
    const equity=[...trades].sort((a,b)=>a.date.localeCompare(b.date)||((a.id||0)-(b.id||0))).map(t=>{run+=cachedCalc(t).pnl;return{eq:run};});

    // By session
    const bySess={};
    trades.forEach(t=>{if(!t.session) return;const{pnl}=cachedCalc(t);if(!bySess[t.session])bySess[t.session]={pnl:0,count:0,wins:0};bySess[t.session].pnl+=pnl;bySess[t.session].count++;if(pnl>0)bySess[t.session].wins++;});

    // By strategy
    const bySt={};
    trades.forEach(t=>{if(!t.strategy) return;const{pnl}=cachedCalc(t);if(!bySt[t.strategy])bySt[t.strategy]={pnl:0,count:0,wins:0};bySt[t.strategy].pnl+=pnl;bySt[t.strategy].count++;if(pnl>0)bySt[t.strategy].wins++;});

    const DAYS_ORDER=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    const byDay={};

    const streak=getStreak(trades);

    const streakHistory=(()=>{

      const runs=[];

      sorted.forEach(t=>{

          if(curDir==='L') cur++;
          else{if(cur>0)runs.push({count:cur,dir:curDir});cur=1;curDir='L';}
        }
      });
      if(cur>0) runs.push({count:cur,dir:curDir});
      const best=runs.filter(r=>r.dir==='W').reduce((b,r)=>r.count>b?r.count:b,0);
      const worst=runs.filter(r=>r.dir==='L').reduce((b,r)=>r.count>b?r.count:b,0);

    trades.forEach(t=>{const{pnl}=cachedCalc(t);if(!byInst[t.instrument])byInst[t.instrument]={pnl:0,count:0,wins:0};byInst[t.instrument].pnl+=pnl;byInst[t.instrument].count++;if(pnl>0)byInst[t.instrument].wins++;});
    const byAC={futures:{pnl:0,count:0,wins:0},crypto:{pnl:0,count:0,wins:0},forex:{pnl:0,count:0,wins:0}};
    trades.forEach(t=>{const ac=t.assetClass||"futures";const{pnl}=cachedCalc(t);if(byAC[ac]){byAC[ac].pnl+=pnl;byAC[ac].count++;if(pnl>0)byAC[ac].wins++;}});


    // Max drawdown
    let peak=0, maxDD=0, runningEq=0;

    });

    const totalR=rT.reduce((s,t)=>s+t.r,0);

    const durTrades = trades.filter(t=>t.duration&&t.duration>0);

    // R-multiple distribution buckets
    const rBucketDefs=[{l:"<-2",min:-99,max:-2},{l:"-2",min:-2,max:-1},{l:"-1",min:-1,max:0},{l:"0-1",min:0,max:1},{l:"1-2",min:1,max:2},{l:"2-3",min:2,max:3},{l:">3",min:3,max:99}];
    const rValsAll=c.filter(t=>t.r!==null&&t.r!==undefined).map(t=>t.r);

    // Time-of-day breakdown (only for trades with time field)

    // Slippage stats
    const slippageTrades=c.filter(t=>t.plannedEntry&&t.entry&&parseFloat(t.plannedEntry)!==parseFloat(t.entry));
    const slippageValues=slippageTrades.map(t=>{const d=parseFloat(t.entry)-parseFloat(t.plannedEntry);return (t.direction==="Long"?1:-1)*d;});
    const avgSlippage=slippageValues.length?Math.round(slippageValues.reduce((s,v)=>s+v,0)/slippageValues.length*10000)/10000:null;
    // Excursion (MFE/MAE) analysis
    const excData=c.filter(t=>t.stop&&t.entry&&(t.mfe||t.mae)).map(t=>{
      const e=parseFloat(t.entry), s=parseFloat(t.stop);

    const excAvgMfeR=excWinners.length?excWinners.reduce((s,d)=>s+d.mfeR,0)/excWinners.length:null;

    };

    };

      case "Streak": return {val:stats.streak.count>0?`${stats.streak.count}${stats.streak.type}`:"—",col:stats.streak.type==="W"?"var(--accent)":"#ff4d6d"};
      case "Avg Win": return {val:fmts(stats.avgWin),col:"#00d49a"};
      case "Avg Loss": return {val:fmts(stats.avgLoss),col:"#ff4d6d"};
      case "Best Trade": return {val:fmt(stats.best),col:"#00d49a"};
      case "Worst Trade": return {val:fmt(stats.worst),col:"#ff4d6d"};
      case "Max Drawdown": return {val:stats.maxDD>0?"-"+fmts(stats.maxDD):"—",col:stats.maxDD>0?"#ff4d6d":"var(--text4)"};
      case "Avg Duration": return {val:stats.avgDuration>0?`${stats.avgDuration}m`:"—",col:"var(--text)"};
      case "Balance": return balance>0?{val:`${curr.symbol}${(balance+stats.totalPnl).toLocaleString(curr.locale,{minimumFractionDigits:0,maximumFractionDigits:0})}`,col:stats.totalPnl>=0?"var(--accent)":"#ff4d6d"}:{val:"—",col:"var(--text4)"};
      case "Today's P&L": {
        const todayStr=new Date().toISOString().split("T")[0];
        const tdt=trades.filter(t=>t.date===todayStr);
        if(!tdt.length) return {val:"—",col:"var(--text4)"};
        const tp=tdt.reduce((s,t)=>s+(cachedCalc(t).pnl||0),0);
        return {val:`${tp>=0?"+":""}${curr.symbol}${Math.abs(tp).toLocaleString(curr.locale,{minimumFractionDigits:0,maximumFractionDigits:0})}`,col:tp>=0?"var(--accent)":"#ff4d6d"};
      }
      default: return {val:"—",col:"var(--text4)"};
    }
  };

  ;
  const curr = CURRENCIES.find(c=>c.code===(activeAccount.currency||currency))||CURRENCIES[0];
  const fmt = n=>`${n>=0?"+":"-"}${curr.symbol}${Math.abs(n).toLocaleString(curr.locale,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const fmts = n=>`${curr.symbol}${Math.abs(n).toLocaleString(curr.locale,{minimumFractionDigits:0,maximumFractionDigits:0})}`;
  const filledFormEntries=(form.entries||[]).filter(e=>e.price&&parseFloat(e.price)>0&&parseFloat(e.contracts)>0);
  const formForCalc = filledFormEntries.length>0 ? (()=>{
    const totalECt=filledFormEntries.reduce((s,e)=>s+(parseFloat(e.contracts)||0),0);
    const wAvg=filledFormEntries.reduce((s,e)=>s+(parseFloat(e.price)||0)*(parseFloat(e.contracts)||0),0)/totalECt;
    return {...form,entry:wAvg.toFixed(2),contracts:totalECt};
  })() : form;
  const {pnl:prevPnl,ticks:prevTicks,r:prevR}=calc(formForCalc);
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.MSStream;

  if(showSplash) return <SplashScreen onDone={()=>setShowSplash(false)}/>;
  if(!unlocked) return <PinScreen onUnlock={name=>{
    setTraderName(name);
    setUnlocked(true);
    if(window.posthog) posthog.identify(name, {name:name});
  }}/>;

  const formatDate=d=>{
    const [y,m,day]=d.split("-");
    const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    if(dateFormat==="MM/DD/YYYY") return `${m}/${day}/${y}`;
    if(dateFormat==="YYYY-MM-DD") return `${y}-${m}-${day}`;
    if(dateFormat==="DD/MM/YYYY") return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
    return `${months[parseInt(m)-1]} ${parseInt(day)}, ${y}`;
  };

  const dayPnl=trades=>{
    return trades.reduce((s,t)=>s+cachedCalc(t).pnl,0);
  };

  return(
    <div className={theme==="light"?"light":""} style={{display:"flex",flexDirection:"column",height:"100%",minHeight:0,flex:1}}>
      {lightbox&&<Lightbox images={lightbox.images} start={lightbox.start} onClose={()=>setLightbox(null)}/>}
      {confirmDel&&<ConfirmDelete onConfirm={doDelete} onCancel={()=>setConfirmDel(null)}/>}

      {/* Header */}
      <div className="header" style={{position:"relative",overflow:"hidden"}}>
        {/* Account colour bar — visible when switching accounts */}
        {activeAccount.id!=="default"&&(
          <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:activeAccount.colour||"var(--accent)",opacity:0.9,zIndex:1}}/>
        )}
        <span style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:16,color:"var(--text)"}}>LOGGED</span>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {stats.streak.count>1&&(
            <div className="streak-badge" style={{color:stats.streak.type==="W"?"var(--accent)":"#ff4d6d"}}>
              {stats.streak.count}{stats.streak.type==="W"?" W":" L"}
            </div>
          )}
          {view==="add"?(
            <button className="btn-ghost" style={{padding:"6px 14px",fontSize:11,height:36}} onClick={()=>{setEditId(null);setForm(blankFormWithDefaults());setView("journal");}}>
              {editId?"Cancel":"✕ Close"}
            </button>
          ):(
            <div style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>setShowProfile(true)}>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:11,fontWeight:600,color:"var(--text)",fontFamily:"DM Mono,monospace",letterSpacing:"0.03em",lineHeight:1.2}}>{traderName||"Trader"}</div>
                <div style={{fontSize:9,color:activeAccount.colour||"var(--accent)",fontFamily:"DM Mono,monospace",letterSpacing:"0.05em",marginTop:1,opacity:0.9,display:"flex",alignItems:"center",gap:4}}><span style={{width:5,height:5,borderRadius:"50%",background:activeAccount.colour||"var(--accent)",display:"inline-block",flexShrink:0}}/>{activeAccount.name||"Default"}</div>
              </div>
              <InitialAvatar name={traderName} size={38} fontSize="sm"/>
            </div>
          )}
        </div>
      </div>

      {/* Account Menu */}
      {showAccountMenu&&(
        <div style={{position:"fixed",inset:0,zIndex:150}} onClick={()=>setShowAccountMenu(false)}>
          <div style={{position:"absolute",top:"calc(52px + env(safe-area-inset-top))",left:16,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"8px",minWidth:200,boxShadow:"0 8px 32px rgba(0,0,0,0.4)"}} onClick={e=>e.stopPropagation()}>
              {accounts.map(acc=>(
              <div key={acc.id} style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                <div onClick={()=>switchAccount(acc.id)}
                  style={{display:"flex",alignItems:"center",gap:10,flex:1,padding:"10px 12px",borderRadius:8,cursor:"pointer",background:acc.id===activeAccountId?"var(--accent-bg)":"transparent",transition:"all 0.15s"}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:acc.colour,flexShrink:0}}/>
                  <span style={{flex:1,fontSize:13,color:acc.id===activeAccountId?"var(--accent)":"var(--text)",fontFamily:"DM Mono,monospace"}}>{acc.name}</span>
                  {acc.id===activeAccountId&&<span style={{fontSize:10,color:"var(--accent)"}}>✓</span>}
                </div>
                {acc.id!=="default"&&<button onClick={()=>{
                  setNewAccountName(acc.name);
                  setNewAccountColour(acc.colour||"#00d49a");
                  setNewAccountCurrency(acc.currency||"USD");
                  setNewAccountCommission(String(acc.commissionPerContract||""));
                  setEditAccountId(acc.id);
                  setShowAccountMenu(false);
                  setShowAddAccount(true);
                }} style={{background:"none",border:"none",color:"var(--text5)",cursor:"pointer",fontSize:12,padding:"4px 6px",flexShrink:0}}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>}
                {acc.id!=="default"&&<button onClick={()=>{
                  if(acc.id===activeAccountId) switchAccount("default");
                  setAccounts(a=>a.filter(x=>x.id!==acc.id));
                  localStorage.removeItem("logged_trades_"+acc.id);
                  localStorage.removeItem("logged_balance_"+acc.id);
                }} style={{background:"none",border:"none",color:"var(--text5)",cursor:"pointer",fontSize:14,padding:"4px 6px",flexShrink:0}} onMouseEnter={e=>e.target.style.color="#ff4d6d"} onMouseLeave={e=>e.target.style.color="var(--text5)"}>×</button>}
              </div>
            ))}
            <div style={{height:1,background:"var(--border)",margin:"6px 0"}}/>
            <div onClick={()=>{setShowAccountMenu(false);setShowAddAccount(true);setEditAccountId(null);setNewAccountName("");setNewAccountColour("#00d49a");}}
              style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,cursor:"pointer",color:"var(--accent)",fontSize:13,fontFamily:"DM Mono,monospace"}}>
              <span style={{fontSize:16}}>+</span> Add Account
            </div>
          </div>
        </div>
      )}

      {/* Add Account Sheet */}
      {showAddAccount&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"flex-end"}} onMouseDown={e=>{if(e.target===e.currentTarget)setShowAddAccount(false);}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"16px 16px 0 0",padding:"20px",width:"100%",paddingBottom:`calc(40px + env(safe-area-inset-bottom))`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:16,color:"var(--text)"}}>{editAccountId?"Edit Account":"Add Account"}</div>
              <button onClick={()=>setShowAddAccount(false)} style={{background:"none",border:"none",color:"var(--text3)",fontSize:16,cursor:"pointer",lineHeight:1}}>✕</button>
            </div>
            <div className="field-group">
              <label className="field-label">Account Name</label>
              <input className="field-input" placeholder="Funded Account, Personal" value={newAccountName} onChange={e=>setNewAccountName(e.target.value)}/>
            </div>
            <div className="field-group">
              <label className="field-label">Starting Balance</label>
              <input className="field-input" type="number" placeholder="e.g. 50000" value={newAccountBalance} onChange={e=>setNewAccountBalance(e.target.value)} inputMode="decimal"/>
            </div>
            <div className="field-group">
              <label className="field-label">Colour</label>
              <div style={{display:"flex",gap:10}}>
                {ACCOUNT_COLOURS.map(col=>(
                  <div key={col} onClick={()=>setNewAccountColour(col)}
                    style={{width:28,height:28,borderRadius:"50%",background:col,cursor:"pointer",border:"3px solid "+(newAccountColour===col?"var(--text)":"transparent"),transition:"all 0.15s"}}/>
                ))}
              </div>
            </div>
            <div className="field-group">
              <label className="field-label">Currency</label>
              <div style={{display:"flex",gap:8}}>
                {CURRENCIES.map(c=>(
                  <button key={c.code} onClick={()=>setNewAccountCurrency(c.code)}
                    style={{flex:1,padding:"10px 4px",border:"1px solid "+(newAccountCurrency===c.code?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:12,fontFamily:"DM Mono,monospace",
                      background:newAccountCurrency===c.code?"var(--accent-bg)":"var(--surface2)",
                      color:newAccountCurrency===c.code?"var(--accent)":"var(--text4)"}}>
                    {c.symbol} {c.code}
                  </button>
                ))}
              </div>
            </div>
            <div className="field-group">
              <label className="field-label">Commission / Fee <span style={{fontSize:9,color:"var(--text5)",fontWeight:400}}>per contract per side ($) — 0 disables</span></label>
              <input className="field-input" type="number" inputMode="decimal" step="0.01" min="0" placeholder="e.g. 0.62 for MNQ" value={newAccountCommission} onChange={e=>setNewAccountCommission(e.target.value)}/>
            </div>
            <button className="btn-primary" onClick={()=>{
              if(!newAccountName.trim()) return;
              const id = Date.now().toString();
              const newAcc = {id, name:newAccountName.trim(), colour:newAccountColour, currency:newAccountCurrency, commissionPerContract:parseFloat(newAccountCommission)||0};
              setAccounts(a=>[...a, newAcc]);
              const bal = parseFloat(newAccountBalance)||0;
              const bk=id==="default"?"logged_balance_v1":"logged_balance_"+id;
              localStorage.setItem(bk, bal.toString());
              setNewAccountName(""); setNewAccountColour("#00d49a"); setNewAccountBalance(""); setNewAccountCurrency("USD"); setNewAccountCommission("");
              setShowAddAccount(false);
              switchAccount(id);
            }}>Create Account</button>
          </div>
        </div>
      )}

      {/* Edit Account Sheet */}
      {editingAccountId&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"flex-end"}} onMouseDown={e=>{if(e.target===e.currentTarget)setEditingAccountId(null);}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"16px 16px 0 0",padding:"20px",width:"100%",paddingBottom:"calc(40px + env(safe-area-inset-bottom))"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:16,color:"var(--text)"}}>Edit Account</div>
              <button aria-label="Cancel" onClick={()=>setEditingAccountId(null)} style={{background:"none",border:"none",color:"var(--text3)",fontSize:16,cursor:"pointer",lineHeight:1}}>✕</button>
            </div>
            <div className="field-group">
              <label className="field-label">Account Name</label>
              <input className="field-input" value={editingAccountName} onChange={e=>setEditingAccountName(e.target.value)} autoFocus/>
            </div>
            <div className="field-group">
              <label className="field-label">Starting Balance</label>
              <input className="field-input" type="number" placeholder="e.g. 50000" value={editingAccountBalance} onChange={e=>setEditingAccountBalance(e.target.value)} inputMode="decimal"/>
            </div>
            <div className="field-group">
              <label className="field-label">Colour</label>
              <div style={{display:"flex",gap:10}}>
                {ACCOUNT_COLOURS.map(col=>(
                  <div key={col} onClick={()=>setEditingAccountColour(col)}
                    style={{width:28,height:28,borderRadius:"50%",background:col,cursor:"pointer",border:"3px solid "+(editingAccountColour===col?"var(--text)":"transparent"),transition:"all 0.15s"}}/>
                ))}
              </div>
            </div>
            <div className="field-group">
              <label className="field-label">Currency</label>
              <div style={{display:"flex",gap:8}}>
                {CURRENCIES.map(c=>(
                  <button key={c.code} onClick={()=>setEditingAccountCurrency(c.code)}
                    style={{flex:1,padding:"10px 4px",border:"1px solid "+(editingAccountCurrency===c.code?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:12,fontFamily:"DM Mono,monospace",background:editingAccountCurrency===c.code?"var(--accent-bg)":"var(--surface2)",color:editingAccountCurrency===c.code?"var(--accent)":"var(--text4)"}}>
                    {c.symbol} {c.code}
                  </button>
                ))}
              </div>
            </div>
            <div className="field-group">
              <label className="field-label">Commission / Fee <span style={{fontSize:9,color:"var(--text5)",fontWeight:400}}>per contract per side ($)</span></label>
              <input className="field-input" type="number" inputMode="decimal" step="0.01" min="0" placeholder="e.g. 0.62 for MNQ" value={editingAccountCommission} onChange={e=>setEditingAccountCommission(e.target.value)}/>
            </div>

            {/* Prop-firm evaluation rules */}
            <div className="field-group" style={{borderTop:"1px solid var(--border2)",paddingTop:16,marginTop:4}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:editingPropEnabled?12:0}}>
                <div>
                  <label className="field-label" style={{margin:0}}>Prop-Firm Account</label>
                  <div style={{fontSize:9,color:"var(--text5)",marginTop:2}}>Track evaluation targets &amp; limits</div>
                </div>
                <button onClick={()=>setEditingPropEnabled(v=>!v)}
                  style={{width:44,height:26,borderRadius:13,border:"none",cursor:"pointer",background:editingPropEnabled?"var(--accent)":"var(--border)",position:"relative",transition:"background 0.2s",flexShrink:0}}>
                  <div style={{width:20,height:20,borderRadius:"50%",background:"#fff",position:"absolute",top:3,left:editingPropEnabled?21:3,transition:"left 0.2s"}}/>
                </button>
              </div>
              {editingPropEnabled&&(
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  <div>
                    <label className="field-label" style={{fontSize:10}}>Profit Target <span style={{fontSize:9,color:"var(--text5)",fontWeight:400}}>($ to pass)</span></label>
                    <input className="field-input" type="number" inputMode="decimal" step="1" min="0" placeholder="e.g. 3000" value={editingPropTarget} onChange={e=>setEditingPropTarget(e.target.value)}/>
                  </div>
                  <div>
                    <label className="field-label" style={{fontSize:10}}>Max Daily Loss <span style={{fontSize:9,color:"var(--text5)",fontWeight:400}}>($ — hard breach)</span></label>
                    <input className="field-input" type="number" inputMode="decimal" step="1" min="0" placeholder="e.g. 1000" value={editingPropDailyLoss} onChange={e=>setEditingPropDailyLoss(e.target.value)}/>
                  </div>
                  <div>
                    <label className="field-label" style={{fontSize:10}}>Max Drawdown <span style={{fontSize:9,color:"var(--text5)",fontWeight:400}}>($ from peak/start)</span></label>
                    <input className="field-input" type="number" inputMode="decimal" step="1" min="0" placeholder="e.g. 2000" value={editingPropMaxDD} onChange={e=>setEditingPropMaxDD(e.target.value)}/>
                  </div>
                  <div>
                    <label className="field-label" style={{fontSize:10}}>Drawdown Type</label>
                    <div style={{display:"flex",gap:6}}>
                      {[["trailing","Trailing"],["static","Static (EOD)"],["intraday","Intraday"]].map(([val,lbl])=>(
                        <button key={val} onClick={()=>setEditingPropDDType(val)}
                          style={{flex:1,padding:"8px 4px",border:"1px solid "+(editingPropDDType===val?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:10,fontFamily:"DM Mono,monospace",background:editingPropDDType===val?"var(--accent-bg)":"var(--surface2)",color:editingPropDDType===val?"var(--accent)":"var(--text4)"}}>
                          {lbl}
                        </button>
                      ))}
                    </div>
                    <div style={{fontSize:9,color:"var(--text5)",marginTop:6,lineHeight:1.4}}>
                      {editingPropDDType==="trailing"?"Trails your highest balance — locks profit in as you grow.":editingPropDDType==="static"?"Fixed floor below starting balance — doesn't trail.":"Resets each day from your daily starting balance."}
                    </div>
                  </div>
                </div>
              )}
            </div>

            <button className="btn-primary" onClick={()=>{
              setAccounts(a=>a.map(acc=>acc.id===editingAccountId?{...acc,name:editingAccountName,colour:editingAccountColour,currency:editingAccountCurrency,commissionPerContract:parseFloat(editingAccountCommission)||0,propEnabled:editingPropEnabled,propTarget:parseFloat(editingPropTarget)||0,propDailyLoss:parseFloat(editingPropDailyLoss)||0,propMaxDD:parseFloat(editingPropMaxDD)||0,propDDType:editingPropDDType}:acc));
              const bk=editingAccountId==="default"?"logged_balance_v1":"logged_balance_"+editingAccountId;
              const bal=parseFloat(editingAccountBalance)||0;
              localStorage.setItem(bk,bal.toString());
              if(editingAccountId===activeAccountId) setBalance(bal);
              setEditingAccountId(null);
            }}>Save Changes</button>
          </div>
        </div>
      )}
      {showProfile&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"flex-end"}} onMouseDown={e=>{if(e.target===e.currentTarget)setShowProfile(false);}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"16px 16px 0 0",padding:"20px",width:"100%",paddingBottom:`calc(20px + env(safe-area-inset-bottom))`,maxHeight:"85vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:15,color:"var(--text)"}}>Profile</div>
              <button onClick={()=>setShowProfile(false)} style={{background:"none",border:"none",color:"var(--text3)",fontSize:16,cursor:"pointer",lineHeight:1}}>✕</button>
            </div>

            {/* Avatar + name */}
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20}}>
              <InitialAvatar name={traderName} size={52} fontSize="lg" style={{border:"2px solid var(--accent-dim)"}}/>
              <div>
                <div style={{fontSize:18,color:"var(--text)",fontWeight:500,marginBottom:2}}>{traderName}</div>
                {(()=>{const rank=getTraderRank(stats.avgR&&stats.total>0?stats.avgR*stats.total:0);return(<div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:12}}>{rank.icon}</span><span style={{fontSize:10,color:rank.col,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>{rank.label}</span></div>);})()}
              </div>
            </div>

            {/* Edit name */}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:10,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8}}>Trader Name</div>
              <EditNameRow traderName={traderName} onSave={name=>{
                setTraderName(name);
                const profile = JSON.parse(localStorage.getItem(PROFILE_KEY)||"{}");
                localStorage.setItem(PROFILE_KEY, JSON.stringify({...profile, name}));
              }}/>
            </div>

            {/* Accounts */}
            <div style={{borderTop:"1px solid var(--border)",paddingTop:16,marginBottom:4}}>
              <div style={{fontSize:10,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:10}}>Accounts</div>
              {accounts.map(acc=>(
                <div key={acc.id} onClick={acc.id!==activeAccountId?()=>{setShowProfile(false);switchAccount(acc.id);}:undefined}
                  style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid var(--border)",cursor:acc.id!==activeAccountId?"pointer":"default"}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:acc.colour,flexShrink:0}}/>
                  <span style={{flex:1,fontSize:13,color:acc.id===activeAccountId?"var(--accent)":"var(--text)",fontFamily:"DM Mono,monospace"}}>{acc.name}</span>
                  {acc.id===activeAccountId?
                    <span style={{fontSize:10,color:"var(--accent)"}}>✓ Active</span>:
                    <span style={{fontSize:10,color:"var(--text4)"}}>Tap to switch</span>

              try{await navigator.clipboard.writeText(txt);setSaveToast("Copied ✓");setTimeout(()=>setSaveToast(null),2500);}catch(e){setSaveToast({msg:"Copy failed",err:true});setTimeout(()=>setSaveToast(null),2500);}
              setShareWeek(null);

              Copy to Clipboard
            </button>
            <button onClick={()=>setShareWeek(null)} style={{width:"100%",marginTop:8,background:"none",border:"1px solid var(--border2)",borderRadius:10,padding:"10px 16px",cursor:"pointer",fontSize:12,color:"var(--text3)",fontFamily:"DM Mono,monospace"}}>Close</button>
          </div>
        </div>

      {/* Undo delete toast */}
      {undoTrade&&(
        <div style={{position:"fixed",bottom:90,left:16,right:16,zIndex:500,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:"12px 16px",boxShadow:"0 8px 32px rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"space-between",animation:"fadeSlideIn 0.25s ease"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f6ad55" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <div>
              <div style={{fontSize:12,color:"var(--text2)",fontWeight:500}}>{undoTrade.instrument} trade deleted</div>

            <div style={{fontSize:13,color:"var(--text2)",lineHeight:1.5}}>{milestoneMsg}</div>
          </div>
        </div>
      )}

      {/* Share Equity Curve */}
      {shareCurve&&(()=>{
        const sym = (curr&&curr.symbol)||"$";
        const startBal = balance||0;
        const vals = startBal>0 ? stats.equity.map(e=>startBal+e.eq) : stats.equity.map(e=>e.eq);
        const mn = Math.min(...vals, startBal||0);
        const mx = Math.max(...vals, startBal||0);
        const rng = mx-mn||1;
        const W=280, H=100;
        const pts = vals.map((v,i)=>`${(i/(vals.length-1))*W},${H-((v-mn)/rng)*H}`).join(" ");
        const zy = H-((startBal-mn)/rng)*H;
        const col = stats.totalPnl>=0?"#00d49a":"#ff4d6d";
        const fmtV = v => {
          if(Math.abs(v)>=1000) return `${sym}${(v/1000).toFixed(1)}k`;
          return `${sym}${v.toFixed(0)}`;
        };
        const retPct = startBal>0?((stats.totalPnl/startBal)*100).toFixed(2):null;
        return(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:300,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}} onClick={()=>setShareCurve(false)}>
            
            <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:320,background:"#0c0f14",borderRadius:20,overflow:"hidden",border:"1px solid #1c2230"}}>
              <div style={{height:3,background:"linear-gradient(90deg,"+col+","+col+"40)"}}/>
              <div style={{padding:"20px 20px 16px"}}>
                {/* Header */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
                  <div>
                    <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:18,color:"#ffffff",lineHeight:1}}>Performance</div>
                    <div style={{fontSize:10,color:"var(--text5)",marginTop:4,letterSpacing:"0.1em",textTransform:"uppercase"}}>{stats.total} trades</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontFamily:"DM Mono,monospace",fontSize:20,fontWeight:500,color:col}}>{stats.totalPnl>=0?"+":""}{sym}{Math.abs(stats.totalPnl).toFixed(0)}</div>
                    {retPct&&<div style={{fontSize:10,color:col+"80",marginTop:2}}>{retPct>=0?"+":""}{retPct}% return</div>}
                  </div>
                </div>
                {/* Curve */}
                <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:110,overflow:"visible",marginBottom:12}}>
                  {startBal>0&&<line x1={0} y1={zy} x2={W} y2={zy} stroke="#a78bfa" strokeWidth={1} strokeDasharray="4,3" opacity={0.4}/>}
                  <polygon points={"0,"+H+" "+pts+" "+W+","+H} fill={col} fillOpacity={0.08}/>
                  <polyline points={pts} fill="none" stroke={col} strokeWidth={2} strokeLinejoin="round"/>
                  {vals.map((v,i)=>(
                    <circle key={i} cx={(i/(vals.length-1))*W} cy={H-((v-mn)/rng)*H} r={2.5} fill={col} opacity={0.5}/>
                  ))}
                  <text x={4} y={H-((vals[0]-mn)/rng)*H-6} fontSize={8} fill={col} fillOpacity={0.6}>{fmtV(vals[0])}</text>
                  <text x={W-4} y={H-((vals[vals.length-1]-mn)/rng)*H-6} fontSize={8} fill={col} fillOpacity={0.9} textAnchor="end">{fmtV(vals[vals.length-1])}</text>
                </svg>
                {/* Key stats row */}
                <div style={{height:1,background:"#1c2230",marginBottom:12}}/>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  {[
                    {l:"Win Rate",v:stats.winRate.toFixed(1)+"%"},
                    {l:"Avg R",v:stats.avgR?(stats.avgR>=0?"+":"")+stats.avgR.toFixed(2)+"R":"—"},
