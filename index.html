                })()}

              {/* By Playbook */}
              {playbooks.length>0&&(()=>{
                // Helper: execution match for one trade vs its playbook
                const execMatch=(pb,t)=>{
                  const fields=[
                    {match:!pb.instrument||pb.instrument===t.instrument},
                    {match:!pb.direction||pb.direction===t.direction},
                    {match:!pb.session||pb.session===t.session},
                    {match:!pb.setup||pb.setup===t.setup},
                  ].filter((_,i)=>[pb.instrument,pb.direction,pb.session,pb.setup][i]);
                  return fields.length?Math.round(fields.filter(f=>f.match).length/fields.length*100):100;
                };
                const pbRows=playbooks.map(pb=>{
                  const linked=trades.filter(t=>t.playbookId===pb.id);
                  if(!linked.length) return null;
                  const results=linked.map(t=>cachedCalc(t));
                  const wins=results.filter(r=>r.pnl>0).length;
                  const losses=results.filter(r=>r.pnl<0).length;
                  const totalPnl=results.reduce((s,r)=>s+r.pnl,0);
                  const rVals=results.map(r=>r.r).filter(r=>r!==null);
                  const avgR=rVals.length?Math.round(rVals.reduce((s,r)=>s+r,0)/rVals.length*100)/100:null;
                  const wr=(wins+losses)>0?Math.round(wins/(wins+losses)*100):0;
                  const execScores=linked.map(t=>execMatch(pb,t));
                  const avgExecMatch=execScores.length?Math.round(execScores.reduce((s,v)=>s+v,0)/execScores.length):null;
                  return {pb,count:linked.length,wins,losses,totalPnl,avgR,wr,avgExecMatch};
                }).filter(Boolean).sort((a,b)=>b.totalPnl-a.totalPnl);
                if(!pbRows.length) return null;
                const maxAbs=Math.max(...pbRows.map(r=>Math.abs(r.totalPnl)),1);
                return(
                  <div className="stat-card" style={{marginBottom:12}}>
                    <div onClick={()=>setOpenbyPb(v=>!v)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",marginBottom:openbyPb?14:0}}>

                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{transition:"transform 0.2s",transform:openbyPb?"rotate(180deg)":"rotate(0deg)"}}><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                    {openbyPb&&pbRows.map(({pb,count,wins,losses,totalPnl,avgR,wr})=>(
                      <div key={pb.id} style={{marginBottom:14}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                          <span style={{fontSize:12,color:"var(--text2)",fontWeight:500}}>{pb.name}</span>
                          <span style={{fontSize:11,color:"var(--text4)"}}>{count} trade{count!==1?"s":""}</span>
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                          <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>P&L</span>
                          <span style={{fontSize:12,color:totalPnl>=0?"var(--accent)":"#ff4d6d"}}>{fmt(totalPnl)}</span>
                        </div>
                        <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden",marginBottom:6}}>
                          <div style={{height:"100%",width:(Math.min(100,Math.abs(totalPnl)/maxAbs*100))+"%",background:totalPnl>=0?"var(--accent)":"#ff4d6d",borderRadius:2}}/>
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                          <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>Win Rate</span>
                          <span style={{fontSize:12,color:wr>=50?"var(--accent)":"#ff4d6d"}}>{wr}%{avgR!==null?" · "+(avgR>=0?"+":"")+avgR+"R":""}</span>
                        </div>
                        <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden",marginBottom:avgExecMatch!==null?8:0}}>
                          <div style={{height:"100%",width:wr+"%",background:wr>=50?"var(--accent)":"#ff4d6d",borderRadius:2}}/>
                        </div>
                        {avgExecMatch!==null&&(
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                          <span style={{fontSize:9,color:"var(--text4)",letterSpacing:"0.1em",textTransform:"uppercase"}}>Avg Execution</span>
                          <span style={{fontSize:12,color:avgExecMatch>=80?"var(--accent)":avgExecMatch>=60?"#f6ad55":"#ff4d6d",fontWeight:600}}>{avgExecMatch}%</span>
                        </div>
                        )}
                        {avgExecMatch!==null&&(
                        <div style={{height:4,background:"var(--tag-bg)",borderRadius:4,overflow:"hidden"}}>
                          <div style={{height:"100%",width:avgExecMatch+"%",background:avgExecMatch>=80?"var(--accent)":avgExecMatch>=60?"#f6ad55":"#ff4d6d",borderRadius:2}}/>
                        </div>
                        )}
                      </div>
                    ))}
                  </div>
                );
              })()}

              </>
            )}
            </>)}
          </>
        )}

{view==="settings"&&(

                  <button onClick={()=>setAssetClass("crypto")} style={{flex:1,padding:"10px 12px",border:"1px solid "+(assetClass==="crypto"?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:assetClass==="crypto"?"var(--accent-bg)":"var(--input-bg)",color:assetClass==="crypto"?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>Crypto</button>
                  <button onClick={()=>setAssetClass("forex")} style={{flex:1,padding:"10px 12px",border:"1px solid "+(assetClass==="forex"?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:11,fontFamily:"DM Mono,monospace",background:assetClass==="forex"?"var(--accent-bg)":"var(--input-bg)",color:assetClass==="forex"?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>Forex</button>

              <div className="field-group">

                    {(assetClass==="crypto"?CRYPTO_INSTRUMENTS:assetClass==="forex"?FOREX_INSTRUMENTS:INSTRUMENTS).map(i=><option key={i.symbol} value={i.symbol}>{i.symbol} — {i.name}</option>)}

                  <div style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",pointerEvents:"none",fontSize:"12px",color:"var(--text4)"}}>▼</div>

              <div className="grid2">

                <div className="field-group" style={{marginBottom:0}}>

                </div>

            </SettingsSection>

            {/* ── DISCIPLINE ── */}
            <SettingsSection category="RISK MANAGEMENT" title="Discipline Rules" icon="discipline">
              <div className="grid2">
                <div className="field-group">

                  style={{flex:1,fontSize:14,padding:"10px 12px"}}/>

              <div className="stat-card" style={{marginBottom:10}}>
                <div className="settings-row-label">Ticker Bar</div>
                <div style={{fontSize:11,color:"var(--text4)",marginBottom:10}}>Balance is always shown. Pick up to 4 more.</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  {ALL_STATS.map(key=>{
                    const active = tickerStats.includes(key);
                    const {val,col} = getStatVal(key);
                    return(
                      <button key={key} onClick={()=>{
                        if(active){if(tickerStats.length>1)setTickerStats(t=>t.filter(k=>k!==key));}
                        else{if(tickerStats.length<4)setTickerStats(t=>[...t,key]);}
                      }} style={{background:active?"var(--accent-bg)":"var(--input-bg)",border:"1px solid "+(active?"var(--accent-dim)":"var(--border2)"),borderRadius:8,padding:"10px 12px",cursor:"pointer",textAlign:"left",transition:"all 0.15s",opacity:(!active&&tickerStats.length>=4)?0.4:1}}>
                        <div style={{fontSize:9,letterSpacing:"0.12em",color:active?"var(--accent)":"var(--text4)",textTransform:"uppercase",marginBottom:3}}>{key}</div>
                        <div style={{fontSize:13,fontWeight:500,color:active?col:"var(--text5)"}}>{val}</div>
                      </button>
                    );
                  })}
                </div>
                <div style={{marginTop:10,fontSize:10,color:"var(--text4)",textAlign:"center"}}>{tickerStats.length}/4 selected</div>
              </div>
                <div className="settings-toggle-row">
                  <div>
                    <div style={{fontSize:13,color:"var(--text)"}}>Compact Trade Cards</div>
                    <div style={{fontSize:11,color:"var(--text4)",marginTop:2}}>Smaller cards, see more trades</div>
                  </div>
                  <div className="toggle" style={{background:compactCards?"var(--accent)":"var(--border3)"}} onClick={()=>setCompactCards(v=>!v)}>
                    <div className="toggle-thumb" style={{left:compactCards?22:3}}/>
                  </div>
                </div>
                <div style={{height:1,background:"var(--border)",margin:"12px 0"}}/>
                <div className="settings-toggle-row">
                  <div>
                    <div style={{fontSize:13,color:"var(--text)"}}>Show Checklist Score</div>
                    <div style={{fontSize:11,color:"var(--text4)",marginTop:2}}>Display score on trade cards</div>
                  </div>
                  <div className="toggle" style={{background:showCheckScore?"var(--accent)":"var(--border3)"}} onClick={()=>setShowCheckScore(v=>!v)}>
                    <div className="toggle-thumb" style={{left:showCheckScore?22:3}}/>
                  </div>
                </div>
                <div style={{height:1,background:"var(--border)",margin:"12px 0"}}/>
                <div className="settings-row-label" style={{marginBottom:8}}>Date Format</div>
                <div style={{display:"flex",gap:6}}>
                  {["DD/MM/YYYY","MM/DD/YYYY","YYYY-MM-DD"].map(f=>(
                    <button key={f} onClick={()=>setDateFormat(f)} style={{flex:1,padding:"8px 4px",border:"1px solid "+(dateFormat===f?"var(--accent)":"var(--border2)"),borderRadius:8,cursor:"pointer",fontSize:9,fontFamily:"DM Mono,monospace",background:dateFormat===f?"var(--accent-bg)":"var(--input-bg)",color:dateFormat===f?"var(--accent)":"var(--text4)",transition:"all 0.15s"}}>{f}</button>
                  ))}
                </div>
            </SettingsSection>

            {/* ── NOTIFICATIONS ── */}
            <SettingsSection category="PREFERENCES" title="Notifications" icon="notifications">
              <div className="stat-card">
                <div className="settings-toggle-row">
                  <div>
                    <div style={{fontSize:13,color:"var(--text)"}}>Daily Log Reminder</div>
                    <div style={{fontSize:11,color:"var(--text4)",marginTop:2}}>Remind me to log my trades</div>
                  </div>
                  <div className="toggle" style={{background:notifEnabled?"var(--accent)":"var(--border3)"}} onClick={()=>{
                    if(!notifEnabled){
                      if("Notification" in window){
                        Notification.requestPermission().then(p=>{
                          if(p==="granted"){setNotifEnabled(true);localStorage.setItem("logged_notif","1");}
                        });
                      }
                    } else {
                      setNotifEnabled(false);localStorage.removeItem("logged_notif");
                    }
                  }}>
                    <div className="toggle-thumb" style={{left:notifEnabled?22:3}}/>
                  </div>
                </div>
                {notifEnabled&&(
                  <div style={{marginTop:12}}>
                    <div className="settings-row-label" style={{marginBottom:6}}>Reminder Time</div>
                    <input type="time" className="field-input" value={notifTime} onChange={e=>{setNotifTime(e.target.value);localStorage.setItem("logged_notif_time",e.target.value);}}/>
                  </div>
                )}
              </div>
            </SettingsSection>

            {/* ── POINTERS ── */}
            <SettingsSection category="JOURNALING" title="Playbooks" icon="checklist">
              <PlaybooksView playbooks={playbooks} setPlaybooks={setPlaybooks} trades={trades} cachedCalc={cachedCalc} fmt={fmt} customSessions={customSessions}/>
            </SettingsSection>

            <SettingsSection category="JOURNALING" title="Journaling Pointers" icon="pointers">
              <PointersCard/>
            </SettingsSection>
            {/* ── DATA & PRIVACY ── */}
            <SettingsSection category="SECURITY" title="Data & Privacy" icon="privacy">
              <div style={{marginBottom:14}}>
                <div className="settings-row-label" style={{marginBottom:6}}>Anthropic API Key</div>
                <div style={{fontSize:11,color:"var(--text4)",marginBottom:8,lineHeight:1.5}}>Required for AI Report. Get your key at console.anthropic.com — reports cost ~$0.01–0.05 each.</div>
                <input className="field-input" type="password" placeholder="sk-ant-..."
                  value={anthropicKey} onChange={e=>{const val=e.target.value;setAnthropicKey(val);localStorage.setItem("logged_anthropic_key",val);}}/>
                {anthropicKey&&anthropicKey.length>10&&<div style={{fontSize:10,color:"var(--accent)",marginTop:4,fontWeight:600}}>✅ API Key saved to your device</div>}
                {anthropicKey&&anthropicKey.length<=10&&<div style={{fontSize:10,color:"#ff6b6b",marginTop:4}}>⚠️ Key seems too short</div>}
                <div style={{height:1,background:"var(--border)",margin:"14px 0"}}/>
                <div className="settings-row-label" style={{marginBottom:6}}>Proxy URL <span style={{color:"var(--accent)",fontSize:9,letterSpacing:"0.08em",marginLeft:6,background:"var(--accent-bg)",border:"1px solid var(--accent-dim)",borderRadius:4,padding:"1px 6px"}}>iOS REQUIRED</span></div>
                <div style={{fontSize:11,color:"var(--text4)",marginBottom:8,lineHeight:1.6}}>iOS Safari blocks direct API calls. Deploy the free Cloudflare Worker proxy (see <span style={{color:"var(--accent)"}}>HANDOFF.md</span> for instructions) and paste the URL here.</div>
                <input className="field-input" type="url" placeholder="https://logged-proxy.yourname.workers.dev"
                  value={proxyUrl} onChange={e=>{const val=e.target.value;setProxyUrl(val);localStorage.setItem("logged_proxy_url",val);}}/>
                {proxyUrl&&proxyUrl.startsWith("https://")&&<div style={{fontSize:10,color:"var(--accent)",marginTop:4,fontWeight:600}}>✅ Proxy URL saved — AI Report tab is now available in Stats</div>}
                {!(proxyUrl&&proxyUrl.startsWith("https://"))&&<div style={{fontSize:10,color:"var(--text5)",marginTop:4,lineHeight:1.5}}>The AI Report tab stays hidden until a proxy URL is set — direct browser calls to the API are blocked on iOS.</div>}
                {proxyUrl&&!proxyUrl.startsWith("https://")&&<div style={{fontSize:10,color:"#ff6b6b",marginTop:4}}>⚠️ URL should start with https://</div>}
              </div>
              <div style={{height:1,background:"var(--border)",marginBottom:14}}/>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                <div>
                  <div style={{fontSize:13,color:"var(--text)"}}>Export Backup</div>
                  <div style={{fontSize:11,color:"var(--text4)",marginTop:2}}>Download all data as JSON</div>
                </div>
                <div style={{display:"flex",gap:6,flexShrink:0}}>
                  <button onClick={()=>{
                    const n=exportFullBackup(trades.length);
                    setBackupMeta({ts:Date.now(),count:trades.length});
                    setSaveToast({msg:"Backup saved — "+n+" items"});setTimeout(()=>setSaveToast(null),2500);
                  }} style={{background:"var(--accent-bg)",border:"1px solid var(--accent-dim)",borderRadius:6,padding:"7px 14px",color:"var(--accent)",fontFamily:"DM Mono,monospace",fontSize:11,cursor:"pointer"}}>Back up</button>
                  <button onClick={()=>document.getElementById("backupFileInput").click()}
                    style={{background:"none",border:"1px solid var(--border3)",borderRadius:6,padding:"7px 14px",color:"var(--text3)",fontFamily:"DM Mono,monospace",fontSize:11,cursor:"pointer"}}>Restore</button>
                  <input type="file" id="backupFileInput" accept=".json,application/json" style={{display:"none"}} onChange={handleBackupFile}/>
                </div>
              </div>
              {backupMeta&&backupMeta.ts&&(
                <div style={{fontSize:10,color:"var(--text5)",fontFamily:"DM Mono,monospace",padding:"0 14px",marginTop:-6,marginBottom:10}}>Last backup: {new Date(backupMeta.ts).toLocaleDateString()} · everything incl. accounts, playbooks, prop rules &amp; bias — excl. PIN/API keys</div>
              )}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",background:"#ff4d6d08",border:"1px solid #ff4d6d20",borderRadius:8}}>
                <div>
                  <div style={{fontSize:13,color:"#ff4d6d"}}>Clear All Data</div>
                  <div style={{fontSize:11,color:"var(--text4)",marginTop:2}}>Permanently delete everything</div>
                </div>
                <button onClick={()=>setShowClearConfirm(true)} style={{background:"none",border:"1px solid #ff4d6d40",borderRadius:6,padding:"7px 14px",color:"#ff4d6d80",fontFamily:"DM Mono,monospace",fontSize:11,cursor:"pointer",flexShrink:0}}>Clear</button>
              </div>
            </SettingsSection>

            {showClearConfirm&&(
              <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 32px"}}>
                <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,padding:24,width:"100%",maxWidth:320,textAlign:"center"}}>
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#f6ad55" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{marginBottom:12}}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                  <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:16,color:"var(--text)",marginBottom:8}}>Clear All Data?</div>
                  <div style={{fontSize:12,color:"var(--text4)",marginBottom:24,lineHeight:1.6}}>This will permanently delete all your trades, goals and settings. This cannot be undone.</div>
                  <div style={{display:"flex",gap:10}}>
                    <button className="btn-ghost" style={{flex:1}} onClick={()=>setShowClearConfirm(false)}>Cancel</button>
                    <button onClick={()=>{
                      Object.keys(localStorage).filter(k=>k.startsWith("logged")).forEach(k=>localStorage.removeItem(k));
                      window.location.reload();
                    }} style={{flex:1,background:"#ff4d6d",color:"#fff",border:"none",borderRadius:8,padding:"12px",fontFamily:"DM Mono,monospace",fontSize:12,cursor:"pointer",fontWeight:500}}>Delete Everything</button>
                  </div>
                </div>
              </div>
            )}

            <div style={{marginTop:32,textAlign:"center",paddingBottom:8}}>
              <div style={{fontSize:9,letterSpacing:"0.12em",color:"var(--text4)",textTransform:"uppercase"}}>Logged · Futures Journal</div>
              <div style={{fontSize:11,color:"var(--text3)",marginTop:8,letterSpacing:"0.12em",textTransform:"uppercase",fontFamily:"Syne,sans-serif",fontWeight:700}}>LOGGED IT. LEARNED IT. OWNED IT.</div>
              <div style={{fontSize:9,color:"var(--text5)",marginTop:4}}>v1.0</div>
            </div>
          </>
        )}

        {/* GOALS */}
        {view==="goals"&&<GoalsView trades={trades} goals={goals} setGoals={setGoals} fmt={fmt} calc={calc} playbooks={playbooks} goalColour={goalColour} setShareGoal={setShareGoal} shareCardStyle={shareCardStyle} setShareCardStyle={setShareCardStyle} traderName={traderName}/> }
      </div>

      {/* Bottom Nav */}
      <div className="bottom-nav">
        <button aria-label="Journal" aria-current={view==="journal"?"page":undefined} className={`nav-item${view==="journal"?" active":""}`} onClick={()=>{setShowSaveConfirm(false);setView("journal");}}>
          <div className="nav-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          </div>
          Journal
        </button>
        <button aria-label="Stats" aria-current={view==="stats"?"page":undefined} className={`nav-item${view==="stats"?" active":""}`} onClick={()=>{setShowSaveConfirm(false);setView("stats");}}>
          <div className="nav-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
            </svg>
          </div>
          Stats
        </button>
        <button aria-label="Log a trade" aria-current={view==="add"?"page":undefined} className={`nav-item${view==="add"?" active":""}`} onClick={()=>{setForm(blankFormWithDefaults());setEditId(null);setShowEmotion(false);setShowChecklist(false);setShowTradeType(false);setShowSaveConfirm(false);setCustomStrategy(false);setCustomSetup(false);setView("add");}}>
          <div className="nav-icon-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          Log
        </button>
        <button aria-label="Goals" aria-current={view==="goals"?"page":undefined} className={`nav-item${view==="goals"?" active":""}`} onClick={()=>{setShowSaveConfirm(false);setView("goals");}}>
          <div className="nav-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
            </svg>
          </div>
          Goals
        </button>
        <button aria-label="Settings" aria-current={view==="settings"?"page":undefined} className={`nav-item${view==="settings"?" active":""}`} onClick={()=>{setShowSaveConfirm(false);setView("settings");}}>
          <div className="nav-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </div>
          Settings
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
